<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bustime Admin</title>
<style>
  :root { --p:#1976D2; --pd:#0D47A1; --bg:#F5F5F5; --card:#fff; --line:#E0E0E0; --red:#C62828; --green:#2E7D32; --warn:#E65100; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Noto Sans", "Noto Sans Devanagari", "Noto Sans Gurmukhi", sans-serif; background:var(--bg); color:#212121; font-size:16px; }
  header { background:var(--p); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; flex:1; }
  #dirty { background:#FFB300; color:#000; border-radius:12px; padding:2px 10px; font-size:13px; display:none; }
  nav { display:flex; overflow-x:auto; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:48px; z-index:4; }
  nav button { flex:0 0 auto; border:0; background:none; padding:14px 16px; font-size:15px; border-bottom:3px solid transparent; color:#424242; }
  nav button.on { color:var(--p); border-bottom-color:var(--p); font-weight:600; }
  main { padding:12px; max-width:900px; margin:0 auto; }
  .bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .bar input { flex:1; min-width:140px; }
  input, select, textarea { font:inherit; padding:10px; border:1px solid #BDBDBD; border-radius:8px; background:#fff; width:100%; }
  label { display:block; font-size:13px; color:#616161; margin:10px 0 4px; }
  button { font:inherit; padding:10px 14px; border:1px solid #BDBDBD; border-radius:8px; background:#fff; cursor:pointer; }
  button.primary { background:var(--p); color:#fff; border-color:var(--p); }
  button.danger { color:var(--red); border-color:#EF9A9A; }
  button:disabled { opacity:.5; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .item { background:var(--card); border-radius:10px; padding:12px; margin-bottom:8px; display:flex; gap:8px; align-items:center; box-shadow:0 1px 2px rgba(0,0,0,.1); }
  .item .grow { flex:1; min-width:0; }
  .sub { font-size:13px; color:#616161; overflow-wrap:anywhere; }
  .tag { font-size:12px; background:#E3F2FD; color:var(--pd); border-radius:8px; padding:1px 8px; margin-left:6px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stoprow { display:flex; gap:6px; margin-bottom:6px; }
  .stoprow select { flex:2; } .stoprow input { flex:1; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .chip { background:#E3F2FD; border-radius:16px; padding:6px 6px 6px 14px; display:flex; align-items:center; gap:6px; }
  .chip button { padding:2px 8px; border-radius:12px; }
  .msg-err { color:var(--red); } .msg-warn { color:var(--warn); } .msg-ok { color:var(--green); }
  ul.rep { padding-left:20px; margin:6px 0; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#323232; color:#fff; padding:10px 18px; border-radius:20px; display:none; z-index:20; max-width:90%; }
  .hint { font-size:13px; color:#616161; line-height:1.5; }
  .btnrow { display:flex; gap:8px; margin-top:14px; }
</style>
</head>
<body>
<header><h1>Bustime Admin</h1><span id="dirty">● बिना सेव किए बदलाव</span></header>
<nav id="tabs"></nav>
<main id="view"></main>
<div id="toast"></div>

<script>
// ============ सेटिंग (सिर्फ़ इसी ब्राउज़र में सेव रहती है) ============
var CFG_KEY = 'bustime_admin_cfg';
var DEFAULT_CFG = { owner:'amarjeetmaan3', repo:'Bustime', branch:'main', path:'app/src/main/assets/routes.json', token:'' };
var cfg = loadCfg();
function loadCfg() {
  try { return Object.assign({}, DEFAULT_CFG, JSON.parse(localStorage.getItem(CFG_KEY) || '{}')); }
  catch (e) { return Object.assign({}, DEFAULT_CFG); }
}
function saveCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} }

// ============ स्थिति ============
var data = null, sha = null, baseVersion = 0, dirty = false;
var tab = 'settings', editing = null;
var filters = { places:'', routes:'', drivers:'', driverType:'' };

var TABS = [
  ['settings','सेटिंग'], ['places','जगहें'], ['routes','बस रूट'],
  ['seaters','टैक्सी सीटर'], ['drivers','ड्राइवर'], ['publish','प्रकाशित करें']
];

// ============ छोटे औज़ार ============
function $(s) { return document.querySelector(s); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 3500);
}
function b64encode(str) {
  var bytes = new TextEncoder().encode(str), bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(b64) {
  var bin = atob(b64.replace(/\s/g, '')), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function pname(p) { var n = (p && p.name) || {}; return n.en || n.hi || n.pa || (p && p.id) || ''; }
function placeById(id) { return data.places.find(function (p) { return p.id === id; }); }
function placeText(p) {
  var n = Object.keys(p.name || {}).map(function (k) { return p.name[k]; });
  return (n.concat(p.aliases || [], [p.id])).join(' ').toLowerCase();
}
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); }
function makeId(prefix, base, exists) {
  var b = prefix + (slug(base) || 'x'), id = b, n = 2;
  while (exists(id)) { id = b + '_' + n++; }
  return id;
}
function nextNum(prefix, list) {
  var max = 0;
  list.forEach(function (x) {
    var m = String(x.id || '').match(new RegExp('^' + prefix + '(\\d+)$'));
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return prefix + (max + 1);
}
function setDirty(v) { dirty = v; $('#dirty').style.display = v ? 'inline-block' : 'none'; }
window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
var TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;

// ============ GitHub ============
function apiUrl() {
  return 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + cfg.path;
}
function ghHeaders() {
  var h = { 'Accept': 'application/vnd.github+json' };
  if (cfg.token) h['Authorization'] = 'Bearer ' + cfg.token;
  return h;
}
function normalize(d) {
  var o = { dataVersion: d.dataVersion || 0, places: d.places || [], routes: d.routes || [],
            taxiSeaters: d.taxiSeaters || [], drivers: d.drivers || [] };
  if (d._note) o._note = d._note;
  return o;
}
async function loadData() {
  var r = await fetch(apiUrl() + '?ref=' + encodeURIComponent(cfg.branch) + '&t=' + Date.now(),
                      { headers: ghHeaders(), cache: 'no-store' });
  if (!r.ok) throw new Error('GitHub ' + r.status + ' — ' + (await r.text()).slice(0, 160));
  var j = await r.json();
  if (!j.content) throw new Error('फाइल पढ़ी नहीं जा सकी');
  data = normalize(JSON.parse(b64decode(j.content)));
  sha = j.sha; baseVersion = data.dataVersion || 0; setDirty(false); editing = null;
}
async function publish() {
  if (!cfg.token) { toast('पहले सेटिंग में GitHub token डालो'); return; }
  var v = validate();
  if (v.errors.length) { toast('पहले गलतियाँ ठीक करो'); return; }
  var out = {};
  if (data._note) out._note = data._note;
  out.dataVersion = baseVersion + 1;
  out.places = data.places; out.routes = data.routes;
  out.taxiSeaters = data.taxiSeaters; out.drivers = data.drivers;
  var body = {
    message: 'Data update v' + out.dataVersion + ' [skip ci]',
    content: b64encode(JSON.stringify(out, null, 2) + '\n'),
    sha: sha, branch: cfg.branch
  };
  var h = ghHeaders(); h['Content-Type'] = 'application/json';
  var r = await fetch(apiUrl(), { method: 'PUT', headers: h, body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) {
    throw new Error('फाइल इस बीच कहीं और से बदल गई। "GitHub से दोबारा लोड करो" दबाओ (तुम्हारे बदलाव मिट जाएँगे)।');
  }
  if (!r.ok) throw new Error('GitHub ' + r.status + ' — ' + (await r.text()).slice(0, 160));
  var j = await r.json();
  sha = j.content.sha; baseVersion = out.dataVersion; data.dataVersion = out.dataVersion; setDirty(false);
}

// ============ जाँच (ऐप के importer जैसे ही नियम) ============
function validate() {
  var errors = [], warnings = [];
  var pids = {};
  data.places.forEach(function (p) {
    if (!p.id) errors.push('बिना id की एक जगह');
    else if (pids[p.id]) errors.push('जगह का id दो बार: ' + p.id);
    pids[p.id] = true;
    var hasName = Object.keys(p.name || {}).some(function (k) { return String(p.name[k] || '').trim(); });
    if (!hasName) errors.push('जगह "' + p.id + '" का कोई नाम नहीं');
  });
  var noHi = data.places.filter(function (p) { return !(p.name && p.name.hi); }).length;
  var noPa = data.places.filter(function (p) { return !(p.name && p.name.pa); }).length;
  if (noHi) warnings.push(noHi + ' जगहों का हिंदी नाम नहीं है');
  if (noPa) warnings.push(noPa + ' जगहों का पंजाबी नाम नहीं है');

  var rids = {};
  data.routes.forEach(function (r) {
    var tag = 'रूट ' + r.id;
    if (!r.id) errors.push('बिना id का एक रूट');
    else if (rids[r.id]) errors.push('रूट id दो बार: ' + r.id);
    rids[r.id] = true;
    if (!pids[r.from]) errors.push(tag + ': "कहाँ से" जगह मौजूद नहीं');
    if (!pids[r.to]) errors.push(tag + ': "कहाँ तक" जगह मौजूद नहीं');
    if (r.from && r.from === r.to) errors.push(tag + ': From और To एक ही हैं');
    if (!TIME_RE.test(r.time || '')) errors.push(tag + ': समय गलत');
    (r.stops || []).forEach(function (s) {
      if (!pids[s.place]) errors.push(tag + ': कोई पड़ाव मौजूद नहीं');
    });
  });

  var dids = {};
  data.drivers.forEach(function (d) {
    var tag = 'ड्राइवर ' + (d.name || d.id);
    if (!d.id) errors.push('बिना id का एक ड्राइवर');
    else if (dids[d.id]) errors.push('ड्राइवर id दो बार: ' + d.id);
    dids[d.id] = true;
    if (d.type !== 'taxi' && d.type !== 'auto') errors.push(tag + ': प्रकार गलत');
    if (!String(d.name || '').trim()) errors.push(tag + ': नाम ज़रूरी है');
    var digits = String(d.phone || '').replace(/\D/g, '').length;
    if (digits < 10 || digits > 13) errors.push(tag + ': मोबाइल नंबर गलत');
    if (d.type === 'taxi' && !(d.seats > 0)) errors.push(tag + ': टैक्सी में सीटर ज़रूरी है');
  });
  var hidden = data.drivers.filter(function (d) {
    return d.type === 'taxi' && data.taxiSeaters.length && data.taxiSeaters.indexOf(d.seats) < 0;
  }).length;
  if (hidden) warnings.push(hidden + ' टैक्सी ड्राइवर ऐप में नहीं दिखेंगे (उनका सीटर "टैक्सी सीटर" सूची में नहीं है)');
  return { errors: errors, warnings: warnings };
}

// ============ स्क्रीन बनाना ============
function render() {
  $('#tabs').innerHTML = TABS.map(function (t) {
    return '<button data-act="tab" data-t="' + t[0] + '" class="' + (tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>';
  }).join('');
  var v = $('#view');
  if (tab !== 'settings' && !data) {
    v.innerHTML = '<div class="card">पहले "सेटिंग" में जाकर GitHub से डेटा लोड करो।</div>';
    return;
  }
  var fn = { settings: viewSettings, places: viewPlaces, routes: viewRoutes,
             seaters: viewSeaters, drivers: viewDrivers, publish: viewPublish }[tab];
  v.innerHTML = fn();
}

function viewSettings() {
  return '<div class="card"><b>GitHub से जुड़ना</b>' +
    '<label>GitHub username</label><input id="c_owner" value="' + esc(cfg.owner) + '">' +
    '<label>Repository</label><input id="c_repo" value="' + esc(cfg.repo) + '">' +
    '<label>Branch</label><input id="c_branch" value="' + esc(cfg.branch) + '">' +
    '<label>डेटा फाइल का पाथ</label><input id="c_path" value="' + esc(cfg.path) + '">' +
    '<label>GitHub token (सिर्फ़ इसी ब्राउज़र में रहेगा)</label><input id="c_token" type="password" value="' + esc(cfg.token) + '">' +
    '<div class="btnrow"><button class="primary" data-act="save-cfg">सेव करो और डेटा लोड करो</button></div>' +
    (data ? '<p class="msg-ok">लोड हो गया: dataVersion ' + baseVersion + ' · ' + data.places.length + ' जगहें · ' +
            data.routes.length + ' रूट · ' + data.drivers.length + ' ड्राइवर</p>' : '') + '</div>' +
    '<div class="card hint"><b>Token कैसे बनाएँ (एक बार):</b><br>' +
    'GitHub → अपनी फोटो → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.<br>' +
    '• Repository access: सिर्फ़ <b>Bustime</b> चुनो<br>• Permissions → Repository permissions → <b>Contents: Read and write</b><br>' +
    'बना हुआ token यहाँ चिपका दो। इसे किसी को मत देना, और रिपो में कभी मत डालना।</div>';
}

function viewPlaces() {
  var q = filters.places.toLowerCase();
  var rows = data.places.map(function (p, i) { return { p: p, i: i }; })
    .filter(function (x) { return !q || placeText(x.p).indexOf(q) >= 0; });
  return '<div class="bar"><input id="f_places" data-filter="places" placeholder="जगह खोजो" value="' + esc(filters.places) + '">' +
    '<button class="primary" data-act="new-place">＋ नई जगह</button></div>' +
    (editing && editing.type === 'place' ? placeForm() : '') +
    rows.map(function (x) {
      var p = x.p;
      return '<div class="item"><div class="grow"><b>' + esc(pname(p)) + '</b><span class="tag">' + (p.kind === 'stand' ? 'बस स्टैंड' : 'जगह') + '</span>' +
        '<div class="sub">' + esc([(p.name || {}).hi, (p.name || {}).pa].filter(Boolean).join(' • ')) + '</div></div>' +
        '<button data-act="edit-place" data-i="' + x.i + '">बदलो</button>' +
        '<button class="danger" data-act="del-place" data-i="' + x.i + '">हटाओ</button></div>';
    }).join('') || '<div class="card">कोई जगह नहीं</div>';
}
function placeForm() {
  var p = editing.draft, n = p.name || {};
  return '<div class="card"><b>' + (editing.index < 0 ? 'नई जगह' : 'जगह बदलो') + '</b>' +
    '<label>प्रकार</label><select id="fp_kind"><option value="place"' + (p.kind !== 'stand' ? ' selected' : '') + '>जगह / शहर / गाँव</option>' +
    '<option value="stand"' + (p.kind === 'stand' ? ' selected' : '') + '>बस स्टैंड</option></select>' +
    '<label>नाम — English</label><input id="fp_en" value="' + esc(n.en) + '">' +
    '<label>नाम — हिंदी</label><input id="fp_hi" value="' + esc(n.hi) + '">' +
    '<label>नाम — ਪੰਜਾਬੀ</label><input id="fp_pa" value="' + esc(n.pa) + '">' +
    '<label>दूसरे लिखने के तरीके (कॉमा से अलग)</label><input id="fp_alias" value="' + esc((p.aliases || []).join(', ')) + '">' +
    '<div class="grid2"><div><label>शहर</label><input id="fp_city" value="' + esc(p.city) + '"></div>' +
    '<div><label>ज़िला</label><input id="fp_dist" value="' + esc(p.district) + '"></div></div>' +
    '<div class="btnrow"><button class="primary" data-act="save-place">सेव</button><button data-act="cancel">रद्द</button></div></div>';
}

function viewRoutes() {
  var q = filters.routes.toLowerCase();
  var rows = data.routes.map(function (r, i) { return { r: r, i: i }; }).filter(function (x) {
    var t = (pname(placeById(x.r.from)) + ' ' + pname(placeById(x.r.to)) + ' ' + (x.r.service || '')).toLowerCase();
    return !q || t.indexOf(q) >= 0;
  });
  return '<div class="bar"><input id="f_routes" data-filter="routes" placeholder="रूट खोजो" value="' + esc(filters.routes) + '">' +
    '<button class="primary" data-act="new-route">＋ नया रूट</button></div>' +
    (editing && editing.type === 'route' ? routeForm() : '') +
    rows.map(function (x) {
      var r = x.r;
      return '<div class="item"><div class="grow"><b>' + esc(r.time) + '</b> ' + esc(pname(placeById(r.from))) + ' → ' + esc(pname(placeById(r.to))) +
        '<div class="sub">' + esc(r.service || '') + ' ' + ((r.stops || []).length ? '· ' + r.stops.length + ' पड़ाव' : '') + '</div></div>' +
        '<button data-act="edit-route" data-i="' + x.i + '">बदलो</button>' +
        '<button class="danger" data-act="del-route" data-i="' + x.i + '">हटाओ</button></div>';
    }).join('') || '<div class="card">कोई रूट नहीं</div>';
}
function placeOptions(sel) {
  var list = data.places.slice().sort(function (a, b) { return pname(a).localeCompare(pname(b)); });
  return '<option value="">— चुनो —</option>' + list.map(function (p) {
    return '<option value="' + esc(p.id) + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(pname(p)) + '</option>';
  }).join('');
}
function stopRow(place, time) {
  return '<div class="stoprow"><select class="st_place">' + placeOptions(place) + '</select>' +
    '<input type="time" class="st_time" value="' + esc(time || '') + '">' +
    '<button data-act="rm-stop">✕</button></div>';
}
function routeForm() {
  var r = editing.draft;
  return '<div class="card"><b>' + (editing.index < 0 ? 'नया रूट' : 'रूट बदलो') + '</b>' +
    '<label>कहाँ से</label><select id="fr_from">' + placeOptions(r.from) + '</select>' +
    '<label>कहाँ तक</label><select id="fr_to">' + placeOptions(r.to) + '</select>' +
    '<div class="grid2"><div><label>चलने का समय</label><input id="fr_time" type="time" value="' + esc(r.time) + '"></div>' +
    '<div><label>पहुँचने का समय (वैकल्पिक)</label><input id="fr_arrive" type="time" value="' + esc(r.arrive) + '"></div></div>' +
    '<label>सर्विस / कंपनी का नाम (वैकल्पिक)</label><input id="fr_service" value="' + esc(r.service) + '">' +
    '<label>संपर्क नंबर (वैकल्पिक)</label><input id="fr_contact" inputmode="tel" value="' + esc(r.contact) + '">' +
    '<label>जानकारी (वैकल्पिक)</label><input id="fr_info" value="' + esc(r.info) + '">' +
    '<label>बीच के पड़ाव (क्रम से)</label><div id="stops">' +
    (r.stops || []).map(function (s) { return stopRow(s.place, s.time); }).join('') + '</div>' +
    '<button data-act="add-stop">＋ पड़ाव जोड़ो</button>' +
    '<div class="btnrow"><button class="primary" data-act="save-route">सेव</button><button data-act="cancel">रद्द</button></div></div>';
}

function viewSeaters() {
  var counts = {};
  data.drivers.forEach(function (d) { if (d.type === 'taxi') counts[d.seats] = (counts[d.seats] || 0) + 1; });
  return '<div class="card"><b>टैक्सी के सीटर विकल्प</b>' +
    '<p class="hint">ऐप में टैक्सी खोलने पर यूज़र को सिर्फ़ यही विकल्प दिखेंगे। जिस सीटर की गाड़ी नहीं है उसे हटा दो।</p>' +
    '<div class="chips">' + (data.taxiSeaters.map(function (n) {
      return '<span class="chip">' + n + ' सीटर · ' + (counts[n] || 0) + ' गाड़ी <button data-act="rm-seater" data-n="' + n + '">✕</button></span>';
    }).join('') || '<span class="hint">कोई विकल्प नहीं (ऐसे में विकल्प ड्राइवरों के सीटर से बनेंगे)</span>') + '</div>' +
    '<div class="bar"><input id="newSeater" type="number" min="1" placeholder="जैसे 6">' +
    '<button class="primary" data-act="add-seater">＋ जोड़ो</button></div></div>';
}

function viewDrivers() {
  var q = filters.drivers.toLowerCase(), t = filters.driverType;
  var rows = data.drivers.map(function (d, i) { return { d: d, i: i }; }).filter(function (x) {
    if (t && x.d.type !== t) return false;
    return !q || (String(x.d.name) + ' ' + x.d.phone + ' ' + (x.d.vehicle || '')).toLowerCase().indexOf(q) >= 0;
  });
  return '<div class="bar"><input id="f_drivers" data-filter="drivers" placeholder="नाम / नंबर खोजो" value="' + esc(filters.drivers) + '">' +
    '<select id="f_dtype" style="max-width:130px"><option value="">सब</option><option value="taxi"' + (t === 'taxi' ? ' selected' : '') + '>टैक्सी</option>' +
    '<option value="auto"' + (t === 'auto' ? ' selected' : '') + '>ऑटो</option></select>' +
    '<button class="primary" data-act="new-driver">＋ नया ड्राइवर</button></div>' +
    (editing && editing.type === 'driver' ? driverForm() : '') +
    rows.map(function (x) {
      var d = x.d;
      return '<div class="item"><div class="grow"><b>' + esc(d.name) + '</b><span class="tag">' +
        (d.type === 'taxi' ? 'टैक्सी ' + (d.seats || '') + ' सीटर' : 'ऑटो ' + (d.fuel ? d.fuel.toUpperCase() : '')) + '</span>' +
        '<div class="sub">' + esc(d.phone) + ' · ' + esc(d.vehicle || '') + '</div></div>' +
        '<button data-act="edit-driver" data-i="' + x.i + '">बदलो</button>' +
        '<button class="danger" data-act="del-driver" data-i="' + x.i + '">हटाओ</button></div>';
    }).join('') || '<div class="card">कोई ड्राइवर नहीं</div>';
}
function driverForm() {
  var d = editing.draft, isTaxi = d.type !== 'auto';
  return '<div class="card"><b>' + (editing.index < 0 ? 'नया ड्राइवर' : 'ड्राइवर बदलो') + '</b>' +
    '<label>प्रकार</label><select id="fd_type"><option value="taxi"' + (isTaxi ? ' selected' : '') + '>टैक्सी</option>' +
    '<option value="auto"' + (!isTaxi ? ' selected' : '') + '>ऑटो</option></select>' +
    '<label>नाम (ज़रूरी)</label><input id="fd_name" value="' + esc(d.name) + '">' +
    '<label>मोबाइल नंबर (ज़रूरी)</label><input id="fd_phone" inputmode="tel" value="' + esc(d.phone) + '">' +
    '<label>गाड़ी की डिटेल</label><input id="fd_vehicle" value="' + esc(d.vehicle) + '">' +
    '<div id="seatRow" style="display:' + (isTaxi ? 'block' : 'none') + '"><label>सीटर (टैक्सी में ज़रूरी)</label>' +
    '<input id="fd_seats" type="number" min="1" value="' + esc(d.seats) + '"></div>' +
    '<div id="fuelRow" style="display:' + (!isTaxi ? 'block' : 'none') + '"><label>ईंधन</label><select id="fd_fuel">' +
    '<option value="">— चुनो —</option><option value="ev"' + (d.fuel === 'ev' ? ' selected' : '') + '>EV (इलेक्ट्रिक)</option>' +
    '<option value="oil"' + (d.fuel === 'oil' ? ' selected' : '') + '>Oil (पेट्रोल/CNG)</option></select></div>' +
    '<label>जानकारी / इलाका (वैकल्पिक)</label><input id="fd_info" value="' + esc(d.info) + '">' +
    '<div class="btnrow"><button class="primary" data-act="save-driver">सेव</button><button data-act="cancel">रद्द</button></div></div>';
}

function viewPublish() {
  var v = validate();
  return '<div class="card"><b>प्रकाशित करने से पहले जाँच</b>' +
    '<p>' + data.places.length + ' जगहें · ' + data.routes.length + ' रूट · ' + data.taxiSeaters.length + ' सीटर विकल्प · ' + data.drivers.length + ' ड्राइवर</p>' +
    (v.errors.length ? '<div class="msg-err"><b>गलतियाँ (इन्हें ठीक किए बिना प्रकाशित नहीं होगा):</b><ul class="rep">' +
      v.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>' : '<p class="msg-ok">कोई गलती नहीं ✓</p>') +
    (v.warnings.length ? '<div class="msg-warn"><b>ध्यान दो:</b><ul class="rep">' +
      v.warnings.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>' : '') +
    '<p class="hint">प्रकाशित करने पर dataVersion ' + baseVersion + ' से ' + (baseVersion + 1) + ' हो जाएगा। ऐप अगली बार खुलने पर नया डेटा ले लेगा; नया APK नहीं बनेगा।</p>' +
    '<div class="btnrow"><button class="primary" data-act="publish"' + (v.errors.length || !dirty ? ' disabled' : '') + '>GitHub पर प्रकाशित करो</button>' +
    '<button class="danger" data-act="reload">GitHub से दोबारा लोड करो</button></div></div>';
}

// ============ बटन / इनपुट की घटनाएँ ============
function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; }
function opt(v) { return v ? v : undefined; }

document.addEventListener('input', function (e) {
  var key = e.target.getAttribute && e.target.getAttribute('data-filter');
  if (!key) return;
  filters[key] = e.target.value;
  var id = e.target.id; render();
  var el = document.getElementById(id);
  if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (x) {} }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'fd_type') {
    var taxi = e.target.value === 'taxi';
    $('#seatRow').style.display = taxi ? 'block' : 'none';
    $('#fuelRow').style.display = taxi ? 'none' : 'block';
  }
  if (e.target.id === 'f_dtype') { filters.driverType = e.target.value; render(); }
});
document.addEventListener('click', async function (e) {
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var act = b.getAttribute('data-act'), i = parseInt(b.getAttribute('data-i'), 10);
  try {
    if (act === 'tab') { tab = b.getAttribute('data-t'); editing = null; render(); }
    else if (act === 'save-cfg') {
      cfg.owner = val('c_owner'); cfg.repo = val('c_repo'); cfg.branch = val('c_branch');
      cfg.path = val('c_path'); cfg.token = document.getElementById('c_token').value.trim(); saveCfg();
      b.disabled = true; b.textContent = 'लोड हो रहा है…';
      await loadData(); toast('डेटा लोड हो गया'); tab = 'places'; render();
    }
    else if (act === 'cancel') { editing = null; render(); }
    else if (act === 'add-stop') { $('#stops').insertAdjacentHTML('beforeend', stopRow('', '')); }
    else if (act === 'rm-stop') { b.closest('.stoprow').remove(); }

    // ---- जगहें ----
    else if (act === 'new-place') { editing = { type: 'place', index: -1, draft: { kind: 'place', name: {}, aliases: [] } }; render(); }
    else if (act === 'edit-place') { editing = { type: 'place', index: i, draft: JSON.parse(JSON.stringify(data.places[i])) }; render(); }
    else if (act === 'del-place') {
      var pid = data.places[i].id;
      var used = data.routes.filter(function (r) {
        return r.from === pid || r.to === pid || (r.stops || []).some(function (s) { return s.place === pid; });
      });
      if (used.length) { toast('यह जगह ' + used.length + ' रूट में इस्तेमाल हो रही है, पहले उन्हें बदलो'); return; }
      if (confirm('"' + pname(data.places[i]) + '" हटाएँ?')) { data.places.splice(i, 1); setDirty(true); render(); }
    }
    else if (act === 'save-place') {
      var name = {};
      [['en','fp_en'], ['hi','fp_hi'], ['pa','fp_pa']].forEach(function (x) { if (val(x[1])) name[x[0]] = val(x[1]); });
      if (!Object.keys(name).length) { toast('कम से कम एक नाम लिखो'); return; }
      var p = editing.index < 0 ? {} : data.places[editing.index];
      var kind = val('fp_kind');
      if (editing.index < 0) {
        p.id = makeId(kind === 'stand' ? 'stand_' : 'place_', name.en || pname({ name: name }), function (id) { return !!placeById(id); });
      }
      p.kind = kind; p.name = name;
      var al = val('fp_alias').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      if (al.length) p.aliases = al; else delete p.aliases;
      if (val('fp_city')) p.city = val('fp_city'); else delete p.city;
      if (val('fp_dist')) p.district = val('fp_dist'); else delete p.district;
      if (editing.index < 0) data.places.push(p);
      editing = null; setDirty(true); toast('जगह सेव हो गई'); render();
    }

    // ---- रूट ----
    else if (act === 'new-route') { editing = { type: 'route', index: -1, draft: { stops: [] } }; render(); }
    else if (act === 'edit-route') { editing = { type: 'route', index: i, draft: JSON.parse(JSON.stringify(data.routes[i])) }; render(); }
    else if (act === 'del-route') {
      if (confirm('यह रूट हटाएँ?')) { data.routes.splice(i, 1); setDirty(true); render(); }
    }
    else if (act === 'save-route') {
      var from = val('fr_from'), to = val('fr_to'), time = val('fr_time'), arrive = val('fr_arrive');
      if (!from || !to) { toast('कहाँ से और कहाँ तक, दोनों चुनो'); return; }
      if (from === to) { toast('From और To अलग होने चाहिए'); return; }
      if (!TIME_RE.test(time)) { toast('चलने का समय डालो'); return; }
      var stops = [];
      document.querySelectorAll('#stops .stoprow').forEach(function (row) {
        var sp = row.querySelector('.st_place').value, st = row.querySelector('.st_time').value;
        if (sp) { var s = { place: sp }; if (TIME_RE.test(st)) s.time = st; stops.push(s); }
      });
      var r = editing.index < 0 ? { id: nextNum('r', data.routes) } : data.routes[editing.index];
      r.from = from; r.to = to; r.time = time;
      ['arrive', 'service', 'contact', 'info'].forEach(function (k) {
        var v = k === 'arrive' ? (TIME_RE.test(arrive) ? arrive : '') : val('fr_' + k);
        if (v) r[k] = v; else delete r[k];
      });
      if (stops.length) r.stops = stops; else delete r.stops;
      if (editing.index < 0) data.routes.push(r);
      editing = null; setDirty(true); toast('रूट सेव हो गया'); render();
    }

    // ---- सीटर ----
    else if (act === 'add-seater') {
      var n = parseInt(val('newSeater'), 10);
      if (!(n > 0)) { toast('सही संख्या लिखो'); return; }
      if (data.taxiSeaters.indexOf(n) >= 0) { toast('यह सीटर पहले से है'); return; }
      data.taxiSeaters.push(n); data.taxiSeaters.sort(function (a, c) { return a - c; });
      setDirty(true); render();
    }
    else if (act === 'rm-seater') {
      var rn = parseInt(b.getAttribute('data-n'), 10);
      var cnt = data.drivers.filter(function (d) { return d.type === 'taxi' && d.seats === rn; }).length;
      if (confirm(rn + ' सीटर का विकल्प हटाएँ?' + (cnt ? '\n(' + cnt + ' ड्राइवर ऐप में नहीं दिखेंगे)' : ''))) {
        data.taxiSeaters = data.taxiSeaters.filter(function (x) { return x !== rn; });
        setDirty(true); render();
      }
    }

    // ---- ड्राइवर ----
    else if (act === 'new-driver') { editing = { type: 'driver', index: -1, draft: { type: 'taxi' } }; render(); }
    else if (act === 'edit-driver') { editing = { type: 'driver', index: i, draft: JSON.parse(JSON.stringify(data.drivers[i])) }; render(); }
    else if (act === 'del-driver') {
      if (confirm('"' + data.drivers[i].name + '" हटाएँ?')) { data.drivers.splice(i, 1); setDirty(true); render(); }
    }
    else if (act === 'save-driver') {
      var type = val('fd_type'), dn = val('fd_name'), ph = val('fd_phone');
      var digits = ph.replace(/\D/g, '').length;
      if (!dn) { toast('नाम ज़रूरी है'); return; }
      if (digits < 10 || digits > 13) { toast('सही मोबाइल नंबर लिखो'); return; }
      var seats = parseInt(val('fd_seats'), 10);
      if (type === 'taxi' && !(seats > 0)) { toast('टैक्सी में सीटर ज़रूरी है'); return; }
      var d = editing.index < 0 ? { id: nextNum(type === 'taxi' ? 't' : 'a', data.drivers) } : data.drivers[editing.index];
      d.type = type; d.name = dn; d.phone = ph;
      if (val('fd_vehicle')) d.vehicle = val('fd_vehicle'); else delete d.vehicle;
      if (type === 'taxi') { d.seats = seats; delete d.fuel; }
      else { delete d.seats; if (val('fd_fuel')) d.fuel = val('fd_fuel'); else delete d.fuel; }
      if (val('fd_info')) d.info = val('fd_info'); else delete d.info;
      if (editing.index < 0) data.drivers.push(d);
      editing = null; setDirty(true); toast('ड्राइवर सेव हो गया'); render();
    }

    // ---- प्रकाशित ----
    else if (act === 'publish') {
      b.disabled = true; b.textContent = 'प्रकाशित हो रहा है…';
      await publish(); toast('प्रकाशित हो गया ✓ dataVersion ' + baseVersion); render();
    }
    else if (act === 'reload') {
      if (!dirty || confirm('बिना सेव किए बदलाव मिट जाएँगे। दोबारा लोड करें?')) { await loadData(); toast('दोबारा लोड हो गया'); render(); }
    }
  } catch (err) {
    toast('गड़बड़ी: ' + err.message); alert('गड़बड़ी: ' + err.message); render();
  }
});

// ============ शुरुआत ============
render();
if (cfg.token) {
  loadData().then(function () { tab = 'places'; render(); }).catch(function (e) { toast('लोड नहीं हुआ: ' + e.message); });
}
</script>
</body>
</html>
