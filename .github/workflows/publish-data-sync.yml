name: Publish transport data deltas

on:
  push:
    branches: [main]
    paths:
      - "app/src/main/assets/routes.json"
      - ".github/workflows/publish-data-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bustime-data-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare snapshot and publish incremental changes
        env:
          SUPABASE_URL: https://mdryxbvmqsphbfkvqtnf.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request, urllib.error, hashlib, sys

          base_url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "")
          if not key:
              raise SystemExit("Missing GitHub Actions secret SUPABASE_SERVICE_ROLE_KEY. Add the Supabase service-role key in repository Actions secrets; never put it in app code.")

          path = "app/src/main/assets/routes.json"
          with open(path, encoding="utf-8") as f:
              current = json.load(f)

          # Fail early on malformed snapshots; publishing partial deltas can strand
          # devices on an incomplete dataset until a full snapshot is downloaded.
          if not isinstance(current, dict):
              raise SystemExit("routes.json must contain a JSON object.")
          if (not isinstance(current.get("dataVersion"), int)
                  or isinstance(current.get("dataVersion"), bool)
                  or current["dataVersion"] < 1):
              raise SystemExit("routes.json must contain a positive integer dataVersion.")
          for collection in ("places", "routes"):
              if not isinstance(current.get(collection), list):
                  raise SystemExit(f"routes.json field {collection!r} must be a list.")
          for collection in ("places", "routes"):
              seen = set()
              for index, item in enumerate(current[collection]):
                  if not isinstance(item, dict) or item.get("id") is None or not str(item.get("id")).strip():
                      raise SystemExit(f"{collection}[{index}] must be an object with a non-empty id.")
                  ident = str(item["id"])
                  if ident in seen:
                      raise SystemExit(f"Duplicate id {ident!r} in {collection}.")
                  seen.add(ident)
          for index, route in enumerate(current["routes"]):
              if "stops" in route and not isinstance(route["stops"], list):
                  raise SystemExit(f"routes[{index}].stops must be a list when supplied.")

          before_sha = os.environ.get("BEFORE_SHA", "")
          old = {}
          old_load_error = None
          if before_sha and set(before_sha) != {"0"}:
              try:
                  raw = subprocess.check_output(["git", "show", f"{before_sha}:{path}"], stderr=subprocess.DEVNULL)
                  old = json.loads(raw.decode("utf-8"))
                  if not isinstance(old, dict):
                      raise ValueError("previous routes.json was not a JSON object")
              except Exception as e:
                  old_load_error = str(e)

          def request(method, endpoint, payload=None, prefer=None):
              data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode()
              headers = {"apikey": key, "Authorization": "Bearer " + key, "Accept": "application/json"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              if prefer:
                  headers["Prefer"] = prefer
              req = urllib.request.Request(base_url + endpoint, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f"Supabase HTTP {e.code}: {e.read().decode('utf-8', 'replace')}")

          state = request("GET", "/rest/v1/data_sync_state?select=revision,snapshot_version&id=eq.1")
          if not state:
              raise SystemExit("data_sync_state row id=1 is missing; apply the incremental_data_sync migration first.")
          revision = int(state[0]["revision"])
          published_version = int(state[0].get("snapshot_version") or 0)
          # If GitHub's current snapshot is ahead of Supabase, recover from the last
          # snapshot that Supabase says it has published. This handles skipped CI
          # commits and manual dispatches without losing delete tombstones.
          if revision > 0 and published_version != int(current["dataVersion"]):
              history = subprocess.check_output(
                  ["git", "log", "--format=%H", "--", path], text=True
              ).splitlines()
              recovered = None
              for commit in history:
                  try:
                      raw = subprocess.check_output(
                          ["git", "show", f"{commit}:{path}"], stderr=subprocess.DEVNULL
                      )
                      candidate = json.loads(raw.decode("utf-8"))
                      if isinstance(candidate, dict) and int(candidate.get("dataVersion", 0)) == published_version:
                          recovered = candidate
                          print(f"Recovered published baseline version {published_version} from {commit}.")
                          break
                  except Exception:
                      continue
              if recovered is None:
                  raise SystemExit(
                      f"Cannot find routes.json dataVersion {published_version} in Git history; "
                      "refusing to publish incomplete deltas."
                  )
              old = recovered
          elif revision > 0 and old_load_error is not None:
              raise SystemExit("Cannot read the previous routes.json from the push's before-SHA; refusing to publish incomplete deltas. " + old_load_error)
          # Revision zero means first publication: seed every current record so existing installs can catch up.
          if revision == 0:
              old = {}

          changes = []
          def compare(collection, entity_type, id_field="id", hidden_deletes=False):
              old_items = {str(x.get(id_field)): x for x in old.get(collection, []) if x.get(id_field) is not None}
              new_items = {str(x.get(id_field)): x for x in current.get(collection, []) if x.get(id_field) is not None}
              for ident in sorted(set(old_items) | set(new_items)):
                  before, after = old_items.get(ident), new_items.get(ident)
                  if after is None or (hidden_deletes and after.get("hidden") is True):
                      if before is not None and not (hidden_deletes and before.get("hidden") is True):
                          changes.append({"entity_type": entity_type, "entity_id": ident, "operation": "delete", "payload": None})
                  elif before != after:
                      changes.append({"entity_type": entity_type, "entity_id": ident, "operation": "upsert", "payload": after})

          compare("places", "place")
          compare("routes", "route", hidden_deletes=True)
          # If a route references a place removed from the new snapshot, delete that
          # route too; otherwise its stop rows would become orphaned locally.
          current_place_ids = {str(p.get("id")) for p in current.get("places", []) if p.get("id") is not None}
          old_routes = {str(r.get("id")): r for r in old.get("routes", []) if r.get("id") is not None}
          new_routes = {str(r.get("id")): r for r in current.get("routes", []) if r.get("id") is not None}
          for ident, route in new_routes.items():
              stop_ids = [str(s.get("place")) for s in route.get("stops", []) if s.get("place") is not None]
              references = [route.get("from"), route.get("to")] + stop_ids
              if any(str(place_id) not in current_place_ids for place_id in references if place_id is not None):
                  changes[:] = [item for item in changes
                                if not (item["entity_type"] == "route" and item["entity_id"] == ident)]
                  if ident in old_routes:
                      changes.append({"entity_type": "route", "entity_id": ident, "operation": "delete", "payload": None})
          if not changes:
              print("No data changes detected; revision unchanged.")
              sys.exit(0)

          next_revision = revision + 1
          rows = [{"revision": next_revision, **item} for item in changes]
          # PostgREST can limit request size; send batches to avoid oversized requests.
          for start in range(0, len(rows), 250):
              request("POST", "/rest/v1/data_change_log", rows[start:start+250], "resolution=merge-duplicates,return=minimal")

          digest = hashlib.sha256(json.dumps(current, sort_keys=True, ensure_ascii=False).encode()).hexdigest()
          request("PATCH", "/rest/v1/data_sync_state?id=eq.1",
                  {"revision": next_revision, "snapshot_version": int(current.get("dataVersion", 0)),
                   "snapshot_sha256": digest, "published_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat()},
                  "return=minimal")
          print(f"Published revision {next_revision}: {len(changes)} incremental changes.")
          PY
