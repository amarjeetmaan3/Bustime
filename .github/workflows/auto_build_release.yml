name: Auto Build and Release APK

on:
  push:
    branches: [ "main" ]
    # सिर्फ़ डेटा/एडमिन पेज बदलने पर नया APK और रिलीज़ नहीं बनेगी
    paths-ignore:
      - 'app/src/main/assets/routes.json'
      - 'admin/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # true तभी होगा जब GitHub Secrets में RELEASE_KEYSTORE_BASE64 डाली हो
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # ---------- टेस्ट बिल्ड (हमेशा) ----------
      - name: Build Debug APK
        run: gradle assembleDebug -PappVersionCode=${{ github.run_number }}

      # APK में native .so libraries जाँचें: 32-bit library हो तो matching 64-bit भी जरूरी है।
      - name: Verify APK 64-bit native library compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          TMP="$(mktemp -d)"
          unzip -q "$APK" -d "$TMP"
          mapfile -t SO_FILES < <(find "$TMP/lib" -type f -name '*.so' 2>/dev/null | sed "s#^$TMP/##" | sort || true)

          if [ "${#SO_FILES[@]}" -eq 0 ]; then
            echo "PASS: APK में कोई native .so library नहीं है; Kotlin/Java app को अलग 64-bit ABI libraries की जरूरत नहीं।"
            exit 0
          fi

          echo "Native libraries मिलीं:"
          printf ' - %s\n' "${SO_FILES[@]}"

          FAILED=0
          while IFS= read -r LIB; do
            case "$LIB" in
              lib/armeabi-v7a/*)
                MATCH="lib/arm64-v8a/${LIB##*/}"
                if [ ! -f "$TMP/$MATCH" ]; then
                  echo "ERROR: 32-bit $LIB के लिए 64-bit $MATCH नहीं मिली।"
                  FAILED=1
                fi
                ;;
              lib/x86/*)
                MATCH="lib/x86_64/${LIB##*/}"
                if [ ! -f "$TMP/$MATCH" ]; then
                  echo "ERROR: 32-bit $LIB के लिए 64-bit $MATCH नहीं मिली।"
                  FAILED=1
                fi
                ;;
            esac
          done < <(printf '%s\n' "${SO_FILES[@]}")

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "PASS: packaged 32-bit native libraries की matching 64-bit libraries मौजूद हैं।"

      - name: Upload Debug APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bustime-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      # ---------- Store बिल्ड (सिर्फ़ जब सीक्रेट्स हों) ----------
      - name: Decode release keystore
        if: env.HAS_RELEASE_KEY == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed Release APK + AAB
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease -PappVersionCode=${{ github.run_number }}

      - name: Upload Release files as Artifact
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Bustime-Release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      # ---------- GitHub Release (अपडेटर इसी से पढ़ता है) ----------
      # सीक्रेट्स हों तो सिर्फ़ Release APK, वरना Debug APK (दोनों साथ नहीं, वरना साइन अलग होने से इंस्टॉल फेल)
      - name: Publish GitHub Release (signed)
        if: env.HAS_RELEASE_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bustime v1.0.${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          make_latest: true

      - name: Publish GitHub Release (debug)
        if: env.HAS_RELEASE_KEY != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bustime v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
