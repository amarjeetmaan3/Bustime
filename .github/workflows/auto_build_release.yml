name: Auto Build and Release APK

on:
  push:
    branches: [ "main" ]
    # सिर्फ़ डेटा/एडमिन पेज बदलने पर नया APK और रिलीज़ नहीं बनेगी
    paths-ignore:
      - 'app/src/main/assets/routes.json'
      - 'admin/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # true तभी होगा जब GitHub Secrets में RELEASE_KEYSTORE_BASE64 डाली हो
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # ---------- टेस्ट बिल्ड (हमेशा) ----------
      - name: Build Debug APK
        run: gradle assembleDebug -PappVersionCode=${{ github.run_number }}

      # APK में native .so libraries जाँचें: 32-bit library हो तो matching 64-bit भी जरूरी है।
      - name: Verify APK architecture compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK नहीं बनी।"
            exit 1
          fi

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          unzip -q "$APK" -d "$TMP"

          echo "APK: $APK"
          echo "Minimum Android version: minSdk 24 (Android 7.0)"
          echo "Configured ARM ABIs: armeabi-v7a (32-bit), arm64-v8a (64-bit)"

          if [ ! -d "$TMP/lib" ]; then
            echo "PASS: APK में native .so libraries नहीं हैं। यह Kotlin/Java APK है; ABI filters के बावजूद अलग native binaries की जरूरत तभी होगी जब कोई dependency उन्हें शामिल करे।"
            exit 0
          fi

          mapfile -t SO_FILES < <(find "$TMP/lib" -type f -name '*.so' | sed "s#^$TMP/##" | sort)
          printf 'Packaged native libraries:\n'
          printf ' - %s\n' "${SO_FILES[@]}"

          FAILED=0
          while IFS= read -r LIB; do
            case "$LIB" in
              lib/armeabi-v7a/*)
                MATCH="lib/arm64-v8a/${LIB##*/}"
                if [ ! -f "$TMP/$MATCH" ]; then
                  echo "ERROR: 32-bit library $LIB की matching 64-bit library $MATCH APK में नहीं है।"
                  FAILED=1
                fi
                ;;
              lib/arm64-v8a/*)
                MATCH="lib/armeabi-v7a/${LIB##*/}"
                if [ ! -f "$TMP/$MATCH" ]; then
                  echo "ERROR: 64-bit library $LIB की matching 32-bit library $MATCH APK में नहीं है।"
                  FAILED=1
                fi
                ;;
            esac
          done < <(printf '%s\n' "${SO_FILES[@]}")

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "PASS: APK native-library compatibility check completed."

      - name: Upload Debug APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bustime-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      # ---------- Store बिल्ड (सिर्फ़ जब सीक्रेट्स हों) ----------
      - name: Decode release keystore
        if: env.HAS_RELEASE_KEY == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed Release APK + AAB
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease -PappVersionCode=${{ github.run_number }}

      - name: Upload Release files as Artifact
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Bustime-Release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      # ---------- GitHub Release (अपडेटर इसी से पढ़ता है) ----------
      # सीक्रेट्स हों तो सिर्फ़ Release APK, वरना Debug APK (दोनों साथ नहीं, वरना साइन अलग होने से इंस्टॉल फेल)
      - name: Publish GitHub Release (signed)
        if: env.HAS_RELEASE_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bustime v1.0.${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          make_latest: true

      - name: Publish GitHub Release (debug)
        if: env.HAS_RELEASE_KEY != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bustime v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
