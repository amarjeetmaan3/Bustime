name: Auto Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # पुराना वाला Gradle सेटअप जो काम कर रहा था
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Create Permanent Keystore (If not exists)
        run: |
          if [ ! -f app/bustime.jks ]; then
            echo "Generating new permanent keystore..."
            keytool -genkey -v -keystore app/bustime.jks -storepass bustime123 -alias bustime -keypass bustime123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Bustime, O=BustimeApp, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f app/bustime.jks
            git commit -m "Add permanent keystore to fix App Not Installed error"
            git push
          else
            echo "Permanent keystore already exists!"
          fi

      # बिना gradlew के डायरेक्ट gradle कमांड
      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK as Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bustime-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
      - name: Publish GitHub Release (for in-app updater)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bustime v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
