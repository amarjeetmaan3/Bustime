name: Delete old branches (one-time)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/delete-old-branches.yml'

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh api "repos/${{ github.repository }}/branches" --paginate -q '.[].name' | grep -vx 'main' | while read -r b; do
            echo "deleting $b"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b"
          done
          echo "Remaining branches:"
          gh api "repos/${{ github.repository }}/branches" --paginate -q '.[].name'
