<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bustime Admin</title>
<style>
  :root {
    --brand:#1565C0; --brand-d:#0D47A1; --brand-l:#E3F2FD;
    --bg:#F4F6F9; --card:#FFFFFF; --line:#E3E7EC; --text:#1F2933; --muted:#667085;
    --red:#C62828; --red-l:#FDECEA; --green:#2E7D32; --green-l:#E8F5E9; --amber:#B26A00; --amber-l:#FFF4E0;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari","Noto Sans Gurmukhi",sans-serif; font-size:15px; }
  button { font:inherit; cursor:pointer; }
  input, select { font:inherit; width:100%; padding:10px 12px; border:1px solid #C9D1DA; border-radius:8px; background:#fff; color:var(--text); }
  input:focus, select:focus { outline:2px solid var(--brand-l); border-color:var(--brand); }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:14px 0 5px; text-transform:uppercase; letter-spacing:.03em; }

  .app { display:flex; min-height:100vh; }
  aside { width:220px; background:#fff; border-right:1px solid var(--line); padding:16px 10px; position:sticky; top:0; height:100vh; flex:0 0 auto; }
  .brand { font-weight:700; font-size:18px; color:var(--brand-d); padding:6px 10px 18px; }
  .brand small { display:block; font-weight:500; font-size:12px; color:var(--muted); }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nav button { display:flex; justify-content:space-between; align-items:center; border:0; background:none; text-align:left; padding:11px 12px; border-radius:8px; color:#344054; font-size:15px; }
  .nav button:hover { background:#F2F4F7; }
  .nav button.on { background:var(--brand-l); color:var(--brand-d); font-weight:600; }
  .nav .count { font-size:12px; background:#EAECF0; border-radius:10px; padding:1px 8px; color:#475467; }
  .nav button.on .count { background:#fff; }
  .content { flex:1; min-width:0; display:flex; flex-direction:column; }
  header.top { display:flex; align-items:center; gap:12px; padding:12px 24px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header.top h1 { font-size:20px; margin:0; flex:1; }
  .pill { font-size:12px; border-radius:12px; padding:3px 10px; background:#EAECF0; color:#475467; white-space:nowrap; }
  .pill.dirty { background:var(--amber-l); color:var(--amber); font-weight:600; }
  main { padding:24px; max-width:1100px; width:100%; }

  .btn { border:1px solid #C9D1DA; background:#fff; border-radius:8px; padding:9px 14px; font-weight:500; color:#344054; }
  .btn:hover { background:#F9FAFB; }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn.primary:hover { background:var(--brand-d); }
  .btn.danger { color:var(--red); border-color:#F1B8B3; }
  .btn.sm { padding:5px 10px; font-size:13px; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  .card h2 { font-size:16px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:13px; line-height:1.5; }
  .toolbar { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .toolbar .grow { flex:1; min-width:180px; }
  .toolbar select { width:auto; min-width:140px; }
  .tablewrap { background:#fff; border:1px solid var(--line); border-radius:12px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:640px; }
  th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); background:#F9FAFB; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:11px 14px; border-bottom:1px solid #F0F2F5; vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  td.actions { white-space:nowrap; text-align:right; }
  td.actions .btn { margin-left:6px; }
  .empty { padding:36px; text-align:center; color:var(--muted); }
  .badge { display:inline-block; font-size:12px; border-radius:10px; padding:2px 9px; background:var(--brand-l); color:var(--brand-d); font-weight:600; }
  .badge.green { background:var(--green-l); color:var(--green); }
  .badge.gray { background:#EAECF0; color:#475467; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
  .stat b { display:block; font-size:28px; color:var(--brand-d); }
  .stat span { font-size:13px; color:var(--muted); }
  .alert { border-radius:10px; padding:12px 14px; margin-top:10px; font-size:14px; }
  .alert.err { background:var(--red-l); color:var(--red); }
  .alert.warn { background:var(--amber-l); color:var(--amber); }
  .alert.ok { background:var(--green-l); color:var(--green); }
  .alert ul { margin:6px 0 0; padding-left:20px; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; margin:16px 0; }
  .chip { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 8px 10px 16px; }
  .chip b { font-size:18px; color:var(--brand-d); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stoprow { display:flex; gap:6px; margin-bottom:6px; align-items:center; }
  .stoprow select { flex:3; } .stoprow input { flex:1.2; }

  .overlay { position:fixed; inset:0; background:rgba(16,24,40,.5); display:none; align-items:flex-start; justify-content:center; padding:24px 12px; overflow-y:auto; z-index:30; }
  .overlay.show { display:flex; }
  .dialog { background:#fff; border-radius:14px; width:100%; max-width:560px; box-shadow:0 20px 40px rgba(0,0,0,.25); }
  .dlg-head { display:flex; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); }
  .dlg-head h2 { margin:0; font-size:17px; flex:1; }
  .dlg-head button { border:0; background:none; font-size:24px; line-height:1; color:var(--muted); }
  .dlg-body { padding:4px 20px 20px; }
  .dlg-foot { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1F2933; color:#fff; padding:11px 20px; border-radius:24px; display:none; z-index:50; max-width:92%; font-size:14px; }

  @media (max-width:860px) {
    .app { flex-direction:column; }
    aside { width:100%; height:auto; position:static; padding:8px; border-right:0; border-bottom:1px solid var(--line); }
    .brand { display:none; }
    .nav { flex-direction:row; overflow-x:auto; }
    .nav button { white-space:nowrap; }
    header.top, main { padding:12px; }
    .row2 { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Bustime<small>Admin console</small></div>
    <div class="nav" id="nav"></div>
  </aside>
  <div class="content">
    <header class="top">
      <h1 id="pageTitle">Dashboard</h1>
      <span class="pill" id="verPill"></span>
      <span class="pill dirty" id="dirty" style="display:none">Unpublished changes</span>
      <button class="btn primary" data-act="open-publish" id="pubBtn">Publish</button>
    </header>
    <main id="view"></main>
  </div>
</div>

<div class="overlay" id="overlay"><div class="dialog">
  <div class="dlg-head"><h2 id="dlgTitle"></h2><button data-act="close" aria-label="Close">&times;</button></div>
  <div class="dlg-body" id="dlgBody"></div>
</div></div>
<div id="toast"></div>

<script>
// ============ Settings (stored only in this browser) ============
var CFG_KEY = 'bustime_admin_cfg';
var DEFAULT_CFG = { owner:'amarjeetmaan3', repo:'Bustime', branch:'main', path:'app/src/main/assets/routes.json', token:'', sbUrl:'', sbKey:'', sbEmail:'' };
var cfg = loadCfg();
function loadCfg() {
  try { return Object.assign({}, DEFAULT_CFG, JSON.parse(localStorage.getItem(CFG_KEY) || '{}')); }
  catch (e) { return Object.assign({}, DEFAULT_CFG); }
}
function saveCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} }

// ============ State ============
var data = null, sha = null, baseVersion = 0, dirty = false;
var tab = 'settings';
var sbToken = null, subs = null, subsError = '';   // Supabase login lives only in memory
var editing = null;
var publishOpen = false;
var filters = { places:'', placeKind:'', routes:'', drivers:'', driverType:'' };

var NAV = [['dashboard','Dashboard'], ['places','Places'], ['routes','Bus Routes'],
           ['seats','Taxi Seats'], ['drivers','Drivers'], ['review','Review'], ['settings','Settings']];
var TITLES = { dashboard:'Dashboard', places:'Places', routes:'Bus Routes', seats:'Taxi Seats', drivers:'Drivers', review:'Review submissions', settings:'Settings' };

// ============ Helpers ============
function $(s) { return document.querySelector(s); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 3500);
}
function b64encode(str) {
  var bytes = new TextEncoder().encode(str), bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(b64) {
  var bin = atob(b64.replace(/\s/g, '')), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function pname(p) { var n = (p && p.name) || {}; return n.en || n.hi || n.pa || (p && p.id) || ''; }
function placeById(id) { return data.places.find(function (p) { return p.id === id; }); }
function placeText(p) {
  var n = Object.keys(p.name || {}).map(function (k) { return p.name[k]; });
  return n.concat(p.aliases || [], [p.id]).join(' ').toLowerCase();
}
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); }
function makeId(prefix, base, exists) {
  var b = prefix + (slug(base) || 'x'), id = b, n = 2;
  while (exists(id)) { id = b + '_' + n++; }
  return id;
}
function nextNum(prefix, list) {
  var max = 0;
  list.forEach(function (x) {
    var m = String(x.id || '').match(new RegExp('^' + prefix + '(\\d+)$'));
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return prefix + (max + 1);
}
function setDirty(v) { dirty = v; refreshChrome(); }
window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
var TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
function fmtTime(t) {
  if (!t) return '-';
  var h = parseInt(t.slice(0, 2), 10), m = t.slice(3, 5);
  return ((h % 12) || 12) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM');
}

// ============ GitHub API ============
function apiUrl() { return 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + cfg.path; }
function ghHeaders() {
  var h = { 'Accept': 'application/vnd.github+json' };
  if (cfg.token) h['Authorization'] = 'Bearer ' + cfg.token;
  return h;
}
function normalize(d) {
  var o = { dataVersion: d.dataVersion || 0, places: d.places || [], routes: d.routes || [],
            taxiSeaters: d.taxiSeaters || [], drivers: d.drivers || [] };
  if (d._note) o._note = d._note;
  return o;
}
async function loadData() {
  var r = await fetch(apiUrl() + '?ref=' + encodeURIComponent(cfg.branch) + '&t=' + Date.now(),
                      { headers: ghHeaders(), cache: 'no-store' });
  if (!r.ok) throw new Error('GitHub ' + r.status + ' - ' + (await r.text()).slice(0, 160));
  var j = await r.json();
  if (!j.content) throw new Error('Could not read the data file');
  data = normalize(JSON.parse(b64decode(j.content)));
  sha = j.sha; baseVersion = data.dataVersion || 0; editing = null; publishOpen = false; setDirty(false);
}
async function publish() {
  if (!cfg.token) { toast('Add your GitHub token in Settings first'); return; }
  var v = validate();
  if (v.errors.length) { toast('Fix the errors first'); return; }
  var out = {};
  if (data._note) out._note = data._note;
  out.dataVersion = baseVersion + 1;
  out.places = data.places; out.routes = data.routes;
  out.taxiSeaters = data.taxiSeaters; out.drivers = data.drivers;
  var body = {
    message: 'Data update v' + out.dataVersion + ' [skip ci]',
    content: b64encode(JSON.stringify(out, null, 2) + '\n'),
    sha: sha, branch: cfg.branch
  };
  var h = ghHeaders(); h['Content-Type'] = 'application/json';
  var r = await fetch(apiUrl(), { method: 'PUT', headers: h, body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) {
    throw new Error('The file was changed elsewhere in the meantime. Reload from GitHub (your unpublished changes will be lost).');
  }
  if (!r.ok) throw new Error('GitHub ' + r.status + ' - ' + (await r.text()).slice(0, 160));
  var j = await r.json();
  sha = j.content.sha; baseVersion = out.dataVersion; data.dataVersion = out.dataVersion; setDirty(false);
}

// ============ Validation (same rules the app applies on import) ============
function validate() {
  var errors = [], warnings = [], pids = {};
  data.places.forEach(function (p) {
    if (!p.id) errors.push('A place has no id');
    else if (pids[p.id]) errors.push('Duplicate place id: ' + p.id);
    pids[p.id] = true;
    var hasName = Object.keys(p.name || {}).some(function (k) { return String(p.name[k] || '').trim(); });
    if (!hasName) errors.push('Place "' + p.id + '" has no name');
  });
  var noHi = data.places.filter(function (p) { return !(p.name && p.name.hi); }).length;
  var noPa = data.places.filter(function (p) { return !(p.name && p.name.pa); }).length;
  if (noHi) warnings.push(noHi + ' place(s) have no Hindi name');
  if (noPa) warnings.push(noPa + ' place(s) have no Punjabi name');

  var rids = {};
  data.routes.forEach(function (r) {
    var tag = 'Route ' + r.id;
    if (!r.id) errors.push('A route has no id');
    else if (rids[r.id]) errors.push('Duplicate route id: ' + r.id);
    rids[r.id] = true;
    if (!pids[r.from]) errors.push(tag + ': "From" place does not exist');
    if (!pids[r.to]) errors.push(tag + ': "To" place does not exist');
    if (r.from && r.from === r.to) errors.push(tag + ': From and To are the same');
    if (!TIME_RE.test(r.time || '')) errors.push(tag + ': invalid departure time');
    (r.stops || []).forEach(function (s) { if (!pids[s.place]) errors.push(tag + ': a stop refers to a missing place'); });
  });

  var dids = {};
  data.drivers.forEach(function (d) {
    var tag = 'Driver ' + (d.name || d.id);
    if (!d.id) errors.push('A driver has no id');
    else if (dids[d.id]) errors.push('Duplicate driver id: ' + d.id);
    dids[d.id] = true;
    if (d.type !== 'taxi' && d.type !== 'auto') errors.push(tag + ': invalid type');
    if (!String(d.name || '').trim()) errors.push(tag + ': name is required');
    var digits = String(d.phone || '').replace(/\D/g, '').length;
    if (digits < 10 || digits > 13) errors.push(tag + ': invalid mobile number');
    if (d.type === 'taxi' && !(d.seats > 0)) errors.push(tag + ': taxi needs a seat count');
  });
  var hidden = data.drivers.filter(function (d) {
    return d.type === 'taxi' && data.taxiSeaters.length && data.taxiSeaters.indexOf(d.seats) < 0;
  }).length;
  if (hidden) warnings.push(hidden + ' taxi driver(s) will not appear in the app (their seat count is not in the Taxi Seats list)');
  return { errors: errors, warnings: warnings };
}
function reportHtml(v) {
  return (v.errors.length ? '<div class="alert err"><b>Errors (publishing is blocked)</b><ul>' +
      v.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>'
    : '<div class="alert ok">No errors. The data is valid.</div>') +
    (v.warnings.length ? '<div class="alert warn"><b>Warnings</b><ul>' +
      v.warnings.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>' : '');
}

// ============ Views ============
function refreshChrome() {
  $('#dirty').style.display = dirty ? 'inline-block' : 'none';
  $('#verPill').textContent = data ? 'Data v' + baseVersion : 'Not loaded';
  $('#pubBtn').disabled = !data || !dirty;
  $('#pageTitle').textContent = TITLES[tab] || '';
}
function render() {
  var counts = data ? { places:data.places.length, routes:data.routes.length, seats:data.taxiSeaters.length, drivers:data.drivers.length } : {};
  if (subs) counts.review = subs.length;
  $('#nav').innerHTML = NAV.map(function (n) {
    return '<button data-act="tab" data-t="' + n[0] + '" class="' + (tab === n[0] ? 'on' : '') + '">' + n[1] +
      (counts[n[0]] != null ? '<span class="count">' + counts[n[0]] + '</span>' : '') + '</button>';
  }).join('');
  refreshChrome();
  var v = $('#view');
  if (tab !== 'settings' && !data) {
    v.innerHTML = '<div class="card"><h2>No data loaded</h2><p class="muted">Open Settings and load the data from GitHub first.</p>' +
      '<button class="btn primary" data-act="tab" data-t="settings">Go to Settings</button></div>';
  } else {
    v.innerHTML = { dashboard: viewDashboard, places: viewPlaces, routes: viewRoutes,
                    seats: viewSeats, drivers: viewDrivers, review: viewReview, settings: viewSettings }[tab]();
  }
  renderModal();
}

function viewDashboard() {
  var stands = data.places.filter(function (p) { return p.kind === 'stand'; }).length;
  var taxis = data.drivers.filter(function (d) { return d.type === 'taxi'; }).length;
  var autos = data.drivers.length - taxis;
  var v = validate();
  return '<div class="stats">' +
    stat(data.places.length, 'Places (' + stands + ' bus stands)') + stat(data.routes.length, 'Bus routes') +
    stat(data.taxiSeaters.length, 'Taxi seat options') + stat(taxis, 'Taxis') + stat(autos, 'Autos') + '</div>' +
    '<div class="card"><h2>Data health</h2><p class="muted">Published data version: ' + baseVersion + '. ' +
    (dirty ? 'You have unpublished changes.' : 'Everything is published.') + '</p>' + reportHtml(v) + '</div>' +
    '<div class="card"><h2>How it works</h2><p class="muted">Edit places, routes, taxi seats and drivers here, then press <b>Publish</b>. ' +
    'The app picks up the new data the next time it opens. No new APK is needed for data changes.</p></div>';
}
function stat(n, label) { return '<div class="stat"><b>' + n + '</b><span>' + esc(label) + '</span></div>'; }

function viewPlaces() {
  var q = filters.places.toLowerCase(), k = filters.placeKind;
  var rows = data.places.map(function (p, i) { return { p: p, i: i }; }).filter(function (x) {
    return (!k || x.p.kind === k) && (!q || placeText(x.p).indexOf(q) >= 0);
  }).sort(function (a, b) { return pname(a.p).localeCompare(pname(b.p)); });
  return '<div class="toolbar"><input class="grow" id="f_places" data-filter="places" placeholder="Search places" value="' + esc(filters.places) + '">' +
    '<select id="f_pkind"><option value="">All types</option><option value="stand"' + (k === 'stand' ? ' selected' : '') + '>Bus stands</option>' +
    '<option value="place"' + (k === 'place' ? ' selected' : '') + '>Other places</option></select>' +
    '<button class="btn primary" data-act="new-place">+ Add place</button></div>' +
    '<div class="tablewrap"><table><thead><tr><th>English</th><th>Hindi</th><th>Punjabi</th><th>Type</th><th>City</th><th></th></tr></thead><tbody>' +
    (rows.map(function (x) {
      var p = x.p, n = p.name || {};
      return '<tr><td><b>' + esc(n.en || '-') + '</b></td><td>' + esc(n.hi || '-') + '</td><td>' + esc(n.pa || '-') + '</td>' +
        '<td><span class="badge ' + (p.kind === 'stand' ? '' : 'gray') + '">' + (p.kind === 'stand' ? 'Bus stand' : 'Place') + '</span></td>' +
        '<td>' + esc(p.city || '-') + '</td><td class="actions">' +
        '<button class="btn sm" data-act="edit-place" data-i="' + x.i + '">Edit</button>' +
        '<button class="btn sm danger" data-act="del-place" data-i="' + x.i + '">Delete</button></td></tr>';
    }).join('') || '<tr><td colspan="6" class="empty">No places found</td></tr>') + '</tbody></table></div>';
}
function placeFormHtml() {
  var p = editing.draft, n = p.name || {};
  return '<label>Type</label><select id="fp_kind"><option value="place"' + (p.kind !== 'stand' ? ' selected' : '') + '>Place / city / village</option>' +
    '<option value="stand"' + (p.kind === 'stand' ? ' selected' : '') + '>Bus stand</option></select>' +
    '<label>Name in English</label><input id="fp_en" value="' + esc(n.en) + '">' +
    '<label>Name in Hindi</label><input id="fp_hi" value="' + esc(n.hi) + '">' +
    '<label>Name in Punjabi</label><input id="fp_pa" value="' + esc(n.pa) + '">' +
    '<label>Alternate spellings (comma separated)</label><input id="fp_alias" value="' + esc((p.aliases || []).join(', ')) + '">' +
    '<div class="row2"><div><label>City</label><input id="fp_city" value="' + esc(p.city) + '"></div>' +
    '<div><label>District</label><input id="fp_dist" value="' + esc(p.district) + '"></div></div>' +
    foot('save-place');
}

function viewRoutes() {
  var q = filters.routes.toLowerCase();
  var rows = data.routes.map(function (r, i) { return { r: r, i: i }; }).filter(function (x) {
    var t = (pname(placeById(x.r.from)) + ' ' + pname(placeById(x.r.to)) + ' ' + (x.r.service || '')).toLowerCase();
    return !q || t.indexOf(q) >= 0;
  });
  return '<div class="toolbar"><input class="grow" id="f_routes" data-filter="routes" placeholder="Search routes" value="' + esc(filters.routes) + '">' +
    '<button class="btn primary" data-act="new-route">+ Add route</button></div>' +

// ============ Supabase (user submissions) ============
async function sbFetch(path, opts) {
  opts = opts || {};
  var base = cfg.sbUrl.replace(/\/+$/, '');
  var headers = Object.assign({ apikey: cfg.sbKey, 'Content-Type': 'application/json' }, opts.headers || {});
  if (sbToken) headers.Authorization = 'Bearer ' + sbToken;
  var res = await fetch(base + path, Object.assign({}, opts, { headers: headers }));
  if (!res.ok) {
    var t = ''; try { t = (await res.json()).error_description || ''; } catch (e) {}
    throw new Error('Supabase ' + res.status + (t ? ': ' + t : ''));
  }
  return res.status === 204 ? null : res.json();
}
async function sbLogin(email, password) {
  var base = cfg.sbUrl.replace(/\/+$/, '');
  var res = await fetch(base + '/auth/v1/token?grant_type=password', {
    method: 'POST', headers: { apikey: cfg.sbKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: password })
  });
  var j = await res.json();
  if (!res.ok) throw new Error(j.error_description || j.msg || 'Login failed');
  sbToken = j.access_token;
}
async function loadSubs() {
  subs = await sbFetch('/rest/v1/route_submissions?status=eq.pending&order=created_at.desc&limit=100');
}

      editing = null; setDirty(true); toast('Driver saved'); render();
    }


    // ---- user submissions (Supabase) ----
    else if (act === 'sb-login') {
      cfg.sbUrl = val('sb_url'); cfg.sbKey = val('sb_key'); cfg.sbEmail = val('sb_email'); saveCfg();
      b.disabled = true; b.textContent = 'Signing in...';
      await sbLogin(cfg.sbEmail, document.getElementById('sb_pass').value);
      subs = null; render(); await loadSubs(); render();
    }
    else if (act === 'sb-logout') { sbToken = null; subs = null; render(); }
    else if (act === 'sb-refresh') { subs = null; render(); await loadSubs(); render(); }
    else if (act === 'sb-reject') {
      if (!confirm('Reject this submission?')) return;
      await sbFetch('/rest/v1/route_submissions?id=eq.' + subs[i].id, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ status: 'rejected' }) });
      subs.splice(i, 1); toast('Rejected'); render();
    }
    else if (act === 'sb-approve') {
      var sub = subs[i], v = subCardValues(i);
      if (!TIME_RE.test(v.start)) { toast('Set a valid start time'); return; }
      if (!placeById(sub.from_id) || !placeById(sub.to_id)) { toast('This route uses a place that no longer exists'); return; }
      var arrive = null, mid = [];
      v.stops.forEach(function (st) {
        if (st.place === sub.to_id) arrive = st.time;
        else if (st.place !== sub.from_id && placeById(st.place)) { var o = { place: st.place }; if (st.time) o.time = st.time; mid.push(o); }
      });
      var nr = { id: nextNum('r', data.routes), from: sub.from_id, to: sub.to_id, time: v.start };
      if (arrive) nr.arrive = arrive;
      if (sub.service_name) nr.service = sub.service_name;
      if (mid.length) nr.stops = mid;
      data.routes.push(nr); setDirty(true);
      await sbFetch('/rest/v1/route_submissions?id=eq.' + sub.id, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ status: 'approved' }) });
      subs.splice(i, 1); toast('Added to routes. Press Publish to make it live.'); render();
    }

    // ---- publish ----
    else if (act === 'publish') {
      b.disabled = true; b.textContent = 'Publishing...';
      await publish(); publishOpen = false; toast('Published. Data version ' + baseVersion); render();
    }
  } catch (err) {
    toast('Error: ' + err.message); render();
  }
});

// ============ Start ============
render();
if (cfg.token) {
  loadData().then(function () { tab = 'dashboard'; render(); }).catch(function (e) { toast('Could not load: ' + e.message); });
}
</script>
</body>
</html>
