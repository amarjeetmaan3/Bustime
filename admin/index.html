<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bustime Admin</title>
<style>
  :root {
    --brand:#1565C0; --brand-d:#0D47A1; --brand-l:#E3F2FD;
    --bg:#F4F6F9; --card:#FFFFFF; --line:#E3E7EC; --text:#1F2933; --muted:#667085;
    --red:#C62828; --red-l:#FDECEA; --green:#2E7D32; --green-l:#E8F5E9; --amber:#B26A00; --amber-l:#FFF4E0;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari","Noto Sans Gurmukhi",sans-serif; font-size:15px; }
  button { font:inherit; cursor:pointer; }
  input, select { font:inherit; width:100%; padding:10px 12px; border:1px solid #C9D1DA; border-radius:8px; background:#fff; color:var(--text); }
  input:focus, select:focus { outline:2px solid var(--brand-l); border-color:var(--brand); }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:14px 0 5px; text-transform:uppercase; letter-spacing:.03em; }

  .app { display:flex; min-height:100vh; }
  aside { width:220px; background:#fff; border-right:1px solid var(--line); padding:16px 10px; position:sticky; top:0; height:100vh; flex:0 0 auto; }
  .brand { font-weight:700; font-size:18px; color:var(--brand-d); padding:6px 10px 18px; }
  .brand small { display:block; font-weight:500; font-size:12px; color:var(--muted); }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nav button { display:flex; justify-content:space-between; align-items:center; border:0; background:none; text-align:left; padding:11px 12px; border-radius:8px; color:#344054; font-size:15px; }
  .nav button:hover { background:#F2F4F7; }
  .nav button.on { background:var(--brand-l); color:var(--brand-d); font-weight:600; }
  .nav .count { font-size:12px; background:#EAECF0; border-radius:10px; padding:1px 8px; color:#475467; }
  .nav button.on .count { background:#fff; }
  .content { flex:1; min-width:0; display:flex; flex-direction:column; }
  header.top { display:flex; align-items:center; gap:12px; padding:12px 24px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header.top h1 { font-size:20px; margin:0; flex:1; }
  .pill { font-size:12px; border-radius:12px; padding:3px 10px; background:#EAECF0; color:#475467; white-space:nowrap; }
  .pill.dirty { background:var(--amber-l); color:var(--amber); font-weight:600; }
  main { padding:24px; max-width:1100px; width:100%; }

  .btn { border:1px solid #C9D1DA; background:#fff; border-radius:8px; padding:9px 14px; font-weight:500; color:#344054; }
  .btn:hover { background:#F9FAFB; }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn.primary:hover { background:var(--brand-d); }
  .btn.danger { color:var(--red); border-color:#F1B8B3; }
  .btn.sm { padding:5px 10px; font-size:13px; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  .card h2 { font-size:16px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:13px; line-height:1.5; }
  .toolbar { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .toolbar .grow { flex:1; min-width:180px; }
  .toolbar select { width:auto; min-width:140px; }
  .tablewrap { background:#fff; border:1px solid var(--line); border-radius:12px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:640px; }
  th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); background:#F9FAFB; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:11px 14px; border-bottom:1px solid #F0F2F5; vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  td.actions { white-space:nowrap; text-align:right; }
  td.actions .btn { margin-left:6px; }
  .empty { padding:36px; text-align:center; color:var(--muted); }
  .badge { display:inline-block; font-size:12px; border-radius:10px; padding:2px 9px; background:var(--brand-l); color:var(--brand-d); font-weight:600; }
  .badge.green { background:var(--green-l); color:var(--green); }
  .badge.gray { background:#EAECF0; color:#475467; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
  .stat b { display:block; font-size:28px; color:var(--brand-d); }
  .stat span { font-size:13px; color:var(--muted); }
  .alert { border-radius:10px; padding:12px 14px; margin-top:10px; font-size:14px; }
  .alert.err { background:var(--red-l); color:var(--red); }
  .alert.warn { background:var(--amber-l); color:var(--amber); }
  .alert.ok { background:var(--green-l); color:var(--green); }
  .alert ul { margin:6px 0 0; padding-left:20px; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; margin:16px 0; }
  .chip { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 8px 10px 16px; }
  .chip b { font-size:18px; color:var(--brand-d); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stoprow { display:flex; gap:6px; margin-bottom:6px; align-items:center; }
  .stoprow select { flex:3; } .stoprow input { flex:1.2; }

  .overlay { position:fixed; inset:0; background:rgba(16,24,40,.5); display:none; align-items:flex-start; justify-content:center; padding:24px 12px; overflow-y:auto; z-index:30; }
  .overlay.show { display:flex; }
  .dialog { background:#fff; border-radius:14px; width:100%; max-width:560px; box-shadow:0 20px 40px rgba(0,0,0,.25); }
  .dlg-head { display:flex; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); }
  .dlg-head h2 { margin:0; font-size:17px; flex:1; }
  .dlg-head button { border:0; background:none; font-size:24px; line-height:1; color:var(--muted); }
  .dlg-body { padding:4px 20px 20px; }
  .dlg-foot { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1F2933; color:#fff; padding:11px 20px; border-radius:24px; display:none; z-index:50; max-width:92%; font-size:14px; }


  .workspace-nav { position:sticky; top:57px; z-index:4; display:flex; flex-direction:row; align-items:center; gap:8px; overflow-x:auto; white-space:nowrap; padding:10px 24px; background:#fff; border-bottom:1px solid var(--line); box-shadow:0 3px 12px rgba(22,34,55,.035); scrollbar-width:thin; }
  .workspace-tabs { display:contents; }
  .workspace-tab { flex:0 0 auto; border:0; border-radius:8px; background:transparent; color:#526176; padding:11px 16px; font-size:13px; font-weight:700; cursor:pointer; }
  .workspace-tab:hover { background:#F2F5FB; color:var(--brand-d); }
  .workspace-tab.active { background:var(--brand); color:#fff; box-shadow:0 3px 8px rgba(36,88,211,.16); }
  /* Professional console refresh */
  .nav button { line-height:1.25; }
  .bus-route-stats { grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); }
  .bus-route-stat { align-items:flex-start; }
  .bus-route-stat .btn { display:block; margin-top:10px; }
  .bus-page-head .btn { white-space:nowrap; }
  .request-card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  @media (max-width:860px) { .bus-route-stats { grid-template-columns:1fr; } }

  :root { --brand:#2458D3; --brand-d:#173B91; --brand-l:#EAF0FF; --bg:#F5F7FB; --line:#E5EAF2; --text:#182230; --muted:#66758A; }
  body { background:var(--bg); color:var(--text); font-size:14px; letter-spacing:.005em; }
  .app { min-height:100vh; }
  aside { width:248px; padding:22px 14px; background:#101C36; border-right:0; color:#fff; box-shadow:8px 0 24px rgba(16,28,54,.05); }
  .brand { color:#fff; font-size:21px; letter-spacing:-.04em; padding:5px 12px 28px; }
  .brand small { color:#A7B5D0; margin-top:5px; letter-spacing:.02em; }
  .nav { gap:5px; }
  .nav button { color:#B9C6DE; padding:12px 13px; border-radius:10px; font-size:14px; transition:background .15s,color .15s; }
  .nav button:hover { background:rgba(255,255,255,.08); color:#fff; }
  .nav button.on { background:#244A9B; color:#fff; box-shadow:inset 3px 0 #8FB3FF; }
  .nav .count { background:rgba(255,255,255,.12); color:#DCE7FF; }
  .nav button.on .count { background:rgba(255,255,255,.16); color:#fff; }
  header.top { padding:17px 30px; gap:14px; border-bottom:1px solid var(--line); box-shadow:0 3px 14px rgba(20,35,65,.025); }
  header.top h1 { font-size:21px; font-weight:750; letter-spacing:-.035em; }
  main { max-width:1500px; padding:28px 30px 44px; }
  .btn { border-color:#D8E0EC; border-radius:9px; padding:9px 13px; font-size:13px; font-weight:650; transition:all .15s ease; }
  .btn:hover { border-color:#B7C7E3; background:#F6F8FC; transform:translateY(-1px); }
  .btn.primary { background:var(--brand); border-color:var(--brand); box-shadow:0 3px 8px rgba(36,88,211,.15); }
  .btn.primary:hover { background:var(--brand-d); }
  .btn.danger { color:#B42318; border-color:#F1C8C4; background:#FFFAF9; }
  .card { border-color:var(--line); border-radius:15px; padding:22px; box-shadow:0 4px 16px rgba(22,34,55,.035); }
  .card h2 { font-size:16px; font-weight:750; letter-spacing:-.02em; }
  .muted { color:var(--muted); }
  .toolbar { gap:10px; margin-bottom:16px; }
  input, select { border-color:#D8E0EC; border-radius:10px; min-height:41px; }
  .tablewrap { border-color:var(--line); border-radius:14px; box-shadow:0 4px 16px rgba(22,34,55,.03); }
  table { min-width:760px; }
  th { padding:14px 16px; background:#F7F9FC; color:#69788E; font-size:10px; letter-spacing:.09em; }
  td { padding:15px 16px; border-bottom-color:#EDF1F6; }
  tbody tr:hover { background:#FAFBFE; }
  td.actions .btn { margin-left:4px; }
  .stats { gap:14px; }
  .analytics-empty { min-height:190px; border:1px dashed #CFD8E8; border-radius:12px; padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .analytics-bars { height:78px; width:100%; max-width:320px; display:flex; align-items:flex-end; justify-content:center; gap:12px; margin-bottom:18px; opacity:.45; }
  .analytics-bars i { display:block; width:22px; height:22%; background:#A8BCEB; border-radius:5px 5px 0 0; }
  .analytics-bars i:nth-child(2) { height:45%; } .analytics-bars i:nth-child(3) { height:32%; }
  .analytics-bars i:nth-child(4) { height:68%; } .analytics-bars i:nth-child(5) { height:52%; }
  .analytics-bars i:nth-child(6) { height:82%; } .analytics-bars i:nth-child(7) { height:60%; }
  .analytics-bars.horizontal { height:auto; flex-direction:column; align-items:stretch; gap:10px; opacity:.55; }
  .analytics-bars.horizontal i { height:12px; width:35%; border-radius:6px; }
  .analytics-bars.horizontal i:nth-child(2) { width:58%; } .analytics-bars.horizontal i:nth-child(3) { width:24%; }
  #analyticsPeriod { min-width:170px; }

  .stat { border-radius:14px; padding:19px; box-shadow:0 4px 16px rgba(22,34,55,.03); }
  .stat b { font-size:30px; letter-spacing:-.04em; }
  .badge { border-radius:7px; padding:4px 8px; font-size:11px; }
  .bus-page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:22px; }
  .bus-page-head h2 { margin:0 0 7px; font-size:25px; line-height:1.2; letter-spacing:-.045em; }
  .bus-page-head p { margin:0; max-width:650px; }
  .bus-route-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin:0 0 20px; }
  .bus-route-stat { background:#fff; border:1px solid var(--line); border-radius:13px; padding:16px 18px; display:flex; align-items:center; gap:13px; }
  .bus-route-stat .iconbox { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:#EAF0FF; color:#2458D3; font-weight:800; font-size:18px; flex:0 0 auto; }
  .bus-route-stat strong { display:block; font-size:23px; line-height:1.1; letter-spacing:-.04em; }
  .bus-route-stat span { display:block; color:var(--muted); font-size:12px; margin-top:5px; }
  .bus-route-toolbar { display:flex; align-items:center; gap:12px; padding:14px; background:#fff; border:1px solid var(--line); border-radius:13px 13px 0 0; border-bottom:0; }
  .bus-route-toolbar .searchbox { flex:1; min-width:180px; position:relative; }
  .bus-route-toolbar .searchbox input { padding-left:39px; }
  .bus-route-toolbar .searchmark { position:absolute; left:14px; top:10px; color:#8A98AC; font-size:17px; }
  .bus-route-table { border-radius:0 0 13px 13px; }
  .bus-route-table table { min-width:850px; }
  .route-time { display:inline-flex; align-items:center; background:#EAF7EF; color:#187447; border:1px solid #D3EBDD; border-radius:8px; padding:6px 9px; font-weight:800; font-size:13px; white-space:nowrap; }
  .route-line { display:flex; align-items:center; gap:9px; min-width:230px; }
  .route-line .endpoint { font-weight:750; color:#202C3D; }
  .route-line .arrow { color:#8C9BB0; font-size:16px; }
  .route-subline { color:#78869A; font-size:11px; margin-top:5px; }
  .route-count { display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:27px; padding:0 8px; border-radius:8px; background:#F0F3F8; color:#45546A; font-weight:750; }
  .bus-table-caption { display:flex; justify-content:space-between; gap:10px; padding:11px 15px; background:#fff; border:1px solid var(--line); border-top:0; border-radius:0 0 13px 13px; color:var(--muted); font-size:12px; }
  .bus-table-caption strong { color:#344054; }
  @media (max-width:860px) {
    aside { background:#101C36; }
    .nav { gap:4px; }
    .nav button { padding:10px 12px; }
    header.top, main { padding:14px; }
    .bus-page-head { flex-direction:column; }
    .bus-route-stats { grid-template-columns:1fr; gap:9px; }
    .bus-route-toolbar { flex-wrap:wrap; }
    .bus-route-toolbar .searchbox { flex-basis:100%; }
  }

  @media (max-width:860px) {
    .app { flex-direction:column; }
    aside { width:100%; height:auto; position:static; padding:8px; border-right:0; border-bottom:1px solid var(--line); }
    .brand { display:none; }
    .nav { flex-direction:row; overflow-x:auto; }
    .nav button { white-space:nowrap; }
    header.top, main { padding:12px; }
    .row2 { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Bustime<small>Admin console</small></div>
    <div class="nav" id="nav"></div>
  </aside>
  <div class="content">
    <header class="top">
      <h1 id="pageTitle">Dashboard</h1>
      <span class="pill" id="verPill"></span>
      <span class="pill dirty" id="dirty" style="display:none">Unpublished changes</span>
      <button class="btn primary" data-act="open-publish" id="pubBtn">Publish</button>
    </header>
    <nav id="workspaceNav" class="workspace-nav" aria-label="Workspace tabs" style="display:none"></nav>
    <main id="view"></main>
  </div>
</div>

<div class="overlay" id="overlay"><div class="dialog">
  <div class="dlg-head"><h2 id="dlgTitle"></h2><button data-act="close" aria-label="Close">&times;</button></div>
  <div class="dlg-body" id="dlgBody"></div>
</div></div>
<div id="toast"></div>

<script>
// ============ Settings (stored only in this browser) ============
var CFG_KEY = 'bustime_admin_cfg';
var DEFAULT_CFG = { owner:'amarjeetmaan3', repo:'Bustime', branch:'main', path:'app/src/main/assets/routes.json', token:'', sbUrl:'', sbKey:'', sbEmail:'' };
var cfg = loadCfg();
function loadCfg() {
  try { return Object.assign({}, DEFAULT_CFG, JSON.parse(localStorage.getItem(CFG_KEY) || '{}')); }
  catch (e) { return Object.assign({}, DEFAULT_CFG); }
}
function saveCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} }

// ============ State ============
var data = null, sha = null, baseVersion = 0, dirty = false;
var tab = 'settings';
var sbToken = null, subs = null, subsError = '';   // Supabase login lives only in memory
var reviewStatus = 'pending';
var community = { corrections:null, vehicles:null, feedback:null, busSubmissions:null, operators:null };
var communityStatus = 'pending';
var communitySection = 'all';
var editing = null;
var routeReviewEditor = null;

var communityReviewEditor = null;
function communityEditorHtml() {
 if(!communityReviewEditor)return '';
 var rec=communityReviewEditor.record,kind=communityReviewEditor.kind,draft=rec.reviewed_data&&typeof rec.reviewed_data==='object'?rec.reviewed_data:rec;
 var skip={id:1,status:1,created_at:1,updated_at:1,reviewed_data:1,reviewed_at:1,approved_at:1};
 var labels={vehicle_type:'Vehicle type',person_name:'Owner/driver name',vehicle_name:'Vehicle name',vehicle_model_number:'Model number',vehicle_number:'Vehicle number',seats:'Seats',area_name:'Service area',location:'Location',union_name:'Union',fuel_type:'Fuel type',phone:'Phone',whatsapp:'WhatsApp',details:'Details',operator_name:'Operator name',service_name:'Service name',bus_type:'Bus type',custom_category:'Custom category',seat_type:'Seat type',sleeper_count:'Sleeper berths',seater_count:'Seater seats',from_text:'From',to_text:'To',request_type:'Request type',route_id:'Route ID',before_stop_id:'Before stop ID',after_stop_id:'After stop ID',missing_place_name:'Missing stop',missing_time:'Missing stop time',stop_id:'Stop ID',corrected_time:'Corrected time',change_summary:'Change summary',proposed_stops:'Proposed stops JSON',category:'Category',related_route:'Related route',message:'Message',contact:'Contact',notes:'Notes'};
 var html='<p class="muted">Opening never approves a request. Edit and save a reviewed draft first; approve is a separate action. Original submission below is read-only.</p><div class="card" style="background:#f5f7fa"><b>Original submission · read-only</b><pre style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto">'+esc(JSON.stringify(rec,null,2))+'</pre></div>';
 Object.keys(rec).forEach(function(k){if(skip[k]||typeof rec[k]==='function')return;var value=Object.prototype.hasOwnProperty.call(draft,k)?draft[k]:rec[k],label=labels[k]||k.replace(/_/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});if(k==='original_stops'){html+='<label>'+esc(label)+' · original/read-only</label><pre style="white-space:pre-wrap">'+esc(JSON.stringify(value,null,2))+'</pre>';return;}if(value!==null&&typeof value==='object'){html+='<label>'+esc(label)+' · JSON</label><textarea data-cr-field="'+esc(k)+'" rows="5" style="width:100%;font-family:monospace">'+esc(JSON.stringify(value,null,2))+'</textarea>';}else{var type=/(time)$/.test(k)?'time':(/count$|^seats$/.test(k)?'number':'text');html+='<label>'+esc(label)+'</label><input data-cr-field="'+esc(k)+'" type="'+type+'" value="'+esc(value==null?'':String(value))+'">';}});
 html+='<div class="dlg-foot" style="justify-content:flex-start;gap:8px"><button class="btn" data-act="close">Cancel</button><button class="btn" data-act="community-save-draft" data-kind="'+esc(kind)+'" data-id="'+esc(rec.id)+'">Save reviewed draft</button><button class="btn primary" data-act="community-approve-reviewed" data-kind="'+esc(kind)+'" data-id="'+esc(rec.id)+'">Approve reviewed data</button></div>';return html;
}
function communityEditorValues(){var out={};document.querySelectorAll('#dlgBody [data-cr-field]').forEach(function(el){var k=el.getAttribute('data-cr-field');if(el.tagName==='TEXTAREA'){try{out[k]=JSON.parse(el.value);}catch(e){throw new Error('Invalid JSON in '+k+'. Fix it before saving.');}}else if(el.type==='number'){out[k]=el.value.trim()===''?null:Number(el.value);if(el.value.trim()!==''&&!Number.isFinite(out[k]))throw new Error('Invalid number in '+k+'.');}else out[k]=el.value.trim()===''?null:el.value.trim();});return out;}
function showCommunityEditor(kind,record){communityReviewEditor={kind:kind,record:JSON.parse(JSON.stringify(record))};editing=null;routeReviewEditor=null;publishOpen=false;render();}

var publishOpen = false;
var filters = { places:'', placeKind:'', routes:'', drivers:'', driverType:'' };

var NAV = [
  ['dashboard','Dashboard'], ['analytics','Analytics & Stats'], ['bus','Bus'], ['taxi','Taxi'],
  ['auto','Auto'], ['review','Review Center'], ['settings','Settings']
];
var TITLES = {
  dashboard:'Dashboard', analytics:'Analytics & Stats', bus:'Bus', taxi:'Taxi', auto:'Auto', places:'Bus · Places',
  routes:'Bus · Routes', busRequests:'Bus · Route Requests', addBus:'Bus · Add Your Bus', busDirectory:'Bus · Operator Directory',
  taxiReview:'Taxi · Submissions', autoReview:'Auto · Submissions', seats:'Taxi · Seat Options',
  drivers:'Taxi · Directory', autoDrivers:'Auto · Directory', corrections:'Review Center · Corrections',
  feedbackReview:'Review Center · Feedback', review:'Review Center', settings:'Settings'
};

// ============ Helpers ============
function $(s) { return document.querySelector(s); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 3500);
}
function b64encode(str) {
  var bytes = new TextEncoder().encode(str), bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(b64) {
  var bin = atob(b64.replace(/\s/g, '')), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function pname(p) { var n = (p && p.name) || {}; return n.en || n.hi || n.pa || (p && p.id) || ''; }
function placeById(id) { return data.places.find(function (p) { return p.id === id; }); }
function placeText(p) {
  var n = Object.keys(p.name || {}).map(function (k) { return p.name[k]; });
  return n.concat(p.aliases || [], [p.id]).join(' ').toLowerCase();
}
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); }
function makeId(prefix, base, exists) {
  var b = prefix + (slug(base) || 'x'), id = b, n = 2;
  while (exists(id)) { id = b + '_' + n++; }
  return id;
}
function nextNum(prefix, list) {
  var max = 0;
  list.forEach(function (x) {
    var m = String(x.id || '').match(new RegExp('^' + prefix + '(\\d+)$'));
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return prefix + (max + 1);
}
function setDirty(v) { dirty = v; refreshChrome(); }
window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
var TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
function fmtTime(t) {
  if (!t) return '-';
  var h = parseInt(t.slice(0, 2), 10), m = t.slice(3, 5);
  return ((h % 12) || 12) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM');
}

// ============ GitHub API ============
function apiUrl() { return 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + cfg.path; }
function ghHeaders() {
  var h = { 'Accept': 'application/vnd.github+json' };
  if (cfg.token) h['Authorization'] = 'Bearer ' + cfg.token;
  return h;
}
function normalize(d) {
  var o = { dataVersion: d.dataVersion || 0, places: d.places || [], routes: d.routes || [],
            taxiSeaters: d.taxiSeaters || [], drivers: d.drivers || [] };
  if (d._note) o._note = d._note;
  return o;
}
async function loadData() {
  var r = await fetch(apiUrl() + '?ref=' + encodeURIComponent(cfg.branch) + '&t=' + Date.now(),
                      { headers: ghHeaders(), cache: 'no-store' });
  if (!r.ok) throw new Error('GitHub ' + r.status + ' - ' + (await r.text()).slice(0, 160));
  var j = await r.json();
  if (!j.content) throw new Error('Could not read the data file');
  data = normalize(JSON.parse(b64decode(j.content)));
  sha = j.sha; baseVersion = data.dataVersion || 0; editing = null; publishOpen = false; setDirty(false);
}
async function publish() {
  if (!cfg.token) { toast('Add your GitHub token in Settings first'); return; }
  var v = validate();
  if (v.errors.length) { toast('Fix the errors first'); return; }
  var out = {};
  if (data._note) out._note = data._note;
  out.dataVersion = baseVersion + 1;
  out.places = data.places; out.routes = data.routes;
  out.taxiSeaters = data.taxiSeaters; out.drivers = data.drivers;
  var body = {
    message: 'Data update v' + out.dataVersion + ' [skip ci]',
    content: b64encode(JSON.stringify(out, null, 2) + '\n'),
    sha: sha, branch: cfg.branch
  };
  var h = ghHeaders(); h['Content-Type'] = 'application/json';
  var r = await fetch(apiUrl(), { method: 'PUT', headers: h, body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) {
    throw new Error('The file was changed elsewhere in the meantime. Reload from GitHub (your unpublished changes will be lost).');
  }
  if (!r.ok) throw new Error('GitHub ' + r.status + ' - ' + (await r.text()).slice(0, 160));
  var j = await r.json();
  sha = j.content.sha; baseVersion = out.dataVersion; data.dataVersion = out.dataVersion; setDirty(false);
}

// ============ Validation (same rules the app applies on import) ============
function validate() {
  var errors = [], warnings = [], pids = {};
  data.places.forEach(function (p) {
    if (!p.id) errors.push('A place has no id');
    else if (pids[p.id]) errors.push('Duplicate place id: ' + p.id);
    pids[p.id] = true;
    var hasName = Object.keys(p.name || {}).some(function (k) { return String(p.name[k] || '').trim(); });
    if (!hasName) errors.push('Place "' + p.id + '" has no name');
  });
  var noHi = data.places.filter(function (p) { return !(p.name && p.name.hi); }).length;
  var noPa = data.places.filter(function (p) { return !(p.name && p.name.pa); }).length;
  if (noHi) warnings.push(noHi + ' place(s) have no Hindi name');
  if (noPa) warnings.push(noPa + ' place(s) have no Punjabi name');

  var rids = {};
  data.routes.forEach(function (r) {
    var tag = 'Route ' + r.id;
    if (!r.id) errors.push('A route has no id');
    else if (rids[r.id]) errors.push('Duplicate route id: ' + r.id);
    rids[r.id] = true;
    if (!pids[r.from]) errors.push(tag + ': "From" place does not exist');
    if (!pids[r.to]) errors.push(tag + ': "To" place does not exist');
    if (r.from && r.from === r.to) errors.push(tag + ': From and To are the same');
    if (!TIME_RE.test(r.time || '')) errors.push(tag + ': invalid departure time');
    (r.stops || []).forEach(function (s) { if (!pids[s.place]) errors.push(tag + ': a stop refers to a missing place'); });
  });

  var dids = {};
  data.drivers.forEach(function (d) {
    var tag = 'Driver ' + (d.name || d.id);
    if (!d.id) errors.push('A driver has no id');
    else if (dids[d.id]) errors.push('Duplicate driver id: ' + d.id);
    dids[d.id] = true;
    if (d.type !== 'taxi' && d.type !== 'auto') errors.push(tag + ': invalid type');
    if (!String(d.name || '').trim()) errors.push(tag + ': name is required');
    var digits = String(d.phone || '').replace(/\D/g, '').length;
    if (digits < 10 || digits > 13) errors.push(tag + ': invalid mobile number');
    if (d.type === 'taxi' && !(d.seats > 0)) errors.push(tag + ': taxi needs a seat count');
  });
  var hidden = data.drivers.filter(function (d) {
    return d.type === 'taxi' && data.taxiSeaters.length && data.taxiSeaters.indexOf(d.seats) < 0;
  }).length;
  if (hidden) warnings.push(hidden + ' taxi driver(s) will not appear in the app (their seat count is not in the Taxi Seats list)');
  return { errors: errors, warnings: warnings };
}
function reportHtml(v) {
  return (v.errors.length ? '<div class="alert err"><b>Errors (publishing is blocked)</b><ul>' +
      v.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>'
    : '<div class="alert ok">No errors. The data is valid.</div>') +
    (v.warnings.length ? '<div class="alert warn"><b>Warnings</b><ul>' +
      v.warnings.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>' : '');
}

async function loadAnalytics() {
  var cards = document.getElementById('analyticsCards');
  if (!cards) return;
  var period = document.getElementById('analyticsPeriod');
  var fromInput = document.getElementById('analyticsFrom');
  var toInput = document.getElementById('analyticsTo');
  var now = new Date(), start = new Date(now);
  if (period && period.value === 'today') start.setHours(0,0,0,0);
  else if (period && period.value === '30') start.setDate(start.getDate()-29);
  else if (period && period.value === 'custom') {
    if (!fromInput.value || !toInput.value) return;
    start = new Date(fromInput.value + 'T00:00:00');
    now = new Date(toInput.value + 'T23:59:59');
  } else start.setDate(start.getDate()-6);
  if (period && period.value !== 'custom') start.setHours(0,0,0,0);
  var daily = document.getElementById('analyticsDaily'), sections = document.getElementById('analyticsSections');
  if (!sbToken) {
    cards.innerHTML = analyticsStat('—','App users','Admin sign-in required') + analyticsStat('—','Bus searches','Admin sign-in required') + analyticsStat('—','Taxi activity','Admin sign-in required') + analyticsStat('—','Auto activity','Admin sign-in required') + analyticsStat('—','Contact actions','Admin sign-in required') + analyticsStat('—','Ad earnings','AdMob reporting not connected');
    if (daily) daily.innerHTML = '<b>Sign in to view analytics</b>';
    if (sections) sections.innerHTML = '<b>Sign in to view analytics</b>';
    return;
  }
  try {
    var url = '/rest/v1/analytics_events?select=created_at,event_name,section,session_id,properties&created_at=gte.' + encodeURIComponent(start.toISOString()) + '&created_at=lte.' + encodeURIComponent(now.toISOString()) + '&order=created_at.asc&limit=5000';
    var events = await sbFetch(url) || [];
    var unique = {};
    events.forEach(function(e){ unique[e.session_id] = true; });
    function count(fn) { return events.filter(fn).length; }
    var bus = count(function(e){return e.section==='bus' && /search/.test(e.event_name);});
    var taxi = count(function(e){return e.section==='taxi';});
    var auto = count(function(e){return e.section==='auto';});
    var contacts = count(function(e){return /contact|call|whatsapp/.test(e.event_name);});
    cards.innerHTML = analyticsStat(Object.keys(unique).length,'App sessions','Unique random app sessions in selected period') +
      analyticsStat(bus,'Bus searches','From–To and stand searches') +
      analyticsStat(taxi,'Taxi activity','Recorded Taxi events') +
      analyticsStat(auto,'Auto activity','Recorded Auto events') +
      analyticsStat(contacts,'Contact actions','Recorded contact taps') +
      analyticsStat('—','Ad earnings','Connect official AdMob reporting');
    if (daily) {
      var buckets = {}, cursor = new Date(start); cursor.setHours(0,0,0,0);
      while (cursor <= now) { var key = cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0')+'-'+String(cursor.getDate()).padStart(2,'0'); buckets[key]=0; cursor.setDate(cursor.getDate()+1); }
      events.forEach(function(e){var d=new Date(e.created_at), k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if (buckets[k] != null) buckets[k]++;});
      var vals=Object.keys(buckets).map(function(k){return {day:k,total:buckets[k]};}), max=Math.max(1,...vals.map(function(v){return v.total;}));
      daily.innerHTML = '<div class="analytics-bars">' + vals.slice(-14).map(function(v){return '<div title="'+esc(v.day+': '+v.total)+' events" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:1;min-width:5px"><i style="height:'+Math.max(3,Math.round(v.total/max*100))+'%;width:100%;background:#4F7EDB;border-radius:4px 4px 0 0"></i></div>';}).join('') + '</div><b>'+events.length+' events</b><p class="muted">Recorded events by day; newest dates at right</p>';
    }
    if (sections) {
      var by=[{name:'Bus',n:count(function(e){return e.section==='bus';})},{name:'Taxi',n:taxi},{name:'Auto',n:auto}], maxSection=Math.max(1,...by.map(function(x){return x.n;}));
      sections.innerHTML=by.map(function(x){return '<div style="width:100%;text-align:left;margin:10px 0"><div style="display:flex;justify-content:space-between"><b>'+x.name+'</b><span>'+x.n+'</span></div><div style="height:12px;background:#EEF2F8;border-radius:8px;overflow:hidden;margin-top:5px"><div style="height:100%;width:'+Math.round(x.n/maxSection*100)+'%;background:#4F7EDB;border-radius:8px"></div></div></div>';}).join('') + '<p class="muted">Counts are recorded events, not unique people.</p>';
    }
    if (!events.length && daily) daily.innerHTML='<b>No events recorded for this period</b><p class="muted">New events appear after users run an updated app build.</p>';
    toast('Analytics updated: '+events.length+' events');
  } catch (err) {
    if (daily) daily.innerHTML='<b>Could not load analytics</b><p class="muted">'+esc(err.message)+'</p>';
    toast('Analytics error: '+err.message);
  }
}

// ============ Supabase (user submissions) ============
async function sbFetch(path, opts) {
  opts = opts || {};
  var base = cfg.sbUrl.replace(/\/+$/, '');
  var headers = Object.assign({ apikey: cfg.sbKey, 'Content-Type': 'application/json' }, opts.headers || {});
  if (sbToken) headers.Authorization = 'Bearer ' + sbToken;
  var res = await fetch(base + path, Object.assign({}, opts, { headers: headers }));
  if (!res.ok) {
    var t = ''; try { var j = await res.json(); t = j.error_description || j.message || j.hint || ''; } catch (e) {}
    throw new Error('Supabase ' + res.status + (t ? ': ' + t : ''));
  }
  if (res.status === 204) return null;
  // PostgREST may return an empty body even with a 2xx status (Prefer: return=minimal).
  // Do not call response.json() on an empty string: it throws "Unexpected end of JSON input".
  var raw = await res.text();
  if (!raw || !raw.trim()) return null;
  var contentType = res.headers.get('content-type') || '';
  if (contentType.indexOf('json') >= 0) {
    try { return JSON.parse(raw); }
    catch (e) { throw new Error('Supabase returned invalid JSON (' + res.status + ').'); }
  }
  return raw;
}
async function sbLogin(email, password) {
  var base = cfg.sbUrl.replace(/\/+$/, '');
  var res = await fetch(base + '/auth/v1/token?grant_type=password', {
    method: 'POST', headers: { apikey: cfg.sbKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: password })
  });
  var j = await res.json();
  if (!res.ok) throw new Error(j.error_description || j.msg || 'Login failed');
  sbToken = j.access_token;
}

function subCardValues(i) {
  var card = document.querySelector('[data-sub="' + i + '"]'), times = [];
  // The list can be re-rendered while a review click is being handled. Never
  // dereference a missing card/control; show a recoverable message instead.
  if (!card) return null;
  function fieldValue(selector) {
    var field = card.querySelector(selector);
    return field && typeof field.value === 'string' ? field.value : '';
  }
  card.querySelectorAll('.sub_t').forEach(function (el) {
    var row = el.closest('.stoprow'), nameInput = row ? row.querySelector('.sub_name') : null;
    var timeValue = typeof el.value === 'string' ? el.value : '';
    times.push({
      place: el.getAttribute('data-place'),
      name: nameInput && typeof nameInput.value === 'string' ? nameInput.value.trim() : '',
      time: TIME_RE.test(timeValue) ? timeValue : null
    });
  });
  return {
    start: fieldValue('.sub_start'),
    from: fieldValue('.sub_from').trim(),
    to: fieldValue('.sub_to').trim(),
    service: fieldValue('.sub_service').trim(),
    stops: times
  };
}
function nearSubmittedPlaces(rawName) {
  var normalize = function (v) { return String(v || '').toLowerCase().normalize('NFKD').replace(/[\\u0300-\\u036f]/g, '').replace(/[^\\p{L}\\p{N}]+/gu, ' ').trim().replace(/\\s+/g, ' '); };
  var candidate = normalize(rawName);
  if (!candidate) return [];
  return data.places.filter(function (p) {
    return Object.keys(p.name || {}).some(function (k) {
      var existing = normalize(p.name[k]);
      return existing && existing !== candidate && (existing.indexOf(candidate) >= 0 || candidate.indexOf(existing) >= 0 ||
        (Math.abs(existing.length - candidate.length) <= 2 && existing.split(' ').length === candidate.split(' ').length &&
         existing.split(' ').some(function (word) { return candidate.split(' ').some(function (other) { return word.length >= 4 && other.length >= 4 && (word.indexOf(other) === 0 || other.indexOf(word) === 0); }); })));
    });
  }).slice(0, 5);
}
function warnNearSubmittedPlaces(names) {
  var warnings = [];
  (names || []).forEach(function (name) {
    nearSubmittedPlaces(name).forEach(function (p) {
      var label = pname(p) || p.id;
      if (warnings.indexOf(String(name) + ' → ' + label) < 0) warnings.push(String(name) + ' → ' + label);
    });
  });
  if (!warnings.length) return true;
  return confirm('Possible similar place names found. Nothing will be merged automatically.\n\n' + warnings.join('\n') + '\n\nContinue as separate/editable place records?');
}
function ensureSubmittedPlace(rawName) {
  var name = String(rawName || '').trim();
  var lower = name.toLowerCase().replace(/\s+/g, ' ');
  var existing = data.places.find(function (p) { return Object.keys(p.name || {}).some(function(k){ return String(p.name[k] || '').trim().toLowerCase().replace(/\s+/g, ' ') === lower; }); });
  if (existing) return existing.id;
  var id = makeId('place_user_', name, function (candidate) { return !!placeById(candidate); });
  data.places.push({ id:id, kind:'place', name:{ en:name } });
  setDirty(true);
  return id;
}

function communityTable(kind) { return kind==='corrections'?'correction_submissions':kind==='vehicles'?'vehicle_submissions':kind==='busSubmissions'?'bus_operator_submissions':'feedback_submissions'; }
function applyApprovedCorrection(x) {
  var r = data.routes.find(function(z){ return z.id === x.route_id; });
  if (!r) throw new Error('Route '+x.route_id+' was not found in routes.json; request not approved.');
  if (x.request_type === 'correct_time') {
    if (x.stop_id === r.from) r.time = x.corrected_time;
    else if (x.stop_id === r.to) r.arrive = x.corrected_time;
    else {
      var st = (r.stops || []).find(function(z){return z.place===x.stop_id;});
      if (!st) throw new Error('Selected stop was not found in this route; request not approved.');
      st.time = x.corrected_time;
    }
  } else if (x.request_type === 'route_edit') {
    var proposed = Array.isArray(x.proposed_stops) ? x.proposed_stops : [];
    if (proposed.length < 2 || proposed.length > 100) throw new Error('The proposed route must contain a start, destination, and no more than 100 stops.');
    var ids = [];
    proposed.forEach(function(st) {
      var pid = st.place_id || '';
      if (pid && !placeById(pid)) throw new Error('A selected place no longer exists: ' + pid);
      if (!pid) {
        var typed = String(st.name || '').trim();
        if (!typed) throw new Error('Every proposed stop must have a name.');
        var found = data.places.find(function(p) {
          return Object.keys(p.name || {}).some(function(lang) { return String((p.name || {})[lang] || '').trim().toLowerCase() === typed.toLowerCase(); });
        });
        if (found) pid = found.id;
        else {
          pid = makeId('place_', typed, function(id){return data.places.some(function(p){return p.id===id;});});
          var lang = ['en','hi','pa'].indexOf(st.language) >= 0 ? st.language : 'en';
          var names = {}; names[lang] = typed;
          data.places.push({id:pid,kind:'place',name:names,aliases:[]});
        }
      }
      ids.push(pid);
    });
    var times = proposed.map(function(st){return String(st.time || '').trim();});
    r.from = ids[0];
    if (times[0]) r.time = times[0];
    r.to = ids[ids.length - 1];
    if (times[times.length - 1]) r.arrive = times[times.length - 1]; else delete r.arrive;
    r.stops = [];
    for (var ri = 1; ri < ids.length - 1; ri++) {
      var middle = {place:ids[ri]};
      if (times[ri]) middle.time = times[ri];
      r.stops.push(middle);
    }
    if (!r.stops.length) delete r.stops;
    setDirty(true);
  } else if (x.request_type === 'missing_stop') {
    var before = x.before_stop_id, after = x.after_stop_id;
    var placeId = x.missing_place_id || '';
    if (!placeId) {
      placeId = makeId('place_', x.missing_place_name || 'missing_stop', function(id){return data.places.some(function(p){return p.id===id;});});
      data.places.push({id:placeId,kind:'place',name:{en:x.missing_place_name},aliases:[]});
    } else if (!placeById(placeId)) { throw new Error('The selected existing place no longer exists; request not approved.'); }
    var stops = r.stops || (r.stops=[]);
    var beforeIndex = before===r.from ? -1 : stops.findIndex(function(z){return z.place===before;});
    var afterIndex = after===r.to ? stops.length : stops.findIndex(function(z){return z.place===after;});
    if (beforeIndex < -1 || afterIndex < 0 || afterIndex !== beforeIndex+1) {
      if (!x.missing_place_id) data.places.pop(); throw new Error('The two chosen stops are no longer adjacent; request not approved.');
    }
    var newStop = {place:placeId}; if (x.missing_time) newStop.time=x.missing_time;
    stops.splice(afterIndex,0,newStop);
  }
  setDirty(true);
}

function routeReviewValues() {
  if (!routeReviewEditor) return null;

    });

  });
  var fromNames = names('from'), toNames = names('to');
  return {fromNames:fromNames,toNames:toNames,from:fromNames.en || fromNames.hi || fromNames.pa || '',
    to:toNames.en || toNames.hi || toNames.pa || '',start:field('#rv_start'),service:field('#rv_service'),stops:stops};
}
function ensureReviewedPlace(names, preferredId) {
  names = names || {}; var clean = {};
  ['en','hi','pa'].forEach(function(lang){var value=String(names[lang] || '').trim();if(value)clean[lang]=value;});
  var primary=clean.en || clean.hi || clean.pa || '';
  if (!primary) return preferredId && placeById(preferredId) ? preferredId : null;
  function norm(v){return String(v || '').trim().toLowerCase().replace(/\s+/g,' ');}
  var place=preferredId ? placeById(preferredId) : null;
  if (!place) {
    var variants=Object.keys(clean).map(function(k){return norm(clean[k]);});
    place=data.places.find(function(p){return Object.keys(p.name || {}).some(function(k){return variants.indexOf(norm(p.name[k]))>=0;});}) || null;
  }
  if (!place) { place={id:makeId('place_user_',primary,function(candidate){return !!placeById(candidate);}),kind:'place',name:{},aliases:[]};data.places.push(place); }
  place.name=place.name || {};
  ['en','hi','pa'].forEach(function(lang){if(clean[lang])place.name[lang]=clean[lang];});
  setDirty(true); return place.id;
}

      var fromId = isFreeText ? ensureReviewedPlace(v.fromNames, sub.from_id) : sub.from_id;
      var toId = isFreeText ? ensureReviewedPlace(v.toNames, sub.to_id) : sub.to_id;
      var previousReviewTime = effectiveStart, invalidReviewTime = false, inferredDayOffset = 0;
      v.stops.forEach(function (st) {
        if (st.time && st.time < previousReviewTime) {
          if (isFreeText) inferredDayOffset++;
          else if (!sub.long_route) invalidReviewTime = true;
        }
        if (st.time) previousReviewTime = st.time;
        if (isFreeText && inferredDayOffset > 0) st.day_offset = inferredDayOffset;
      });
      if (invalidReviewTime) { toast('A stop time is earlier than the previous time. Check the times before approving.'); return; }
      var arrive = null, mid = [];
      v.stops.forEach(function (st) {
        var stopPlace = st.place;
        if (st.name) stopPlace = ensureReviewedPlace(st.names || {en:st.name}, st.place);
        if (stopPlace === toId) arrive = st.time;
        else if (stopPlace && stopPlace !== fromId && placeById(stopPlace)) { var o = { place:stopPlace }; if (st.time) o.time = st.time; if (st.day_offset != null) o.day_offset = st.day_offset; mid.push(o); }
      });
      var nr = { id: nextNum('r', data.routes), from: fromId, to: toId, time: effectiveStart };
      if (sub.long_route) { nr.longRoute = true; nr.startDate = sub.start_date; }
      if (arrive) nr.arrive = arrive;
      if (v.service) nr.service = v.service;
      if (mid.length) nr.stops = mid;
      data.routes.push(nr); setDirty(true);
      await sbFetch('/rest/v1/route_submissions?id=eq.' + sub.id, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ status: 'approved' }) });
      subs[i].status = 'approved'; routeReviewEditor = null; toast('Approved and retained in Approved list. Press Publish to make it live.'); render();
    }

    // ---- community requests ----
    else if (act === 'community-open') {
      var okind=b.getAttribute('data-kind'),oid=b.getAttribute('data-id'),orec=(community[okind]||[]).find(function(x){return x.id===oid;});
      if(!orec||orec.status!=='pending'){toast('Only pending requests can be opened. Refresh the list.');return;} showCommunityEditor(okind,orec);return;
    }
    else if (act === 'community-save-draft' || act === 'community-approve-reviewed') {
      var rk=b.getAttribute('data-kind'),rid=b.getAttribute('data-id'),rt=communityTable(rk),orig=(community[rk]||[]).find(function(x){return x.id===rid;});
      if(!orig||orig.status!=='pending'||!communityReviewEditor||communityReviewEditor.record.id!==rid){toast('Request is no longer pending. Refresh and reopen it.');return;}
      var rv=communityEditorValues(),merged=Object.assign({},orig,rv),stamp=new Date().toISOString();
      if(act==='community-save-draft'){await sbFetch('/rest/v1/'+rt+'?id=eq.'+encodeURIComponent(rid),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({reviewed_data:rv,reviewed_at:stamp})});orig.reviewed_data=rv;orig.reviewed_at=stamp;communityReviewEditor.record.reviewed_data=rv;toast('Reviewed draft saved. Request remains pending; original is unchanged.');render();return;}
      if(!confirm('Approve the reviewed data into the main app data? This does not publish the GitHub snapshot.'))return;
      if(rk==='corrections')applyApprovedCorrection(merged);
      if(rk==='vehicles'){
        if(!merged.person_name||!merged.vehicle_name||!merged.phone){toast('Owner/driver name, vehicle name and phone are required.');return;}
        var vd={id:nextNum(merged.vehicle_type==='taxi'?'t':'a',data.drivers),type:merged.vehicle_type,name:merged.person_name,vehicle:merged.vehicle_name+(merged.vehicle_model_number?' · '+merged.vehicle_model_number:''),phone:merged.phone,areaId:merged.area_name||merged.location||null,info:(merged.union_name?'Union: '+merged.union_name+' · ':'')+(merged.vehicle_number?'Vehicle No: '+merged.vehicle_number+' · ':'')+(merged.details||'')};
        if(merged.vehicle_type==='auto')vd.fuel=(merged.fuel_type||merged.fuel||'oil').toLowerCase();if(merged.union_name)vd.union_name=merged.union_name;if(merged.seats)vd.seats=merged.seats;data.drivers.push(vd);setDirty(true);
      }
      if(rk==='busSubmissions'){
        if(!merged.operator_name||!merged.phone){toast('Operator name and phone are required.');return;}
        await sbFetch('/rest/v1/bus_operators',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({operator_name:merged.operator_name,service_name:merged.service_name||null,bus_type:merged.bus_type||'Ordinary',custom_category:merged.custom_category||null,seat_type:merged.seat_type||null,sleeper_count:merged.sleeper_count,seater_count:merged.seater_count,from_text:merged.from_text||null,to_text:merged.to_text||null,location:merged.location||null,phone:merged.phone,whatsapp:merged.whatsapp||null,details:merged.details||null,active:true})});
      }
      await sbFetch('/rest/v1/'+rt+'?id=eq.'+encodeURIComponent(rid),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({reviewed_data:rv,reviewed_at:stamp,approved_at:stamp,status:'approved'})});
      orig.reviewed_data=rv;orig.reviewed_at=stamp;orig.approved_at=stamp;orig.status='approved';communityReviewEditor=null;
      toast('Approved reviewed data; original submission retained. Publish separately to make snapshot changes live.');render();return;
    }
    else if (act === 'community-refresh') { await loadCommunity(); render(); }
    else if (act === 'community-status') { communityStatus = b.getAttribute('data-status'); render(); }
    else if (act === 'community-section') { communitySection = b.getAttribute('data-section') || 'corrections'; render(); }
    else if (act === 'community-reject' || act === 'community-approve') {
      var kind = b.getAttribute('data-kind'), cid = b.getAttribute('data-id'), table = communityTable(kind);
      var listKey = kind, record = (community[listKey] || []).find(function(x){return x.id===cid;});
      if (!record || record.status !== 'pending') { toast('This request is no longer pending. Refresh the list.'); return; }
      if (act === 'community-approve') {
        if (kind === 'corrections') applyApprovedCorrection(record);
        if (kind === 'vehicles') {
          var driver = { id:nextNum(record.vehicle_type==='taxi'?'t':'a', data.drivers), type:record.vehicle_type, name:record.person_name, vehicle:record.vehicle_name + (record.vehicle_model_number ? ' · '+record.vehicle_model_number : ''), phone:record.phone, areaId:record.area_name || record.location || null, info:(record.union_name ? 'Union: '+record.union_name+' · ' : '') + (record.vehicle_number ? 'Vehicle No: '+record.vehicle_number+' · ' : '') + (record.details || '') };
          if (record.vehicle_type==='auto') driver.fuel=(record.fuel_type||record.fuel||'oil').toLowerCase();
          if (record.union_name) driver.union_name=record.union_name;
          if (record.seats) driver.seats = record.seats;
          data.drivers.push(driver); setDirty(true);
        }
        if (kind === 'busSubmissions') {
          await sbFetch('/rest/v1/bus_operators', { method:'POST', headers:{Prefer:'return=minimal'}, body:JSON.stringify({operator_name:record.operator_name,service_name:record.service_name||null,bus_type:record.bus_type||'Ordinary',custom_category:record.custom_category||null,seat_type:record.seat_type||null,sleeper_count:record.sleeper_count,seater_count:record.seater_count,from_text:record.from_text||null,to_text:record.to_text||null,location:record.location||null,phone:record.phone,whatsapp:record.whatsapp||null,details:record.details||null,active:true}) });
        }
      } else if (!confirm('Reject this request?')) return;
      await sbFetch('/rest/v1/'+table+'?id=eq.'+encodeURIComponent(cid), { method:'PATCH', headers:{Prefer:'return=minimal'}, body:JSON.stringify({status:act==='community-approve'?'approved':'rejected'}) });
      record.status = act==='community-approve'?'approved':'rejected'; toast(act==='community-approve'?(kind==='vehicles'?'Approved in Admin data. Press Publish at the top to make this Taxi/Auto listing visible in the app.':kind==='busSubmissions'?'Bus operator approved and published to the operator directory.':'Approved. If route data changed, press Publish to make it live.'):'Moved to Rejected.'); render();
    }
    else if (act === 'community-delete') {
      var dk=b.getAttribute('data-kind'), did=b.getAttribute('data-id'), dtable=communityTable(dk);
      var drec=(community[dk]||[]).find(function(x){return x.id===did;});
      if (!drec || drec.status!=='rejected') { toast('Only rejected requests can be deleted.'); return; }
      if (!confirm('Permanently delete this rejected request?')) return;
      await sbFetch('/rest/v1/'+dtable+'?id=eq.'+encodeURIComponent(did)+'&status=eq.rejected',{method:'DELETE',headers:{Prefer:'return=minimal'}});
      community[dk]=community[dk].filter(function(x){return x.id!==did;}); render();
    }
    else if (act === 'category-add') {
      var categoryName=val('bus_category_name').trim();
      if (!categoryName || categoryName.length>60) { toast('Enter a category name (1–60 characters).'); return; }
      await sbFetch('/rest/v1/bus_categories',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({name:categoryName,active:true})});
      await loadCommunity(); toast('Bus category added.'); render();
    }
    else if (act === 'category-toggle') {
      var catId=b.getAttribute('data-id'), catActive=b.getAttribute('data-active')==='true';
      await sbFetch('/rest/v1/bus_categories?id=eq.'+encodeURIComponent(catId),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({active:catActive})});
      await loadCommunity(); render();
    }
    else if (act === 'operator-add') {
      var on=val('op_name'), op=val('op_phone').replace(/[^+0-9 -]/g,'');
      if (!on || op.replace(/\D/g,'').length<9) { toast('Enter operator name and valid phone.'); return; }
      await sbFetch('/rest/v1/bus_operators',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({operator_name:on,service_name:val('op_service')||null,bus_type:val('op_type')||'Bus',seat_type:val('op_seat_type')||null,sleeper_count:parseInt(val('op_sleeper_count'),10)||null,seater_count:parseInt(val('op_seater_count'),10)||null,phone:op,whatsapp:val('op_whatsapp')||null,location:val('op_location')||null,from_text:null,to_text:null,details:val('op_details')||null,active:true})});
      await loadCommunity(); toast('Operator added and published.'); render();
    }
    else if (act === 'operator-toggle') {
      var oid=b.getAttribute('data-id'), active=b.getAttribute('data-active')==='true';
      await sbFetch('/rest/v1/bus_operators?id=eq.'+encodeURIComponent(oid),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({active:active})});
      await loadCommunity(); render();
    }
    else if (act === 'operator-delete') {
      var odid=b.getAttribute('data-id'); if(!confirm('Delete this bus operator?')) return;
      await sbFetch('/rest/v1/bus_operators?id=eq.'+encodeURIComponent(odid),{method:'DELETE',headers:{Prefer:'return=minimal'}});
      await loadCommunity(); render();
    }

    // ---- publish ----
    else if (act === 'publish') {
      b.disabled = true; b.textContent = 'Publishing...';
      await publish(); publishOpen = false; toast('Published. Data version ' + baseVersion); render();
    }
  } catch (err) {
    toast('Error: ' + err.message); render();
  }
});

// ============ Start ============
render();
if (cfg.token) {
  loadData().then(function () { tab = 'dashboard'; render(); }).catch(function (e) { toast('Could not load: ' + e.message); });
}
</script>
