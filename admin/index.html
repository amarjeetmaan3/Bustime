<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bustime Admin</title>
<style>
  :root {
    --brand:#1565C0; --brand-d:#0D47A1; --brand-l:#E3F2FD;
    --bg:#F4F6F9; --card:#FFFFFF; --line:#E3E7EC; --text:#1F2933; --muted:#667085;
    --red:#C62828; --red-l:#FDECEA; --green:#2E7D32; --green-l:#E8F5E9; --amber:#B26A00; --amber-l:#FFF4E0;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari","Noto Sans Gurmukhi",sans-serif; font-size:15px; }
  button { font:inherit; cursor:pointer; }
  input, select { font:inherit; width:100%; padding:10px 12px; border:1px solid #C9D1DA; border-radius:8px; background:#fff; color:var(--text); }
  input:focus, select:focus { outline:2px solid var(--brand-l); border-color:var(--brand); }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:14px 0 5px; text-transform:uppercase; letter-spacing:.03em; }

  .app { display:flex; min-height:100vh; }
  aside { width:220px; background:#fff; border-right:1px solid var(--line); padding:16px 10px; position:sticky; top:0; height:100vh; flex:0 0 auto; }
  .brand { font-weight:700; font-size:18px; color:var(--brand-d); padding:6px 10px 18px; }
  .brand small { display:block; font-weight:500; font-size:12px; color:var(--muted); }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nav button { display:flex; justify-content:space-between; align-items:center; border:0; background:none; text-align:left; padding:11px 12px; border-radius:8px; color:#344054; font-size:15px; }
  .nav button:hover { background:#F2F4F7; }
  .nav button.on { background:var(--brand-l); color:var(--brand-d); font-weight:600; }
  .nav .count { font-size:12px; background:#EAECF0; border-radius:10px; padding:1px 8px; color:#475467; }
  .nav button.on .count { background:#fff; }
  .content { flex:1; min-width:0; display:flex; flex-direction:column; }
  header.top { display:flex; align-items:center; gap:12px; padding:12px 24px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header.top h1 { font-size:20px; margin:0; flex:1; }
  .pill { font-size:12px; border-radius:12px; padding:3px 10px; background:#EAECF0; color:#475467; white-space:nowrap; }
  .pill.dirty { background:var(--amber-l); color:var(--amber); font-weight:600; }
  main { padding:24px; max-width:1100px; width:100%; }

  .btn { border:1px solid #C9D1DA; background:#fff; border-radius:8px; padding:9px 14px; font-weight:500; color:#344054; }
  .btn:hover { background:#F9FAFB; }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn.primary:hover { background:var(--brand-d); }
  .btn.danger { color:var(--red); border-color:#F1B8B3; }
  .btn.sm { padding:5px 10px; font-size:13px; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  .card h2 { font-size:16px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:13px; line-height:1.5; }
  .toolbar { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .toolbar .grow { flex:1; min-width:180px; }
  .toolbar select { width:auto; min-width:140px; }
  .tablewrap { background:#fff; border:1px solid var(--line); border-radius:12px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:640px; }
  th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); background:#F9FAFB; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:11px 14px; border-bottom:1px solid #F0F2F5; vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  td.actions { white-space:nowrap; text-align:right; }
  td.actions .btn { margin-left:6px; }
  .empty { padding:36px; text-align:center; color:var(--muted); }
  .badge { display:inline-block; font-size:12px; border-radius:10px; padding:2px 9px; background:var(--brand-l); color:var(--brand-d); font-weight:600; }
  .badge.green { background:var(--green-l); color:var(--green); }
  .badge.gray { background:#EAECF0; color:#475467; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
  .stat b { display:block; font-size:28px; color:var(--brand-d); }
  .stat span { font-size:13px; color:var(--muted); }
  .alert { border-radius:10px; padding:12px 14px; margin-top:10px; font-size:14px; }
  .alert.err { background:var(--red-l); color:var(--red); }
  .alert.warn { background:var(--amber-l); color:var(--amber); }
  .alert.ok { background:var(--green-l); color:var(--green); }
  .alert ul { margin:6px 0 0; padding-left:20px; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; margin:16px 0; }
  .chip { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 8px 10px 16px; }
  .chip b { font-size:18px; color:var(--brand-d); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stoprow { display:flex; gap:6px; margin-bottom:6px; align-items:center; }
  .stoprow select { flex:3; } .stoprow input { flex:1.2; }

  .overlay { position:fixed; inset:0; background:rgba(16,24,40,.5); display:none; align-items:flex-start; justify-content:center; padding:24px 12px; overflow-y:auto; z-index:30; }
  .overlay.show { display:flex; }
  .dialog { background:#fff; border-radius:14px; width:100%; max-width:560px; box-shadow:0 20px 40px rgba(0,0,0,.25); }
  .dlg-head { display:flex; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); }
  .dlg-head h2 { margin:0; font-size:17px; flex:1; }
  .dlg-head button { border:0; background:none; font-size:24px; line-height:1; color:var(--muted); }
  .dlg-body { padding:4px 20px 20px; }
  .dlg-foot { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1F2933; color:#fff; padding:11px 20px; border-radius:24px; display:none; z-index:50; max-width:92%; font-size:14px; }

  @media (max-width:860px) {
    .app { flex-direction:column; }
    aside { width:100%; height:auto; position:static; padding:8px; border-right:0; border-bottom:1px solid var(--line); }
    .brand { display:none; }
    .nav { flex-direction:row; overflow-x:auto; }
    .nav button { white-space:nowrap; }
    header.top, main { padding:12px; }
    .row2 { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Bustime<small>Admin console</small></div>
    <div class="nav" id="nav"></div>
  </aside>
  <div class="content">
    <header class="top">
      <h1 id="pageTitle">Dashboard</h1>
      <span class="pill" id="verPill"></span>
      <span class="pill dirty" id="dirty" style="display:none">Unpublished changes</span>
      <button class="btn primary" data-act="open-publish" id="pubBtn">Publish</button>
    </header>
    <main id="view"></main>
  </div>
</div>

<div class="overlay" id="overlay"><div class="dialog">
  <div class="dlg-head"><h2 id="dlgTitle"></h2><button data-act="close" aria-label="Close">&times;</button></div>
  <div class="dlg-body" id="dlgBody"></div>
</div></div>
<div id="toast"></div>

<script>
// ============ Settings (stored only in this browser) ============
var CFG_KEY = 'bustime_admin_cfg';
var DEFAULT_CFG = { owner:'amarjeetmaan3', repo:'Bustime', branch:'main', path:'app/src/main/assets/routes.json', token:'', sbUrl:'', sbKey:'', sbEmail:'' };
var cfg = loadCfg();
function loadCfg() {
  try { return Object.assign({}, DEFAULT_CFG, JSON.parse(localStorage.getItem(CFG_KEY) || '{}')); }
  catch (e) { return Object.assign({}, DEFAULT_CFG); }
}
function saveCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} }

// ============ State ============
var data = null, sha = null, baseVersion = 0, dirty = false;
var tab = 'settings';
var sbToken = null, subs = null, subsError = '';   // Supabase login lives only in memory
var reviewStatus = 'pending';
var community = { corrections:null, vehicles:null, feedback:null, operators:null };
var communityStatus = 'pending';
var editing = null;
var publishOpen = false;
var filters = { places:'', placeKind:'', routes:'', drivers:'', driverType:'' };

var NAV = [['dashboard','Dashboard'], ['places','Places'], ['routes','Bus Routes'],
           ['seats','Taxi Seats'], ['drivers','Drivers'], ['review','Review'], ['community','Community'], ['settings','Settings']];
var TITLES = { dashboard:'Dashboard', places:'Places', routes:'Bus Routes', seats:'Taxi Seats', drivers:'Drivers', review:'Review submissions', community:'Community requests & bus operators', settings:'Settings' };

// ============ Helpers ============
function $(s) { return document.querySelector(s); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 3500);
}
function b64encode(str) {
  var bytes = new TextEncoder().encode(str), bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(b64) {
  var bin = atob(b64.replace(/\s/g, '')), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function pname(p) { var n = (p && p.name) || {}; return n.en || n.hi || n.pa || (p && p.id) || ''; }
function placeById(id) { return data.places.find(function (p) { return p.id === id; }); }
function placeText(p) {
  var n = Object.keys(p.name || {}).map(function (k) { return p.name[k]; });
  return n.concat(p.aliases || [], [p.id]).join(' ').toLowerCase();
}
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); }
function makeId(prefix, base, exists) {
  var b = prefix + (slug(base) || 'x'), id = b, n = 2;
  while (exists(id)) { id = b + '_' + n++; }
  return id;
}
function nextNum(prefix, list) {
  var max = 0;
  list.forEach(function (x) {
    var m = String(x.id || '').match(new RegExp('^' + prefix + '(\\d+)$'));
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return prefix + (max + 1);
}
function setDirty(v) { dirty = v; refreshChrome(); }
window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
var TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
function fmtTime(t) {
  if (!t) return '-';
  var h = parseInt(t.slice(0, 2), 10), m = t.slice(3, 5);
  return ((h % 12) || 12) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM');
}

// ============ GitHub API ============
function apiUrl() { return 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + cfg.path; }
function ghHeaders() {
  var h = { 'Accept': 'application/vnd.github+json' };
  if (cfg.token) h['Authorization'] = 'Bearer ' + cfg.token;
  return h;
}
function normalize(d) {
  var o = { dataVersion: d.dataVersion || 0, places: d.places || [], routes: d.routes || [],
            taxiSeaters: d.taxiSeaters || [], drivers: d.drivers || [] };
  if (d._note) o._note = d._note;
  return o;
}
async function loadData() {
  var r = await fetch(apiUrl() + '?ref=' + encodeURIComponent(cfg.branch) + '&t=' + Date.now(),
                      { headers: ghHeaders(), cache: 'no-store' });
  if (!r.ok) throw new Error('GitHub ' + r.status + ' - ' + (await r.text()).slice(0, 160));
  var j = await r.json();
  if (!j.content) throw new Error('Could not read the data file');
  data = normalize(JSON.parse(b64decode(j.content)));
  sha = j.sha; baseVersion = data.dataVersion || 0; editing = null; publishOpen = false; setDirty(false);
}
async function publish() {
  if (!cfg.token) { toast('Add your GitHub token in Settings first'); return; }
  var v = validate();
  if (v.errors.length) { toast('Fix the errors first'); return; }
  var out = {};
  if (data._note) out._note = data._note;
  out.dataVersion = baseVersion + 1;
  out.places = data.places; out.routes = data.routes;
  out.taxiSeaters = data.taxiSeaters; out.drivers = data.drivers;
  var body = {
    message: 'Data update v' + out.dataVersion + ' [skip ci]',
    content: b64encode(JSON.stringify(out, null, 2) + '\n'),
    sha: sha, branch: cfg.branch
  };
  var h = ghHeaders(); h['Content-Type'] = 'application/json';
  var r = await fetch(apiUrl(), { method: 'PUT', headers: h, body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) {
    throw new Error('The file was changed elsewhere in the meantime. Reload from GitHub (your unpublished changes will be lost).');
  }
  if (!r.ok) throw new Error('GitHub ' + r.status + ' - ' + (await r.text()).slice(0, 160));
  var j = await r.json();
  sha = j.content.sha; baseVersion = out.dataVersion; data.dataVersion = out.dataVersion; setDirty(false);
}

// ============ Validation (same rules the app applies on import) ============
function validate() {
  var errors = [], warnings = [], pids = {};
  data.places.forEach(function (p) {
    if (!p.id) errors.push('A place has no id');
    else if (pids[p.id]) errors.push('Duplicate place id: ' + p.id);
    pids[p.id] = true;
    var hasName = Object.keys(p.name || {}).some(function (k) { return String(p.name[k] || '').trim(); });
    if (!hasName) errors.push('Place "' + p.id + '" has no name');
  });
  var noHi = data.places.filter(function (p) { return !(p.name && p.name.hi); }).length;
  var noPa = data.places.filter(function (p) { return !(p.name && p.name.pa); }).length;
  if (noHi) warnings.push(noHi + ' place(s) have no Hindi name');
  if (noPa) warnings.push(noPa + ' place(s) have no Punjabi name');

  var rids = {};
  data.routes.forEach(function (r) {
    var tag = 'Route ' + r.id;
    if (!r.id) errors.push('A route has no id');
    else if (rids[r.id]) errors.push('Duplicate route id: ' + r.id);
    rids[r.id] = true;
    if (!pids[r.from]) errors.push(tag + ': "From" place does not exist');
    if (!pids[r.to]) errors.push(tag + ': "To" place does not exist');
    if (r.from && r.from === r.to) errors.push(tag + ': From and To are the same');
    if (!TIME_RE.test(r.time || '')) errors.push(tag + ': invalid departure time');
    (r.stops || []).forEach(function (s) { if (!pids[s.place]) errors.push(tag + ': a stop refers to a missing place'); });
  });

  var dids = {};
  data.drivers.forEach(function (d) {
    var tag = 'Driver ' + (d.name || d.id);
    if (!d.id) errors.push('A driver has no id');
    else if (dids[d.id]) errors.push('Duplicate driver id: ' + d.id);
    dids[d.id] = true;
    if (d.type !== 'taxi' && d.type !== 'auto') errors.push(tag + ': invalid type');
    if (!String(d.name || '').trim()) errors.push(tag + ': name is required');
    var digits = String(d.phone || '').replace(/\D/g, '').length;
    if (digits < 10 || digits > 13) errors.push(tag + ': invalid mobile number');
    if (d.type === 'taxi' && !(d.seats > 0)) errors.push(tag + ': taxi needs a seat count');
  });
  var hidden = data.drivers.filter(function (d) {
    return d.type === 'taxi' && data.taxiSeaters.length && data.taxiSeaters.indexOf(d.seats) < 0;
  }).length;
  if (hidden) warnings.push(hidden + ' taxi driver(s) will not appear in the app (their seat count is not in the Taxi Seats list)');
  return { errors: errors, warnings: warnings };
}
function reportHtml(v) {
  return (v.errors.length ? '<div class="alert err"><b>Errors (publishing is blocked)</b><ul>' +
      v.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>'
    : '<div class="alert ok">No errors. The data is valid.</div>') +
    (v.warnings.length ? '<div class="alert warn"><b>Warnings</b><ul>' +
      v.warnings.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>' : '');
}

// ============ Views ============
function refreshChrome() {
  $('#dirty').style.display = dirty ? 'inline-block' : 'none';
  $('#verPill').textContent = data ? 'Data v' + baseVersion : 'Not loaded';
  $('#pubBtn').disabled = !data || !dirty;
  $('#pageTitle').textContent = TITLES[tab] || '';
}
function render() {
  var counts = data ? { places:data.places.length, routes:data.routes.length, seats:data.taxiSeaters.length, drivers:data.drivers.length } : {};
  if (subs) counts.review = subs.length;
  $('#nav').innerHTML = NAV.map(function (n) {
    return '<button data-act="tab" data-t="' + n[0] + '" class="' + (tab === n[0] ? 'on' : '') + '">' + n[1] +
      (counts[n[0]] != null ? '<span class="count">' + counts[n[0]] + '</span>' : '') + '</button>';
  }).join('');
  refreshChrome();
  var v = $('#view');
  if (tab !== 'settings' && !data) {
    v.innerHTML = '<div class="card"><h2>No data loaded</h2><p class="muted">Open Settings and load the data from GitHub first.</p>' +
      '<button class="btn primary" data-act="tab" data-t="settings">Go to Settings</button></div>';
  } else {
    v.innerHTML = { dashboard: viewDashboard, places: viewPlaces, routes: viewRoutes,
                    seats: viewSeats, drivers: viewDrivers, review: viewReview, community: viewCommunity, settings: viewSettings }[tab]();
  }
  renderModal();
}

function viewDashboard() {
  var stands = data.places.filter(function (p) { return p.kind === 'stand'; }).length;
  var taxis = data.drivers.filter(function (d) { return d.type === 'taxi'; }).length;
  var autos = data.drivers.length - taxis;
  var v = validate();
  return '<div class="stats">' +
    stat(data.places.length, 'Places (' + stands + ' bus stands)') + stat(data.routes.length, 'Bus routes') +
    stat(data.taxiSeaters.length, 'Taxi seat options') + stat(taxis, 'Taxis') + stat(autos, 'Autos') + '</div>' +
    '<div class="card"><h2>Data health</h2><p class="muted">Published data version: ' + baseVersion + '. ' +
    (dirty ? 'You have unpublished changes.' : 'Everything is published.') + '</p>' + reportHtml(v) + '</div>' +
    '<div class="card"><h2>How it works</h2><p class="muted">Edit places, routes, taxi seats and drivers here, then press <b>Publish</b>. ' +
    'The app picks up the new data the next time it opens. No new APK is needed for data changes.</p></div>';
}
function stat(n, label) { return '<div class="stat"><b>' + n + '</b><span>' + esc(label) + '</span></div>'; }

function viewPlaces() {
  var q = filters.places.toLowerCase(), k = filters.placeKind;
  var rows = data.places.map(function (p, i) { return { p: p, i: i }; }).filter(function (x) {
    return (!k || x.p.kind === k) && (!q || placeText(x.p).indexOf(q) >= 0);
  }).sort(function (a, b) { return pname(a.p).localeCompare(pname(b.p)); });
  return '<div class="toolbar"><input class="grow" id="f_places" data-filter="places" placeholder="Search places" value="' + esc(filters.places) + '">' +
    '<select id="f_pkind"><option value="">All types</option><option value="stand"' + (k === 'stand' ? ' selected' : '') + '>Bus stand</option>' +
    '<option value="village"' + (k === 'village' ? ' selected' : '') + '>Village</option><option value="city"' + (k === 'city' ? ' selected' : '') + '>City</option><option value="place"' + (k === 'place' ? ' selected' : '') + '>Other place</option></select>' +
    '<button class="btn primary" data-act="new-place">+ Add place</button></div>' +
    '<div class="tablewrap"><table><thead><tr><th>English</th><th>Hindi</th><th>Punjabi</th><th>Type</th><th>City</th><th></th></tr></thead><tbody>' +
    (rows.map(function (x) {
      var p = x.p, n = p.name || {};
      return '<tr><td><b>' + esc(n.en || '-') + '</b></td><td>' + esc(n.hi || '-') + '</td><td>' + esc(n.pa || '-') + '</td>' +
        '<td><span class="badge ' + (p.kind === 'stand' ? '' : 'gray') + '">' + (p.kind === 'stand' ? 'Bus stand' : p.kind === 'village' ? 'Village' : p.kind === 'city' ? 'City' : 'Place') + '</span></td>' +
        '<td>' + esc(p.city || '-') + '</td><td class="actions">' +
        '<button class="btn sm" data-act="edit-place" data-i="' + x.i + '">Edit</button>' +
        '<button class="btn sm danger" data-act="del-place" data-i="' + x.i + '">Delete</button></td></tr>';
    }).join('') || '<tr><td colspan="6" class="empty">No places found</td></tr>') + '</tbody></table></div>';
}
function placeFormHtml() {
  var p = editing.draft, n = p.name || {};
  return '<label>Type</label><select id="fp_kind"><option value="stand"' + (p.kind === 'stand' ? ' selected' : '') + '>Bus stand</option>' +
    '<option value="village"' + (p.kind === 'village' ? ' selected' : '') + '>Village</option>' +
    '<option value="city"' + (p.kind === 'city' ? ' selected' : '') + '>City</option>' +
    '<option value="place"' + (p.kind === 'place' || !p.kind ? ' selected' : '') + '>Other place</option></select>' +
    '<label>Name in English</label><input id="fp_en" value="' + esc(n.en) + '">' +
    '<label>Name in Hindi (auto-translated when English loses focus)</label><input id="fp_hi" value="' + esc(n.hi) + '">' +
    '<label>Name in Punjabi (auto-translated when English loses focus)</label><input id="fp_pa" value="' + esc(n.pa) + '">' +
    '<label>Alternate spellings (comma separated)</label><input id="fp_alias" value="' + esc((p.aliases || []).join(', ')) + '">' +
    '<div class="row2"><div><label>City</label><input id="fp_city" value="' + esc(p.city) + '"></div>' +

// ============ Supabase (user submissions) ============
async function sbFetch(path, opts) {
  opts = opts || {};
  var base = cfg.sbUrl.replace(/\/+$/, '');
  var headers = Object.assign({ apikey: cfg.sbKey, 'Content-Type': 'application/json' }, opts.headers || {});
  if (sbToken) headers.Authorization = 'Bearer ' + sbToken;
  var res = await fetch(base + path, Object.assign({}, opts, { headers: headers }));
  if (!res.ok) {
    var t = ''; try { t = (await res.json()).error_description || ''; } catch (e) {}
    throw new Error('Supabase ' + res.status + (t ? ': ' + t : ''));
  }
  return res.status === 204 ? null : res.json();
}
async function sbLogin(email, password) {
  var base = cfg.sbUrl.replace(/\/+$/, '');
  var res = await fetch(base + '/auth/v1/token?grant_type=password', {
    method: 'POST', headers: { apikey: cfg.sbKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: password })
  });
  var j = await res.json();
  if (!res.ok) throw new Error(j.error_description || j.msg || 'Login failed');
  sbToken = j.access_token;
}
async function loadSubs() {
  subs = await sbFetch('/rest/v1/route_submissions?select=*&order=created_at.desc&limit=300');
}

function communityTable(kind) { return kind==='corrections'?'correction_submissions':kind==='vehicles'?'vehicle_submissions':'feedback_submissions'; }
function applyApprovedCorrection(x) {
  var r = data.routes.find(function(z){ return z.id === x.route_id; });
  if (!r) throw new Error('Route '+x.route_id+' was not found in routes.json; request not approved.');
  if (x.request_type === 'correct_time') {
    if (x.stop_id === r.from) r.time = x.corrected_time;
    else if (x.stop_id === r.to) r.arrive = x.corrected_time;
    else {
      var st = (r.stops || []).find(function(z){return z.place===x.stop_id;});
      if (!st) throw new Error('Selected stop was not found in this route; request not approved.');
      st.time = x.corrected_time;
    }
  } else if (x.request_type === 'missing_stop') {
    var before = x.before_stop_id, after = x.after_stop_id;
    var placeId = x.missing_place_id || '';
    if (!placeId) {
      placeId = makeId('place_', x.missing_place_name || 'missing_stop', function(id){return data.places.some(function(p){return p.id===id;});});
      data.places.push({id:placeId,kind:'place',name:{en:x.missing_place_name},aliases:[]});
    } else if (!placeById(placeId)) { throw new Error('The selected existing place no longer exists; request not approved.'); }
    var stops = r.stops || (r.stops=[]);
    var beforeIndex = before===r.from ? -1 : stops.findIndex(function(z){return z.place===before;});
    var afterIndex = after===r.to ? stops.length : stops.findIndex(function(z){return z.place===after;});
    if (beforeIndex < -1 || afterIndex < 0 || afterIndex !== beforeIndex+1) {
      if (!x.missing_place_id) data.places.pop(); throw new Error('The two chosen stops are no longer adjacent; request not approved.');
    }
    var newStop = {place:placeId}; if (x.missing_time) newStop.time=x.missing_time;
    stops.splice(afterIndex,0,newStop);
  }
  setDirty(true);
}

    var v = validate();
    $('#dlgTitle').textContent = 'Publish changes';
    $('#dlgBody').innerHTML = '<p class="muted" style="margin-top:14px">Data version will change from ' + baseVersion + ' to ' + (baseVersion + 1) +
      '. The app picks up the new data the next time it opens. No new APK is built.</p>' + reportHtml(v) +
      '<div class="dlg-foot"><button class="btn" data-act="close">Cancel</button>' +
      '<button class="btn primary" data-act="publish"' + (v.errors.length ? ' disabled' : '') + '>Publish to GitHub</button></div>';
    ov.classList.add('show');
  } else if (editing) {
    var titles = { place: 'place', route: 'route', driver: 'driver' };
    $('#dlgTitle').textContent = (editing.index < 0 ? 'Add ' : 'Edit ') + titles[editing.type];
    $('#dlgBody').innerHTML = { place: placeFormHtml, route: routeFormHtml, driver: driverFormHtml }[editing.type]();
    ov.classList.add('show');
  } else {
    ov.classList.remove('show');
  }
}

// ============ Events ============
function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; }

document.addEventListener('input', function (e) {
  var key = e.target.getAttribute && e.target.getAttribute('data-filter');
  if (!key) return;
  filters[key] = e.target.value;
  var id = e.target.id; render();
  var el = document.getElementById(id);
  if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (x) {} }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'fd_type') {
    var taxi = e.target.value === 'taxi';
    $('#seatRow').style.display = taxi ? 'block' : 'none';
    $('#fuelRow').style.display = taxi ? 'none' : 'block';
  }
  if (e.target.id === 'f_dtype') { filters.driverType = e.target.value; render(); }
  if (e.target.id === 'f_pkind') { filters.placeKind = e.target.value; render(); }
});
async function autoTranslatePlaceName() {
  var source = document.getElementById('fp_en');
  if (!source || !source.value.trim()) return;
  var english = source.value.trim();
  async function translate(target) {
    var response = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(english) + '&langpair=en%7C' + target);
    if (!response.ok) throw new Error('Translation service unavailable');
    var json = await response.json(), translated = json && json.responseData && json.responseData.translatedText;
    if (!translated || json.responseStatus !== 200) throw new Error('Translation unavailable');
    return translated;
  }
  var hi = document.getElementById('fp_hi'), pa = document.getElementById('fp_pa');
  try {
    var values = await Promise.all([translate('hi'), translate('pa')]);
    if (source.value.trim() !== english) return;
    if (hi && (!hi.value.trim() || hi.dataset.autofilled === 'true')) { hi.value = values[0]; hi.dataset.autofilled = 'true'; }
    if (pa && (!pa.value.trim() || pa.dataset.autofilled === 'true')) { pa.value = values[1]; pa.dataset.autofilled = 'true'; }
  } catch (err) { toast('Auto translation failed; enter Hindi/Punjabi manually.'); }
}
document.addEventListener('focusout', function (e) { if (e.target && e.target.id === 'fp_en') autoTranslatePlaceName(); });
document.addEventListener('input', function (e) { if (e.target && (e.target.id === 'fp_hi' || e.target.id === 'fp_pa')) e.target.dataset.autofilled = 'false'; });

document.addEventListener('click', async function (e) {
  if (e.target.id === 'overlay') { editing = null; publishOpen = false; render(); return; }
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var act = b.getAttribute('data-act'), i = parseInt(b.getAttribute('data-i'), 10);
  try {
    if (act === 'tab') {
      tab = b.getAttribute('data-t'); editing = null; publishOpen = false; render();
      if (tab === 'review' && sbToken && !subs) { try { await loadSubs(); } catch (e) { subsError = e.message; } render(); }
      if (tab === 'community' && sbToken && !community.corrections) { try { await loadCommunity(); } catch (e) { toast(e.message); } render(); }
    }
    else if (act === 'close') { editing = null; publishOpen = false; render(); }
    else if (act === 'open-publish') { publishOpen = true; render(); }
    else if (act === 'save-cfg') {
      cfg.owner = val('c_owner'); cfg.repo = val('c_repo'); cfg.branch = val('c_branch');
      cfg.path = val('c_path'); cfg.token = document.getElementById('c_token').value.trim(); saveCfg();
      b.disabled = true; b.textContent = 'Loading...';
      await loadData(); toast('Data loaded'); tab = 'dashboard'; render();
    }
    else if (act === 'add-stop') { $('#stops').insertAdjacentHTML('beforeend', stopRow('', '')); }
    else if (act === 'rm-stop') { b.closest('.stoprow').remove(); }
    else if (act === 'stop-up') {
      var row = b.closest('.stoprow'), prev = row.previousElementSibling;
      if (prev) row.parentNode.insertBefore(row, prev);
    }
    else if (act === 'stop-down') {
      var row2 = b.closest('.stoprow'), next = row2.nextElementSibling;
      if (next) row2.parentNode.insertBefore(next, row2);
    }

    // ---- places ----
    else if (act === 'new-place') { editing = { type: 'place', index: -1, draft: { kind: 'place', name: {}, aliases: [] } }; render(); }
    else if (act === 'edit-place') { editing = { type: 'place', index: i, draft: JSON.parse(JSON.stringify(data.places[i])) }; render(); }
    else if (act === 'del-place') {
      var pid = data.places[i].id;
      var used = data.routes.filter(function (r) {
        return r.from === pid || r.to === pid || (r.stops || []).some(function (s) { return s.place === pid; });
      });
      if (used.length) { toast('This place is used in ' + used.length + ' route(s). Change those routes first.'); return; }
      if (confirm('Delete "' + pname(data.places[i]) + '"?')) { data.places.splice(i, 1); setDirty(true); render(); }
    }
    else if (act === 'save-place') {
      var name = {};
      [['en','fp_en'], ['hi','fp_hi'], ['pa','fp_pa']].forEach(function (x) { if (val(x[1])) name[x[0]] = val(x[1]); });
      if (!Object.keys(name).length) { toast('Enter at least one name'); return; }
      var p = editing.index < 0 ? {} : data.places[editing.index];
      var kind = val('fp_kind');
      if (editing.index < 0) {
        p.id = makeId(kind === 'stand' ? 'stand_' : 'place_', name.en || pname({ name: name }), function (id) { return !!placeById(id); });
      }
      p.kind = kind; p.name = name;
      var al = val('fp_alias').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      if (al.length) p.aliases = al; else delete p.aliases;
      if (val('fp_city')) p.city = val('fp_city'); else delete p.city;
      if (val('fp_dist')) p.district = val('fp_dist'); else delete p.district;
      if (editing.index < 0) data.places.push(p);
      editing = null; setDirty(true); toast('Place saved'); render();
    }

    // ---- routes ----
    else if (act === 'new-route') { editing = { type: 'route', index: -1, draft: { stops: [] } }; render(); }
    else if (act === 'edit-route') { editing = { type: 'route', index: i, draft: JSON.parse(JSON.stringify(data.routes[i])) }; render(); }
    else if (act === 'reverse-route') {
      var src = data.routes[i];
      editing = { type: 'route', index: -1, draft: {
        from: src.to, to: src.from, time: '', service: src.service, contact: src.contact, info: src.info, longRoute: !!src.longRoute, startDate: src.startDate,
        stops: (src.stops || []).slice().reverse().map(function (s) { return { place: s.place }; })
      } };
      render(); toast('Return route prepared. Fill in the times and save.');
    }
    else if (act === 'del-route') {
      if (confirm('Delete this route?')) { data.routes.splice(i, 1); setDirty(true); render(); }
    }
    else if (act === 'save-route') {
      var from = val('fr_from'), to = val('fr_to'), time = val('fr_time'), arrive = val('fr_arrive');
      if (!from || !to) { toast('Select both From and To'); return; }
      if (from === to) { toast('From and To must be different'); return; }
      if (!TIME_RE.test(time)) { toast('Enter the departure time'); return; }
      var isLong = $('#fr_long') ? $('#fr_long').checked : false, startDate = val('fr_start_date');
      if (isLong && !/^\d{4}-\d{2}-\d{2}$/.test(startDate)) { toast('Choose the long-route start date'); return; }
      var stops = [], previousTime = time, dayOffset = 0;
      var invalidTimeOrder = false;
      document.querySelectorAll('#stops .stoprow').forEach(function (row) {
        var sp = row.querySelector('.st_place').value, st = row.querySelector('.st_time').value;
        if (sp) {
          var stop = { place:sp };
          if (TIME_RE.test(st)) {
            if (st < previousTime) { if (!isLong) invalidTimeOrder = true; else dayOffset++; }
            previousTime = st; stop.time = st; if (isLong) stop.day_offset = dayOffset;
          }
          stops.push(stop);
        }
      });
      if (TIME_RE.test(arrive) && arrive < previousTime && !isLong) invalidTimeOrder = true;
      if (invalidTimeOrder) { toast('A stop/arrival time cannot be earlier than the previous time. Enable Long Route to cross midnight.'); return; }
      var r = editing.index < 0 ? { id: nextNum('r', data.routes) } : data.routes[editing.index];
      r.from = from; r.to = to; r.time = time; r.longRoute = isLong; if (isLong) r.startDate = startDate; else delete r.startDate;
      ['arrive', 'service', 'contact', 'info'].forEach(function (k) {
        var v = k === 'arrive' ? (TIME_RE.test(arrive) ? arrive : '') : val('fr_' + k);
        if (v) r[k] = v; else delete r[k];
      });
      if (stops.length) r.stops = stops; else delete r.stops;
      if (editing.index < 0) data.routes.push(r);
      editing = null; setDirty(true); toast('Route saved'); render();
    }

    // ---- taxi seats ----
    else if (act === 'add-seater') {
      var n = parseInt(val('newSeater'), 10);
      if (!(n > 0)) { toast('Enter a valid number'); return; }
      if (data.taxiSeaters.indexOf(n) >= 0) { toast('That seat option already exists'); return; }
      data.taxiSeaters.push(n); data.taxiSeaters.sort(function (a, c) { return a - c; });
      setDirty(true); render();
    }
    else if (act === 'rm-seater') {
      var rn = parseInt(b.getAttribute('data-n'), 10);
      var cnt = data.drivers.filter(function (d) { return d.type === 'taxi' && d.seats === rn; }).length;
      if (confirm('Remove the ' + rn + ' seater option?' + (cnt ? '\n' + cnt + ' driver(s) will no longer appear in the app.' : ''))) {
        data.taxiSeaters = data.taxiSeaters.filter(function (x) { return x !== rn; });
        setDirty(true); render();
      }
    }

    // ---- drivers ----
    else if (act === 'new-driver') { editing = { type: 'driver', index: -1, draft: { type: 'taxi' } }; render(); }
    else if (act === 'edit-driver') { editing = { type: 'driver', index: i, draft: JSON.parse(JSON.stringify(data.drivers[i])) }; render(); }
    else if (act === 'del-driver') {
      if (confirm('Delete "' + data.drivers[i].name + '"?')) { data.drivers.splice(i, 1); setDirty(true); render(); }
    }
    else if (act === 'save-driver') {
      var type = val('fd_type'), dn = val('fd_name'), ph = val('fd_phone');
      var digits = ph.replace(/\D/g, '').length;
      if (!dn) { toast('Driver name is required'); return; }
      if (digits < 10 || digits > 13) { toast('Enter a valid mobile number'); return; }
      var seats = parseInt(val('fd_seats'), 10);
      if (type === 'taxi' && !(seats > 0)) { toast('Seat count is required for a taxi'); return; }
      var d = editing.index < 0 ? { id: nextNum(type === 'taxi' ? 't' : 'a', data.drivers) } : data.drivers[editing.index];
      d.type = type; d.name = dn; d.phone = ph;
      if (val('fd_vehicle')) d.vehicle = val('fd_vehicle'); else delete d.vehicle;
      if (type === 'taxi') { d.seats = seats; delete d.fuel; }
      else { delete d.seats; if (val('fd_fuel')) d.fuel = val('fd_fuel'); else delete d.fuel; }
      if (val('fd_info')) d.info = val('fd_info'); else delete d.info;
      if (editing.index < 0) data.drivers.push(d);
      editing = null; setDirty(true); toast('Driver saved'); render();
    }


    // ---- user submissions (Supabase) ----
    else if (act === 'sb-login') {
      cfg.sbUrl = val('sb_url'); cfg.sbKey = val('sb_key'); cfg.sbEmail = val('sb_email'); saveCfg();
      b.disabled = true; b.textContent = 'Signing in...';
      await sbLogin(cfg.sbEmail, document.getElementById('sb_pass').value);
      subs = null; render(); await loadSubs(); if (tab === 'community') await loadCommunity(); render();
    }
    else if (act === 'sb-logout') { sbToken = null; subs = null; render(); }
    else if (act === 'sb-refresh') { subs = null; render(); await loadSubs(); if (tab === 'community') await loadCommunity(); render(); }
    else if (act === 'review-status') { reviewStatus = b.getAttribute('data-status'); render(); }
    else if (act === 'sb-reject') {
      if (!confirm('Reject this submission?')) return;
      await sbFetch('/rest/v1/route_submissions?id=eq.' + subs[i].id, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ status: 'rejected' }) });
      subs[i].status = 'rejected'; toast('Moved to Rejected list'); render();
    }
    else if (act === 'sb-delete') {
      if (!subs[i] || subs[i].status !== 'rejected') { toast('Only rejected requests can be deleted'); return; }
      if (!confirm('Permanently delete this rejected request?')) return;
      await sbFetch('/rest/v1/route_submissions?id=eq.' + encodeURIComponent(subs[i].id) + '&status=eq.rejected', { method:'DELETE', headers:{ Prefer:'return=minimal' } });
      subs.splice(i, 1); toast('Rejected request deleted'); render();
    }
    else if (act === 'sb-approve') {
      var sub = subs[i], v = subCardValues(i);
      if (!TIME_RE.test(v.start)) { toast('Set a valid start time'); return; }
      if (!placeById(sub.from_id) || !placeById(sub.to_id)) { toast('This route uses a place that no longer exists'); return; }
      var previousReviewTime = v.start, invalidReviewTime = false;
      v.stops.forEach(function (st) {
        if (st.time && st.time < previousReviewTime && !sub.long_route) invalidReviewTime = true;
        if (st.time) previousReviewTime = st.time;
      });
      if (invalidReviewTime) { toast('A stop time is earlier than the previous time. Mark this as a Long Route in the route editor if it crosses midnight.'); return; }
      var arrive = null, mid = [];
      v.stops.forEach(function (st) {
        if (st.place === sub.to_id) arrive = st.time;
        else if (st.place !== sub.from_id && placeById(st.place)) { var o = { place: st.place }; if (st.time) o.time = st.time; if (st.day_offset != null) o.day_offset = st.day_offset; mid.push(o); }
      });
      var nr = { id: nextNum('r', data.routes), from: sub.from_id, to: sub.to_id, time: v.start };
      if (sub.long_route) { nr.longRoute = true; nr.startDate = sub.start_date; }
      if (arrive) nr.arrive = arrive;
      if (sub.service_name) nr.service = sub.service_name;
      if (mid.length) nr.stops = mid;
      data.routes.push(nr); setDirty(true);
      await sbFetch('/rest/v1/route_submissions?id=eq.' + sub.id, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ status: 'approved' }) });
      subs[i].status = 'approved'; toast('Approved and retained in Approved list. Press Publish to make it live.'); render();
    }

    // ---- community requests ----
    else if (act === 'community-refresh') { await loadCommunity(); render(); }
    else if (act === 'community-status') { communityStatus = b.getAttribute('data-status'); render(); }
    else if (act === 'community-reject' || act === 'community-approve') {
      var kind = b.getAttribute('data-kind'), cid = b.getAttribute('data-id'), table = communityTable(kind);
      var listKey = kind, record = (community[listKey] || []).find(function(x){return x.id===cid;});
      if (!record || record.status !== 'pending') { toast('This request is no longer pending. Refresh the list.'); return; }
      if (act === 'community-approve') {
        if (kind === 'corrections') applyApprovedCorrection(record);
        if (kind === 'vehicles') {
          var driver = { id:nextNum(record.vehicle_type==='taxi'?'t':'a', data.drivers), type:record.vehicle_type, name:record.person_name, vehicle:record.vehicle_name, phone:record.phone, info:record.location + (record.details ? ' · ' + record.details : '') };
          if (record.vehicle_type==='auto') driver.fuel='oil';
          if (record.seats) driver.seats = record.seats;
          data.drivers.push(driver); setDirty(true);
        }
      } else if (!confirm('Reject this request?')) return;
      await sbFetch('/rest/v1/'+table+'?id=eq.'+encodeURIComponent(cid), { method:'PATCH', headers:{Prefer:'return=minimal'}, body:JSON.stringify({status:act==='community-approve'?'approved':'rejected'}) });
      record.status = act==='community-approve'?'approved':'rejected'; toast(act==='community-approve'?'Approved. If route data changed, press Publish to make it live.':'Moved to Rejected.'); render();
    }
    else if (act === 'community-delete') {
      var dk=b.getAttribute('data-kind'), did=b.getAttribute('data-id'), dtable=communityTable(dk);
      var drec=(community[dk]||[]).find(function(x){return x.id===did;});
      if (!drec || drec.status!=='rejected') { toast('Only rejected requests can be deleted.'); return; }
      if (!confirm('Permanently delete this rejected request?')) return;
      await sbFetch('/rest/v1/'+dtable+'?id=eq.'+encodeURIComponent(did)+'&status=eq.rejected',{method:'DELETE',headers:{Prefer:'return=minimal'}});
      community[dk]=community[dk].filter(function(x){return x.id!==did;}); render();
    }
    else if (act === 'operator-add') {
      var on=val('op_name'), op=val('op_phone').replace(/[^+0-9 -]/g,'');
      if (!on || op.replace(/\D/g,'').length<9) { toast('Enter operator name and valid phone.'); return; }
      await sbFetch('/rest/v1/bus_operators',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({operator_name:on,service_name:val('op_service')||null,bus_type:val('op_type')||'Bus',phone:op,from_text:val('op_from')||null,to_text:val('op_to')||null,details:val('op_details')||null,active:true})});
      await loadCommunity(); toast('Operator added and published.'); render();
    }
    else if (act === 'operator-toggle') {
      var oid=b.getAttribute('data-id'), active=b.getAttribute('data-active')==='true';
      await sbFetch('/rest/v1/bus_operators?id=eq.'+encodeURIComponent(oid),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({active:active})});
      await loadCommunity(); render();
    }
    else if (act === 'operator-delete') {
      var odid=b.getAttribute('data-id'); if(!confirm('Delete this bus operator?')) return;
      await sbFetch('/rest/v1/bus_operators?id=eq.'+encodeURIComponent(odid),{method:'DELETE',headers:{Prefer:'return=minimal'}});
      await loadCommunity(); render();
    }

    // ---- publish ----
    else if (act === 'publish') {
      b.disabled = true; b.textContent = 'Publishing...';
      await publish(); publishOpen = false; toast('Published. Data version ' + baseVersion); render();
    }
  } catch (err) {
    toast('Error: ' + err.message); render();
  }
});

// ============ Start ============
render();
if (cfg.token) {
  loadData().then(function () { tab = 'dashboard'; render(); }).catch(function (e) { toast('Could not load: ' + e.message); });
}
</script>
