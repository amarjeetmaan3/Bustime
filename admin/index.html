<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bustime Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* ==========================================================================
     Bustime admin — clean console design.
     Visual layer only: every class, id and data attribute the script uses is kept.
     Palette: slate neutrals + one blue accent. Type: Inter (+ Devanagari / Gurmukhi fallbacks).
     ========================================================================== */
  :root {
    --ink:#0F172A; --text:#1E293B; --muted:#64748B; --faint:#94A3B8;
    --bg:#F5F7FA; --card:#FFFFFF; --line:#E2E8F0; --line-soft:#EEF2F6; --ctl:#CBD5E1; --hover:#F8FAFC; --soft:#F1F5F9;
    --brand:#1D4ED8; --brand-d:#1E40AF; --brand-l:#EEF4FF; --brand-line:#C7D7FE; --ring:rgba(29,78,216,.18);
    --green:#15803D; --green-l:#ECFDF3; --green-line:#ABEFC6;
    --red:#B42318; --red-l:#FEF3F2; --red-line:#FECDCA;
    --amber:#B54708; --amber-l:#FFFAEB; --amber-line:#FEDF89;
    --shadow-sm:0 1px 2px rgba(15,23,42,.05);
    --shadow-md:0 4px 16px rgba(15,23,42,.08);
    --head-h:64px;
    --f-ui:"Inter","Noto Sans Devanagari","Noto Sans Gurmukhi",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--f-ui); font-size:15px; font-weight:400; line-height:1.5; -webkit-font-smoothing:antialiased; }
  button { font:inherit; font-weight:500; cursor:pointer; }
  input, select, textarea { font:inherit; }
  input, select { width:100%; min-height:40px; padding:8px 12px; border:1px solid var(--ctl); border-radius:8px; background:#fff; color:var(--ink); box-shadow:var(--shadow-sm); transition:border-color .12s, box-shadow .12s; }
  input::placeholder, textarea::placeholder { color:var(--faint); }
  input:hover, select:hover { border-color:#94A3B8; }
  input:focus, select:focus { outline:0; border-color:var(--brand); box-shadow:0 0 0 4px var(--ring); }
  button:focus-visible, a:focus-visible { outline:3px solid var(--ring); outline-offset:2px; }
  label { display:block; font-size:13px; font-weight:500; color:var(--text); margin:16px 0 6px; }
  .card > label:first-child { margin-top:0; }

  /* ---------- Shell ---------- */
  .app { display:flex; min-height:100vh; }
  aside { width:256px; flex:0 0 auto; position:sticky; top:0; height:100vh; overflow-y:auto; padding:20px 14px 24px; background:#fff; border-right:1px solid var(--line); color:var(--text); }
  .brand { display:flex; align-items:center; gap:12px; padding:2px 10px 24px; }
  .brand-mark { position:relative; flex:0 0 36px; width:36px; height:36px; border-radius:10px; background:var(--brand); box-shadow:var(--shadow-sm); }
  .brand-mark::before { content:"B"; position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-size:18px; font-weight:700; letter-spacing:-.02em; }
  .brand-mark::after { content:none; }
  .brand-name { font-size:17px; font-weight:700; line-height:1.15; letter-spacing:-.01em; color:var(--ink); }
  .brand small { display:block; margin-top:2px; font-size:12px; font-weight:500; letter-spacing:0; color:var(--muted); }

  .nav { position:relative; display:flex; flex-direction:column; gap:2px; }
  .nav::before { content:none; }
  .nav button { position:relative; display:flex; justify-content:space-between; align-items:center; gap:10px; border:0; background:none; text-align:left; padding:9px 12px; border-radius:8px; color:#475569; font-size:14.5px; font-weight:500; transition:background .12s, color .12s; }
  .nav button::before { content:none; }
  .nav button:hover { background:var(--soft); color:var(--ink); }
  .nav button.on { background:var(--brand-l); color:var(--brand); font-weight:600; }
  .nav .count { font-size:12px; font-weight:600; min-width:24px; text-align:center; background:var(--soft); border-radius:999px; padding:1px 8px; color:var(--muted); }
  .nav button.on .count { background:var(--brand); color:#fff; }

  .content { flex:1; min-width:0; display:flex; flex-direction:column; }
  header.top { display:flex; align-items:center; gap:10px; min-height:var(--head-h); padding:10px 32px; background:rgba(255,255,255,.92); backdrop-filter:saturate(1.4) blur(8px); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header.top h1 { flex:1; margin:0; min-width:0; font-size:20px; font-weight:600; line-height:1.2; letter-spacing:-.01em; color:var(--ink); }
  .pill { font-size:12.5px; font-weight:500; border-radius:999px; padding:3px 11px; background:var(--soft); border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .pill.dirty { background:var(--amber-l); border-color:var(--amber-line); color:var(--amber); }
  main { padding:28px 32px 64px; max-width:1440px; width:100%; }
  body.admin-locked aside, body.admin-locked header.top, body.admin-locked .workspace-nav { display:none !important; }
  body.admin-locked .content { min-height:100vh; }
  body.admin-locked main { max-width:520px; margin:12vh auto 0; }
  body.admin-locked main::before { content:"Bustime Admin"; display:block; margin-bottom:18px; font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--brand); }

  /* Section tabs (second level) */
  .workspace-nav { position:sticky; top:var(--head-h); z-index:4; display:flex; flex-direction:row; align-items:flex-end; gap:6px; overflow-x:auto; white-space:nowrap; padding:0 32px; background:#fff; border-bottom:1px solid var(--line); scrollbar-width:thin; }
  .workspace-tabs { display:contents; }
  .workspace-tab { flex:0 0 auto; border:0; border-bottom:2px solid transparent; border-radius:0; background:transparent; color:var(--muted); padding:12px 12px 11px; margin-bottom:-1px; font-size:14.5px; font-weight:500; cursor:pointer; transition:color .12s, border-color .12s; }
  .workspace-tab:hover { color:var(--ink); }
  .workspace-tab.active { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }

  /* ---------- Buttons ---------- */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--ctl); background:#fff; border-radius:8px; padding:7px 14px; min-height:36px; font-size:14px; font-weight:500; color:var(--ink); box-shadow:var(--shadow-sm); transition:background .12s, border-color .12s, color .12s; }
  .btn:hover { background:var(--hover); border-color:#94A3B8; }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn.primary:hover { background:var(--brand-d); border-color:var(--brand-d); }
  .btn.danger { color:var(--red); border-color:var(--red-line); background:#fff; }
  .btn.danger:hover { background:var(--red-l); border-color:#FDA29B; }
  .btn.sm { padding:3px 10px; min-height:30px; font-size:13px; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  #pubBtn { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; padding:7px 20px; }
  #pubBtn:hover:not(:disabled) { background:var(--brand-d); border-color:var(--brand-d); }
  #pubBtn:disabled { background:var(--soft); border-color:var(--line); color:var(--faint); opacity:1; box-shadow:none; }

  /* ---------- Surfaces ---------- */
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; margin-bottom:20px; box-shadow:var(--shadow-sm); }
  .card h2 { font-size:17px; font-weight:600; line-height:1.3; margin:0 0 6px; color:var(--ink); letter-spacing:-.005em; }
  .muted { color:var(--muted); font-size:14px; line-height:1.55; font-weight:400; }
  .toolbar { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
  .toolbar .grow { flex:1; min-width:180px; }
  .toolbar select { width:auto; min-width:140px; }
  .toolbar label { margin:0; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 20px; }
  .chip { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:6px 8px 6px 16px; }
  .chip b { font-size:15px; font-weight:600; color:var(--ink); }

  .tablewrap { background:#fff; border:1px solid var(--line); border-radius:12px; overflow-x:auto; box-shadow:var(--shadow-sm); }
  table { border-collapse:collapse; width:100%; min-width:760px; }
  th { text-align:left; font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); background:#F8FAFC; padding:12px 18px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:16px 18px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  tbody tr:hover { background:var(--hover); }
  td.actions { white-space:nowrap; text-align:right; }
  td.actions .btn { margin-left:6px; }

  .badge { display:inline-block; font-size:12.5px; font-weight:600; border-radius:999px; padding:2px 10px; background:var(--brand-l); color:var(--brand); }
  .badge.green { background:var(--green-l); color:var(--green); }
  .badge.gray { background:var(--soft); color:#475569; }
  .badge.red { background:var(--red-l); color:var(--red); }
  .badge.amber { background:var(--amber-l); color:var(--amber); }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:24px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px 22px; box-shadow:var(--shadow-sm); }
  .stat b { display:block; font-size:30px; font-weight:700; line-height:1.1; letter-spacing:-.02em; color:var(--ink); font-variant-numeric:tabular-nums; }
  .stat span { display:block; margin-top:6px; font-size:13.5px; color:var(--muted); }

  .alert { border-radius:8px; border:1px solid; padding:12px 16px; margin-top:12px; font-size:14px; }
  .alert.err { background:var(--red-l); color:#912018; border-color:var(--red-line); }
  .alert.warn { background:var(--amber-l); color:#93370D; border-color:var(--amber-line); }
  .alert.ok { background:var(--green-l); color:#085D3A; border-color:var(--green-line); }
  .alert ul { margin:6px 0 0; padding-left:20px; }

  /* ---------- Page heads and bus workspace ---------- */
  .bus-page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:24px; }
  .bus-page-head h2 { margin:0 0 6px; font-size:24px; font-weight:700; line-height:1.2; letter-spacing:-.02em; color:var(--ink); }
  .bus-page-head p { margin:0; max-width:680px; }
  .bus-page-head .btn { white-space:nowrap; }
  .bus-route-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin:0 0 24px; }
  .bus-route-stat { align-items:flex-start; background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; display:flex; gap:16px; box-shadow:var(--shadow-sm); }
  .bus-route-stat .btn { display:flex; margin-top:12px; }
  .bus-route-stat .iconbox { width:40px; height:40px; border-radius:10px; display:grid; place-items:center; background:var(--brand-l); color:var(--brand); font-weight:600; font-size:18px; flex:0 0 auto; }
  .bus-route-stat strong { display:block; font-size:26px; font-weight:700; line-height:1.1; letter-spacing:-.02em; color:var(--ink); font-variant-numeric:tabular-nums; }
  .bus-route-stat span { display:block; color:var(--muted); font-size:13.5px; margin-top:4px; }
  .bus-route-toolbar { display:flex; align-items:center; gap:12px; padding:16px; background:#fff; border:1px solid var(--line); border-radius:12px 12px 0 0; border-bottom:0; }
  .bus-route-toolbar .searchbox { flex:1; min-width:180px; position:relative; }
  .bus-route-toolbar .searchbox input { padding-left:40px; }
  .bus-route-toolbar .searchmark { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:17px; pointer-events:none; }
  .bus-route-table { border-radius:0; box-shadow:none; }
  .bus-route-table table { min-width:850px; }
  .bus-table-caption { display:flex; justify-content:space-between; gap:10px; padding:12px 18px; background:#fff; border:1px solid var(--line); border-top:0; border-radius:0 0 12px 12px; color:var(--muted); font-size:13.5px; }
  .bus-table-caption strong { color:var(--ink); }
  .route-time { display:inline-flex; align-items:center; background:var(--soft); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:3px 10px; font-weight:600; font-size:14px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .route-line { display:flex; align-items:center; gap:10px; min-width:230px; }
  .route-line .endpoint { font-weight:600; color:var(--ink); }
  .route-line .arrow { color:var(--faint); font-size:16px; }
  .route-subline { color:var(--muted); font-size:13px; margin-top:4px; }
  .route-count { display:inline-flex; align-items:center; justify-content:center; min-width:28px; height:26px; padding:0 8px; border-radius:999px; background:var(--brand-l); color:var(--brand); font-weight:600; font-size:13px; }

  /* Analytics placeholders */
  .analytics-empty { min-height:190px; border:1.5px dashed var(--ctl); border-radius:10px; padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .analytics-bars { height:78px; width:100%; max-width:320px; display:flex; align-items:flex-end; justify-content:center; gap:12px; margin-bottom:18px; opacity:.6; }
  .analytics-bars i { display:block; width:22px; height:22%; background:#C7D7FE; border-radius:4px 4px 0 0; }
  .analytics-bars i:nth-child(2) { height:45%; } .analytics-bars i:nth-child(3) { height:32%; }
  .analytics-bars i:nth-child(4) { height:68%; } .analytics-bars i:nth-child(5) { height:52%; }
  .analytics-bars i:nth-child(6) { height:82%; } .analytics-bars i:nth-child(7) { height:60%; }
  .analytics-bars.horizontal { height:auto; flex-direction:column; align-items:stretch; gap:10px; opacity:.65; }
  .analytics-bars.horizontal i { height:12px; width:35%; border-radius:6px; }
  .analytics-bars.horizontal i:nth-child(2) { width:58%; } .analytics-bars.horizontal i:nth-child(3) { width:24%; }
  #analyticsPeriod { min-width:170px; }

  /* ---------- Request / review lists ---------- */
  .request-card { min-width:0; }
  .request-card[style] { padding:16px 20px !important; margin-bottom:12px !important; }
  .request-card:hover { border-color:#CBD5E1; }
  .request-card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .request-row { display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto auto auto; gap:2px 20px; align-items:center; }
  .request-row .request-title { grid-column:1; grid-row:1; font-weight:600; font-size:15.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
  .request-row .request-summary { grid-column:1; grid-row:2; color:var(--text); font-size:14px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .request-row .request-summary:nth-child(3) { grid-row:3; color:var(--muted); font-size:12.5px; }
  .request-row .request-actions { grid-column:2; grid-row:1 / span 3; min-width:0; white-space:nowrap; }
  .request-details { display:none; margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
  .request-details p { margin:6px 0; }
  .request-card.expanded .request-details { display:block; }

  .review-stop-table { width:100%; min-width:0; table-layout:fixed; border-collapse:separate; border-spacing:0 6px; }
  .review-stop-table th, .review-stop-table td { overflow-wrap:anywhere; }
  .review-stop-table th { padding:8px 8px; background:#F8FAFC; }
  .review-stop-table td { padding:5px 6px; vertical-align:middle; }
  .review-stop-row input { min-width:100px; padding:7px 8px; min-height:36px; box-sizing:border-box; max-width:100%; }
  .review-stop-row .review-stop-num { width:34px; font-weight:600; color:var(--muted); }
  .review-stop-row .review-move { white-space:nowrap; width:76px; }
  .review-stop-row .review-place { min-width:0; width:100%; }
  .review-stop-row .review-hi, .review-stop-row .review-pa { min-width:0; width:100%; }

  /* ---------- Stop editors ---------- */
  .stoprow { display:grid; grid-template-columns:minmax(0,1fr) 112px auto; gap:8px; margin-bottom:8px; align-items:center; }
  .stoprow .route-place-fields { grid-column:1; }
  .stoprow .st_time { grid-column:2; }
  .stoprow .route-stop-actions { grid-column:3; display:flex; gap:4px; white-space:nowrap; }
  .route-place-fields { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; flex:1; min-width:0; }
  .route-place-fields input { min-width:0; width:100%; padding:7px 10px; min-height:36px; }
  .route-place-labels { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; font-size:12.5px; color:var(--muted); margin:0 0 4px; }
  .route-endpoint-row { display:grid; grid-template-columns:54px minmax(0,1fr); gap:10px; align-items:center; margin:8px 0; }
  .route-endpoint-row>strong { font-size:13px; color:var(--muted); }
  .route-form-meta { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
  .route-form-meta label { margin-top:8px; }

  /* Unified compact place editor (Bus route editor + Review route editor) */
  .ed-stops { counter-reset:edstop; }
  .edstop { display:grid; grid-template-columns:42px minmax(0,1fr) 132px 132px; grid-template-areas:"num names time act"; gap:6px 10px; align-items:center; margin:0 0 6px; padding:8px 10px 8px 8px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .edstop.edend { background:#F8FAFC; border-color:var(--line); }
  .edstop>.ed-num { grid-area:num; font-size:12.5px; font-weight:600; color:var(--muted); text-align:center; }
  .ed-stops>.edstop>.ed-num::before { counter-increment:edstop; content:counter(edstop); display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--brand-l); color:var(--brand); font-size:13px; font-weight:600; }
  .edstop>.edplace { grid-area:names; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; min-width:0; }
  .edstop .edplace input { min-width:0; width:100%; padding:4px 10px; min-height:34px; font-size:14px; border-radius:6px; box-shadow:none; }
  .edstop>.ed-time { grid-area:time; }
  .edstop input[type=time].ed-time { padding:4px 8px; min-height:34px; font-size:14px; border-radius:6px; box-shadow:none; }
  .edstop>.ed-actions { grid-area:act; display:flex; gap:4px; justify-content:flex-end; white-space:nowrap; }
  .ed-actions .btn { padding:2px 8px; min-width:30px; min-height:30px; font-size:14px; line-height:1.2; box-shadow:none; }
  .ed-actions .ed-plus { color:var(--brand); background:var(--brand-l); border-color:var(--brand-line); font-weight:700; }
  .ed-meta { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:8px; }
  .ed-meta label { margin-top:8px; }
  .ed-bad { border-color:var(--red) !important; background:var(--red-l) !important; }
  .ed-bad:focus { box-shadow:0 0 0 4px rgba(180,35,24,.15) !important; }
  #edProblems .alert { margin-top:14px; }
  .edsug { position:fixed; z-index:60; display:none; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow-md); max-height:250px; overflow:auto; }
  .edsug-item { padding:9px 14px; border-bottom:1px solid var(--line-soft); cursor:pointer; line-height:1.3; }
  .edsug-item:last-child { border-bottom:0; }
  .edsug-item:hover, .edsug-item.on { background:var(--brand-l); }
  .edsug-item b { display:block; font-size:14.5px; font-weight:600; }
  .edsug-item span { display:block; font-size:12.5px; color:var(--muted); }

  /* ---------- Dialog ---------- */
  .overlay { position:fixed; inset:0; background:rgba(15,23,42,.5); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; padding:24px; overflow:hidden; z-index:30; }
  .overlay.show { display:flex; }
  .dialog { background:#fff; border-radius:16px; width:100%; max-width:1180px; height:calc(100vh - 48px); max-height:calc(100vh - 48px); display:flex; flex-direction:column; overflow:hidden; box-shadow:0 24px 64px rgba(15,23,42,.28); }
  .dlg-head { display:flex; align-items:center; gap:12px; padding:16px 16px 16px 28px; background:#fff; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .dlg-head h2 { margin:0; flex:1; font-size:18px; font-weight:600; line-height:1.3; letter-spacing:-.01em; color:var(--ink); }
  .dlg-head button { width:36px; height:36px; border:0; border-radius:8px; background:transparent; font-size:24px; line-height:1; color:var(--muted); }
  .dlg-head button:hover { background:var(--soft); color:var(--ink); }
  .dlg-body { padding:12px 28px 24px; flex:1 1 auto; min-height:0; overflow:auto; }
  .dlg-foot { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; flex-wrap:wrap; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 22px; border-radius:10px; display:none; z-index:50; max-width:92%; font-size:14.5px; font-weight:500; box-shadow:var(--shadow-md); }

  /* ---------- Advertisement workspace ---------- */
  .ad-workspace { max-width:1080px; }

function sharedEntityChanges(before, after) {

    var type = listName === 'places' ? 'place' : 'route';
    var oldMap = new Map(((before && before[listName]) || []).filter(function(x){return x && x.id;}).map(function(x){return [String(x.id), x];}));
    var newMap = new Map(((after && after[listName]) || []).filter(function(x){return x && x.id;}).map(function(x){return [String(x.id), x];}));
    oldMap.forEach(function(oldItem, id) {

    });

async function publishSharedDataDiff(before, after) {

    body:JSON.stringify({ action:'publish', changes:changes })

async function mergeMdmPublishedChanges(sinceRevision) {
  if (!cfg.sbUrl || !cfg.sbKey || !data) return false;
  var since = Math.max(0, Number(sinceRevision || 0));
  function merge(list, item, replaceExisting) {
    if (!item || !item.id) return list;
    if (typeof item.name === "string") item.name = { en: item.name.trim(), hi: "", pa: "" };
    else if (!item.name || typeof item.name !== "object" || Array.isArray(item.name)) item.name = { en: "", hi: "", pa: "" };
    else item.name = { en: String(item.name.en || "").trim(), hi: String(item.name.hi || "").trim(), pa: String(item.name.pa || "").trim() };
    if (!Array.isArray(item.aliases)) item.aliases = item.aliases ? [String(item.aliases)] : [];
    var index = list.findIndex(function(x) { return String(x.id) === String(item.id); });
    // Revision 1 is the original bulk baseline. The current routes.json snapshot
    // is newer/authoritative for IDs it already contains; baseline only fills gaps.
    // Later revisions are actual MDM edits and must replace existing records.
    if (index >= 0) { if (replaceExisting) list[index] = item; }
    else list.push(item);
    return list;
  }
  function remove(list, id) { return list.filter(function(x) { return String(x.id) !== String(id); }); }
  var offset = 0, pages = 0, allChanges = [], maxRevision = since;

    while (pages++ < 20) {
      var url = cfg.sbUrl.replace(/\/+$/, '') + '/functions/v1/bustime-data-sync?action=changes&since=' + encodeURIComponent(since) + '&offset=' + offset;
      var res = await fetch(url, {
        headers: { apikey: cfg.sbKey, Authorization: 'Bearer ' + cfg.sbKey, Accept: 'application/json', 'Cache-Control': 'no-store' },
        cache: 'no-store'
      });
      if (!res.ok) throw new Error('MDM change history HTTP ' + res.status);
      var changes = await res.json();
      if (!Array.isArray(changes)) throw new Error('Invalid MDM change history');
      allChanges = allChanges.concat(changes);
      if (changes.length < 1000) break;
      offset += changes.length;
    }
    allChanges.forEach(function(change) {
      if (!change || !change.entity_type || !change.entity_id) return;
      var revision = Number(change.revision || 0);
      if (revision > maxRevision) maxRevision = revision;
      var listName = change.entity_type === 'place' ? 'places' : (change.entity_type === 'route' ? 'routes' : '');
      if (!listName) return;
      if (change.operation === 'delete') data[listName] = remove(data[listName] || [], change.entity_id);
      else if (change.operation === 'upsert' && change.payload && String(change.payload.id) === String(change.entity_id)) {
        data[listName] = merge(data[listName] || [], change.payload, revision > 1);
      }
    });
    mdmRevisionCursor = Math.max(mdmRevisionCursor, maxRevision);
    return allChanges.length > 0;
  } catch (err) {
    console.warn('MDM published changes could not be loaded:', err);
    return false;
  }
}

async function mergeApprovedRouteSubmissions() {
  if(!cfg.sbUrl||!cfg.sbKey)throw new Error('Configure Supabase and sign in before publishing so approved routes are not missed.');
  if(!sbToken)throw new Error('Sign in to Supabase before publishing. This lets Publish include every approved route, even after a page refresh.');
  var all=[],offset=0,pageSize=500;
  while(true){
    var page=await sbFetch('/rest/v1/route_submissions?select=*&status=eq.approved&order=created_at.asc&limit='+pageSize+'&offset='+offset);
    page=Array.isArray(page)?page:[];
    all=all.concat(page);
    if(page.length<pageSize)break;
    offset+=pageSize;
  }
  var updates=[],changed=false;
  all.forEach(function(sub){
    // Existing-route edits change a known record rather than create a new service.
    // Their approved draft is handled by the edit workflow, not appended as a new route.
    if(sub.submission_type==='edit_existing_route')return;
    var rd=sub.reviewed_data&&typeof sub.reviewed_data==='object'?sub.reviewed_data:{};
    var route=null;
    if(rd.version===1&&rd.route&&typeof rd.route==='object'){
      (Array.isArray(rd.places)?rd.places:[]).forEach(mergeApprovedPlaceRecord);
      route=cloneApprovedRoute(rd.route);
    }else{
      // Older approvals may have a saved review draft but not the durable version-1 payload.
      // Prefer those reviewed names/times when recovering them; otherwise use the original submission.
      var stopRows=Array.isArray(rd.stops)&&rd.stops.length?rd.stops:(Array.isArray(sub.stops)?sub.stops:[]);
      var first=stopRows.length?stopRows[0]:{},last=stopRows.length?stopRows[stopRows.length-1]:{};
      var fromName=String(rd.from||sub.from_text||first.name||''),toName=String(rd.to||sub.to_text||last.name||'');
      var fromId=approvedResolvePlace(sub.from_id,rd.fromNames||first.names||{},fromName);
      var toId=approvedResolvePlace(sub.to_id,rd.toNames||last.names||{},toName);
      if(!fromId||!toId)return;
      var start=String(rd.start||sub.start_time||'');
      // A missing start-stop time must stay missing; never borrow an intermediate stop's time.
      var mid=[],arrive=null,previous=start,day=0;
      stopRows.forEach(function(st,index){
        var fallback=String(st.name||((index===0)?fromName:(index===stopRows.length-1?toName:''))||'');
        var pid=approvedResolvePlace(st.place,st.names||{},fallback);
        if(!pid)return;
        var tm=TIME_RE.test(st.time||'')?st.time:null;
        if(tm&&tm<previous)day++;
        if(tm)previous=tm;
        if(pid===toId){if(tm)arrive=tm;return;}
        if(pid!==fromId){
          var item={place:pid};
          if(tm)item.time=tm;
          if(day)item.day_offset=day;
          mid.push(item);
        }
      });
      route={id:'',from:fromId,to:toId};
      if(TIME_RE.test(start))route.time=start;
      if(arrive)route.arrive=arrive;
      var approvedService=String(rd.service||sub.service_name||'').trim();
      if(approvedService)route.service=approvedService;
      if(mid.length)route.stops=mid;
      if(sub.long_route)route.longRoute=true;
      if(sub.start_date)route.startDate=String(sub.start_date);
    }
    if(!route||!route.from||!route.to)return;
    // Resolve missing Place IDs before publishing; never publish a route with broken references.
    if(!placeById(route.from))route.from=approvedResolvePlace(route.from,{en:sub.from_text||''},sub.from_text||route.from);
    if(!placeById(route.to))route.to=approvedResolvePlace(route.to,{en:sub.to_text||''},sub.to_text||route.to);
    (route.stops||[]).forEach(function(st){
      if(st.place&&!placeById(st.place))st.place=approvedResolvePlace(st.place,{en:st.name||''},st.name||st.place);
    });
    if(!placeById(route.from)||!placeById(route.to))return;
    var existingById=sub.route_id&&data.routes.find(function(r){return String(r.id)===String(sub.route_id);});
    var existing=existingById||data.routes.find(function(r){return approvedRouteSignature(r)===approvedRouteSignature(route);});
    if(existing){
      route=existing;
    }else{
      var wanted=String(route.id||'');
      if(!wanted||data.routes.some(function(r){return String(r.id)===wanted;}))wanted=nextNum('r',data.routes);
      route.id=wanted;
      data.routes.push(route);
      changed=true;
    }
    var payload={version:1,route:cloneApprovedRoute(route),places:persistApprovedPayload(route)};
    updates.push({id:sub.id,route_id:String(route.id),reviewed_data:payload,approved_at:sub.approved_at||new Date().toISOString()});
  });
  if(changed)setDirty(true);
  return updates;
}
async function correctionAlreadyApplied(x){
  var r=(data.routes||[]).find(function(z){return String(z.id)===String(x.route_id);});
  if(!r)return false;
  if(x.request_type==='correct_time'){
    if(x.stop_id===r.from)return String(r.time||'')===String(x.corrected_time||'');
    if(x.stop_id===r.to)return String(r.arrive||'')===String(x.corrected_time||'');
    var timeStop=(r.stops||[]).find(function(z){return String(z.place)===String(x.stop_id);});
    return !!timeStop&&String(timeStop.time||'')===String(x.corrected_time||'');
  }
  if(x.request_type==='missing_stop'){
    var sequence=[r.from].concat((r.stops||[]).map(function(z){return z.place;}),[r.to]);
    var bi=sequence.indexOf(x.before_stop_id),ai=sequence.indexOf(x.after_stop_id);
    if(bi>=0&&ai===bi+2){
      var middle=sequence[bi+1],p=placeById(middle),raw=String(x.missing_place_name||'').trim(),names=x.missing_place_names||{};
      return middle===x.missing_place_id || !!(p&&((raw&&Object.keys(p.name||{}).some(function(k){return String(p.name[k]||'').trim().toLowerCase()===raw.toLowerCase();}))||Object.keys(names).some(function(k){return names[k]&&String(p.name&&p.name[k]||'').trim().toLowerCase()===String(names[k]).trim().toLowerCase();})));
    }
    return false;
  }
  if(x.request_type==='route_edit'&&Array.isArray(x.proposed_stops)&&x.proposed_stops.length>=2){
    var seq=[r.from].concat((r.stops||[]).map(function(z){return z.place;}),[r.to]);
    if(seq.length!==x.proposed_stops.length)return false;
    return x.proposed_stops.every(function(st,i){
      var p=placeById(seq[i]),raw=String(st.name||'').trim(),id=st.place_id||'';
      var sameId=!!id&&String(id)===String(seq[i]);
      var sameName=!!p&&raw&&Object.keys(p.name||{}).some(function(k){return String(p.name[k]||'').trim().toLowerCase()===raw.toLowerCase();});
      var expectedTime=String(st.time||'').trim();
      var actualTime=i===0?String(r.time||''):i===seq.length-1?String(r.arrive||''):String(((r.stops||[])[i-1]||{}).time||'');
      return (sameId||sameName)&&expectedTime===actualTime;
    });
  }
  return false;
}
async function mergeApprovedCommunitySubmissions(nextVersion){
  if(!cfg.sbUrl||!cfg.sbKey||!sbToken)throw new Error('Sign in to Supabase before publishing so approved requests survive refreshes.');
  var updates=[],changed=false;
  var specs=[{kind:'corrections',table:'correction_submissions'}];
  for(var si=0;si<specs.length;si++){
    var spec=specs[si],rows=[],offset=0,pageSize=500;
    while(true){
      var page=await sbFetch('/rest/v1/'+spec.table+'?select=*&status=eq.approved&order=created_at.asc&limit='+pageSize+'&offset='+offset);
      page=Array.isArray(page)?page:[];
      rows=rows.concat(page);
      if(page.length<pageSize)break;
      offset+=pageSize;
    }
    for(var ri=0;ri<rows.length;ri++){
      var sub=rows[ri],rd=sub.reviewed_data&&typeof sub.reviewed_data==='object'?sub.reviewed_data:{};
      // Only approvals made by this durable-queue version should be auto-published.
      // Legacy approved test records are deliberately left alone.
      if(rd._bustime_published_version||rd._bustime_publish_pending!==true)continue;
      var reviewed=Object.assign({},sub,rd);
      if(!await correctionAlreadyApplied(reviewed)){applyApprovedCorrection(reviewed);changed=true;}
      var durable=Object.assign({},rd);
      if(!Object.keys(durable).length)durable=Object.assign({},sub);
      durable._bustime_published_version=nextVersion;
      durable._bustime_publish_pending=false;
      updates.push({table:spec.table,id:sub.id,reviewed_data:durable});
    }
  }
  if(changed)setDirty(true);
  return updates;
}
var publishSyncWarnings=0;
async function publish() {
  if (!cfg.token) { toast('Add your GitHub token in Settings first'); return; }
  var approvedUpdates=await mergeApprovedRouteSubmissions();
  var communityUpdates=await mergeApprovedCommunitySubmissions(baseVersion+1);
  var v = validate();
  if (v.errors.length) { toast('Fix the errors first'); return; }
  var out = {};
  if (data._note) out._note = data._note;
  out.dataVersion = baseVersion + 1;
  out.places = data.places; out.routes = data.routes;
  var body = {
    message: 'Data update v' + out.dataVersion + ' — publish transport data sync',
    content: b64encode(JSON.stringify(out, null, 2) + '\n'),
    sha: sha, branch: cfg.branch
  };
  var h = ghHeaders(); h['Content-Type'] = 'application/json';
  // Keep the established Web Admin workflow: commit the full GitHub snapshot first.
  // After GitHub confirms success, mirror route/place deltas to revisioned sync.
  // If mirroring fails, retain the old diff baseline so a later Publish retries it.
  var sharedBefore = cloneSharedEntities(sharedBaseData || { places:[], routes:[] });
  var sharedAfter = cloneSharedEntities(data);
  var r = await fetch(apiUrl(), { method: 'PUT', headers: h, body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) {
    throw new Error('The file was changed elsewhere in the meantime. Reload from GitHub (your unpublished changes will be lost).');
  }
  if (!r.ok) throw new Error('GitHub ' + r.status + ' - ' + (await r.text()).slice(0, 160));
  var j = await r.json();
  sha = j.content.sha; baseVersion = out.dataVersion; data.dataVersion = out.dataVersion;
  publishSyncWarnings=0;
  try {
    await publishSharedDataDiff(sharedBefore, sharedAfter);
    sharedBaseData = sharedAfter;
    setDirty(false);
  } catch (sharedSyncError) {
    publishSyncWarnings++;
    setDirty(true); // Keep Publish available to retry the shared delta mirror.
    console.error('GitHub snapshot published, but shared MDM sync needs retry:', sharedSyncError);
    toast('GitHub Snapshot published, but cross-panel sync failed. Publish again to retry. ' + (sharedSyncError.message || sharedSyncError));
  }
  for(var ui=0;ui<approvedUpdates.length;ui++){
    var upd=approvedUpdates[ui];
    try{
      await sbFetch('/rest/v1/route_submissions?id=eq.'+encodeURIComponent(upd.id),{
        method:'PATCH',headers:{Prefer:'return=minimal'},
        body:JSON.stringify({route_id:upd.route_id,reviewed_data:upd.reviewed_data,approved_at:upd.approved_at})
      });
    }catch(syncError){publishSyncWarnings++;}
  }
  for(var ci=0;ci<communityUpdates.length;ci++){
    var cu=communityUpdates[ci];
    try{
      await sbFetch('/rest/v1/'+cu.table+'?id=eq.'+encodeURIComponent(cu.id),{
        method:'PATCH',headers:{Prefer:'return=minimal'},
        body:JSON.stringify({reviewed_data:cu.reviewed_data})
      });
    }catch(communitySyncError){publishSyncWarnings++;}
  }
}

// ============ Validation (same rules the app applies on import) ============
function validate() {
  var errors = [], warnings = [], pids = {};
  data.places.forEach(function (p) {
    if (!p.id) errors.push('A place has no id');
    else if (pids[p.id]) errors.push('Duplicate place id: ' + p.id);
    pids[p.id] = true;
    var hasName = Object.keys(p.name || {}).some(function (k) { return String(p.name[k] || '').trim(); });
    if (!hasName) errors.push('Place "' + p.id + '" has no name');
  });
  var noHi = data.places.filter(function (p) { return !(p.name && p.name.hi); }).length;
  var noPa = data.places.filter(function (p) { return !(p.name && p.name.pa); }).length;
  if (noHi) warnings.push(noHi + ' place(s) have no Hindi name');
  if (noPa) warnings.push(noPa + ' place(s) have no Punjabi name');

  var rids = {};
  data.routes.forEach(function (r) {
    var tag = 'Route ' + r.id;
    if (!r.id) errors.push('A route has no id');
    else if (rids[r.id]) errors.push('Duplicate route id: ' + r.id);
    rids[r.id] = true;
    if (!pids[r.from]) errors.push(tag + ': "From" place does not exist');
    if (!pids[r.to]) errors.push(tag + ': "To" place does not exist');
    if (r.from && r.from === r.to) errors.push(tag + ': From and To are the same');
    if (!TIME_RE.test(r.time || '') && !TIME_RE.test(r.arrive || '') && !(r.stops || []).some(function (s) { return TIME_RE.test(s.time || ''); })) errors.push(tag + ': no valid time anywhere on the route');
    (r.stops || []).forEach(function (s) { if (!pids[s.place]) errors.push(tag + ': a stop refers to a missing place'); });
  });

  return { errors: errors, warnings: warnings };
}
function reportHtml(v) {
  return (v.errors.length ? '<div class="alert err"><b>Errors (publishing is blocked)</b><ul>' +
      v.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>'
    : '<div class="alert ok">No errors. The data is valid.</div>') +
    (v.warnings.length ? '<div class="alert warn"><b>Warnings</b><ul>' +
      v.warnings.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>' : '');
}

      analyticsStat(Object.keys(unique).length,'App sessions','Unique random app sessions in selected period') +
      analyticsStat(bus,'Bus searches','From–To and stand searches')
      analyticsStat(contacts,'Contact actions','Recorded contact taps') +
      analyticsStat('—','Ad earnings','Connect official Start.io reporting');
    if (daily) {
      var buckets = {}, cursor = new Date(start); cursor.setHours(0,0,0,0);
      while (cursor <= now) { var key = cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0')+'-'+String(cursor.getDate()).padStart(2,'0'); buckets[key]=0; cursor.setDate(cursor.getDate()+1); }
      events.forEach(function(e){var d=new Date(e.created_at), k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if (buckets[k] != null) buckets[k]++;});
      var vals=Object.keys(buckets).map(function(k){return {day:k,total:buckets[k]};}), max=Math.max(1,...vals.map(function(v){return v.total;}));
      daily.innerHTML = '<div class="analytics-bars">' + vals.slice(-14).map(function(v){return '<div title="'+esc(v.day+': '+v.total)+' events" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:1;min-width:5px"><i style="height:'+Math.max(3,Math.round(v.total/max*100))+'%;width:100%;background:#4F7EDB;border-radius:4px 4px 0 0"></i></div>';}).join('') + '</div><b>'+events.length+' events</b><p class="muted">Recorded events by day; newest dates at right</p>';
    }
    if (sections) {
      var by=[{name:'Bus',n:count(function(e){return e.section==='bus';})}], maxSection=Math.max(1,...by.map(function(x){return x.n;}));
      sections.innerHTML=by.map(function(x){return '<div style="width:100%;text-align:left;margin:10px 0"><div style="display:flex;justify-content:space-between"><b>'+x.name+'</b><span>'+x.n+'</span></div><div style="height:12px;background:#EEF2F8;border-radius:8px;overflow:hidden;margin-top:5px"><div style="height:100%;width:'+Math.round(x.n/maxSection*100)+'%;background:#4F7EDB;border-radius:8px"></div></div></div>';}).join('') + '<p class="muted">Counts are recorded events, not unique people.</p>';
    }
    if (!events.length && daily) daily.innerHTML='<b>No events recorded for this period</b><p class="muted">New events appear after users run an updated app build.</p>';
    toast('Analytics updated: '+events.length+' events');
  } catch (err) {
    if (daily) daily.innerHTML='<b>Could not load analytics</b><p class="muted">'+esc(err.message)+'</p>';
    toast('Analytics error: '+err.message);
  }
}

async function uploadAdPoster(file){
  if(!file) return;
  if(!cfg.sbUrl||!cfg.sbKey)throw new Error('Configure Supabase URL and anon key in Settings first.');
  var allowed={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
  if(!allowed[file.type])throw new Error('Unsupported poster format. Use JPG, PNG or WebP.');
  if(file.size>8*1024*1024)throw new Error('Poster is larger than 8 MB. Choose a smaller image.');
  var ext=allowed[file.type];
  var path='campaign-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
  var base=cfg.sbUrl.replace(/\/+$/,'');
  if(!sbToken)throw new Error('Sign in with the owner Admin account before uploading a poster.');
  var headers={apikey:cfg.sbKey,Authorization:'Bearer '+sbToken,'Content-Type':file.type,'x-upsert':'false'};
  var response=await fetch(base+'/storage/v1/object/ads-posters/'+path,{method:'POST',headers:headers,body:file});
  if(!response.ok){
    var detail='';
    try{var payload=await response.json();detail=payload.message||payload.error||payload.error_description||JSON.stringify(payload);}catch(_){try{detail=await response.text();}catch(__){}}
    throw new Error('Poster upload failed: HTTP '+response.status+(detail?' — '+detail:'')+'.');
  }
  adConfig.my.poster_url=base+'/storage/v1/object/public/ads-posters/'+path;
}
async function deleteAdPoster(){
  if(!sbToken)throw new Error('Sign in with the owner Admin account before deleting a poster.');
  var base=cfg.sbUrl.replace(/\/+$/,'');
  var savedUrl=String(adConfig.my.poster_url||'').trim();
  var marker='/storage/v1/object/public/ads-posters/';
  var markerAt=savedUrl.indexOf(marker);
  if(!savedUrl||markerAt<0||savedUrl.slice(0,markerAt)!==base)throw new Error('The saved poster is not a managed ads-posters file, so it cannot be deleted here.');
  var objectPath;
  try{objectPath=decodeURIComponent(savedUrl.slice(markerAt+marker.length).split('?')[0]);}catch(_){throw new Error('The saved poster URL is invalid.');}
  if(!objectPath||objectPath.split('/').some(function(part){return !part||part==='.'||part==='..';}))throw new Error('The saved poster path is invalid.');
  // Clear the saved URL first so the app will not keep showing a broken image if Storage cleanup fails.
  adConfig.my.poster_url='';
  await saveAdConfig();
  var encodedPath=objectPath.split('/').map(encodeURIComponent).join('/');
  var response=await fetch(base+'/storage/v1/object/ads-posters/'+encodedPath,{method:'DELETE',headers:{apikey:cfg.sbKey,Authorization:'Bearer '+sbToken}});
  if(!response.ok){
    var detail='';
    try{var payload=await response.json();detail=payload.message||payload.error||payload.error_description||JSON.stringify(payload);}catch(_){}
    throw new Error('Poster URL cleared, but Storage file deletion failed: HTTP '+response.status+(detail?' — '+detail:'')+'.');
  }
  toast('Poster deleted and campaign URL cleared.');
}

// ============ Supabase (user submissions) ============
async function sbFetch(path, opts) {
  opts = opts || {};
  var base = cfg.sbUrl.replace(/\/+$/, '');
  var headers = Object.assign({ apikey: cfg.sbKey, 'Content-Type': 'application/json' }, opts.headers || {});
  if (sbToken) headers.Authorization = 'Bearer ' + sbToken;
  var res = await fetchWithTimeout(base + path, Object.assign({}, opts, { headers: headers }), 12000);
  if (res.status === 401 && sbRefreshToken && !opts.__bustimeRetried) {
    var refreshRes = await fetchWithTimeout(base + '/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{apikey:cfg.sbKey,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:sbRefreshToken})
    }, 12000);
    var refreshed = await refreshRes.json();
    if (refreshRes.ok) {
      saveAdminSession(refreshed);
      await verifySingleAdmin();
      var retryOpts = Object.assign({}, opts, {__bustimeRetried:true});
      delete retryOpts.__bustimeRetried;
      return sbFetchRetryOnce(path, retryOpts);
    }
    saveAdminSession({});
    throw new Error('Admin session expired. Please sign in again.');
  }
  if (!res.ok) {
    var t = ''; try { var j = await res.json(); t = j.error_description || j.message || j.hint || ''; } catch (e) {}
    throw new Error('Supabase ' + res.status + (t ? ': ' + t : ''));
  }
  if (res.status === 204) return null;
  // PostgREST may return an empty body even with a 2xx status (Prefer: return=minimal).
  // Do not call response.json() on an empty string: it throws "Unexpected end of JSON input".
  var raw = await res.text();
  if (!raw || !raw.trim()) return null;
  var contentType = res.headers.get('content-type') || '';
  if (contentType.indexOf('json') >= 0) {
    try { return JSON.parse(raw); }
    catch (e) { throw new Error('Supabase returned invalid JSON (' + res.status + ').'); }
  }
  return raw;
}
async function sbFetchRetryOnce(path, opts) {
  opts = opts || {};
  var base = cfg.sbUrl.replace(/\/+$/, '');
  var headers = Object.assign({apikey:cfg.sbKey,'Content-Type':'application/json'}, opts.headers || {});
  if (sbToken) headers.Authorization = 'Bearer ' + sbToken;
  var res = await fetchWithTimeout(base + path, Object.assign({}, opts, {headers:headers}), 12000);
  if (!res.ok) { var t=''; try { var j=await res.json(); t=j.message||j.error_description||''; } catch (_) {} throw new Error('Supabase '+res.status+(t?': '+t:'')); }
  if (res.status===204) return null;
  var raw=await res.text(); if(!raw||!raw.trim()) return null;
  var ct=res.headers.get('content-type')||'';
  if(ct.indexOf('json')>=0) { try{return JSON.parse(raw);}catch(_){throw new Error('Supabase returned invalid JSON ('+res.status+').');} }
  return raw;
}

function nearSubmittedPlaces(rawName) {
  var normalize = function (v) { return String(v || '').toLowerCase().normalize('NFKD').replace(/[\\u0300-\\u036f]/g, '').replace(/[^\\p{L}\\p{N}]+/gu, ' ').trim().replace(/\\s+/g, ' '); };
  var candidate = normalize(rawName);
  if (!candidate) return [];
  return data.places.filter(function (p) {
    return Object.keys(p.name || {}).some(function (k) {
      var existing = normalize(p.name[k]);
      return existing && existing !== candidate && (existing.indexOf(candidate) >= 0 || candidate.indexOf(existing) >= 0 ||
        (Math.abs(existing.length - candidate.length) <= 2 && existing.split(' ').length === candidate.split(' ').length &&
         existing.split(' ').some(function (word) { return candidate.split(' ').some(function (other) { return word.length >= 4 && other.length >= 4 && (word.indexOf(other) === 0 || other.indexOf(word) === 0); }); })));
    });
  }).slice(0, 5);
}
function warnNearSubmittedPlaces(names) {
  var warnings = [];
  (names || []).forEach(function (name) {
    nearSubmittedPlaces(name).forEach(function (p) {
      var label = pname(p) || p.id;
      var rawNorm=String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');

function applyApprovedCorrection(x) {
  var r = data.routes.find(function(z){ return z.id === x.route_id; });
  if (!r) throw new Error('Route '+x.route_id+' was not found in routes.json; request not approved.');
  if (x.request_type === 'correct_time') {
    if (x.stop_id === r.from) r.time = x.corrected_time;
    else if (x.stop_id === r.to) r.arrive = x.corrected_time;
    else {
      var st = (r.stops || []).find(function(z){return z.place===x.stop_id;});
      if (!st) throw new Error('Selected stop was not found in this route; request not approved.');
      st.time = x.corrected_time;
    }
  } else if (x.request_type === 'route_edit') {
    var proposed = Array.isArray(x.proposed_stops) ? x.proposed_stops : [];
    if (proposed.length < 2 || proposed.length > 100) throw new Error('The proposed route must contain a start, destination, and no more than 100 stops.');
    var ids = [];
    proposed.forEach(function(st) {
      var pid=st.place_id||'',names=st.names||{},typed=String(st.name||'').trim();
      if(pid&&!placeById(pid))throw new Error('A selected place no longer exists: '+pid);
      if(!typed)throw new Error('Every proposed stop must have a name.');
      pid=ensureReviewedPlace(names,pid||null);
      if(!pid||!placeById(pid))throw new Error('Could not resolve the proposed stop: '+typed);
      ids.push(pid);
    });
    var times = proposed.map(function(st){return String(st.time || '').trim();});
    r.from = ids[0];
    if (times[0]) r.time = times[0];
    r.to = ids[ids.length - 1];
    if (times[times.length - 1]) r.arrive = times[times.length - 1]; else delete r.arrive;
    r.stops = [];
    for (var ri = 1; ri < ids.length - 1; ri++) {
      var middle = {place:ids[ri]};
      if (times[ri]) middle.time = times[ri];
      r.stops.push(middle);
    }
    if (!r.stops.length) delete r.stops;
    setDirty(true);
  } else if (x.request_type === 'missing_stop') {
    var before=x.before_stop_id,after=x.after_stop_id,stops=r.stops||(r.stops=[]);
    var beforeIndex=before===r.from?-1:stops.findIndex(function(z){return z.place===before;});
    var afterIndex=after===r.to?stops.length:stops.findIndex(function(z){return z.place===after;});
    if(beforeIndex < -1||afterIndex<0||afterIndex!==beforeIndex+1)throw new Error('The two chosen stops are no longer adjacent; request not approved.');
    var placeId=x.missing_place_id||'';
    if(placeId&&!placeById(placeId))throw new Error('The selected existing place no longer exists; request not approved.');
    var names=x.missing_place_names||{};
    if(!names.en&&!names.hi&&!names.pa&&x.missing_place_name){var sourceLang=detectPlaceLanguage(x.missing_place_name);names[sourceLang]=x.missing_place_name;names._sourceLang=sourceLang;}
    placeId=ensureReviewedPlace(names,placeId||null);
    if(!placeId||!placeById(placeId))throw new Error('Enter a valid missing-stop name before approval.');
    var newStop={place:placeId};if(x.missing_time)newStop.time=x.missing_time;
    stops.splice(afterIndex,0,newStop);
  }
  setDirty(true);
}

      var n=edNorm(t);if(!n)return;

      if (updaterStatus) updaterStatus.textContent = updaterOn ? 'ON — users can receive new-version prompts.' : 'OFF — users will not receive new-version prompts.';
    }
    else if (act === 'updater-setting-save') {
      var updaterEnabled = contentSettings.update_notifications_enabled === true;
      await loadContentSettings();
      contentSettings.update_notifications_enabled = updaterEnabled;
      await sbFetch('/rest/v1/app_content_settings?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:1,settings:contentSettings})});
      await loadContentSettings();
      toast(contentSettings.update_notifications_enabled === updaterEnabled ? (updaterEnabled ? 'App updater saved: ON.' : 'App updater saved: OFF.') : 'Could not verify updater setting; reload and check it.');
      render();
    }
    else if (act === 'content-save') {
      contentSettings = {
        terms_enabled:document.getElementById('content_terms_enabled').checked,
        terms:{en:document.getElementById('content_terms_en').value.trim(),hi:document.getElementById('content_terms_hi').value.trim(),pa:document.getElementById('content_terms_pa').value.trim()},
        popup_enabled:document.getElementById('content_popup_enabled').checked,
        popup:{en:document.getElementById('content_popup_en').value.trim(),hi:document.getElementById('content_popup_hi').value.trim(),pa:document.getElementById('content_popup_pa').value.trim()},
        popup_seconds:Math.max(5,Math.min(60,parseInt(document.getElementById('content_popup_seconds').value,10)||5)),
        ticker_enabled:document.getElementById('content_ticker_enabled').checked,
        ticker:{en:document.getElementById('content_ticker_en').value.trim(),hi:document.getElementById('content_ticker_hi').value.trim(),pa:document.getElementById('content_ticker_pa').value.trim()},
        update_notifications_enabled:contentSettings.update_notifications_enabled===true
      };
      await sbFetch('/rest/v1/app_content_settings?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:1,settings:contentSettings})});
      toast('App popup and ticker settings saved. Terms & Conditions were saved unchanged.'); render();
    }

    else if (act === 'ad-subtab') { adSubtab=b.getAttribute('data-sub')==='startio'?'startio':'my'; render(); }
    else if (act === 'ad-save-my') {
      adConfig.my.enabled=!!document.getElementById('ad_my_enabled').checked;
      adConfig.my.category=document.getElementById('ad_category').value;
      adConfig.my.close_delay=Math.max(2,Math.min(4,parseInt(document.getElementById('ad_close_delay').value,10)||3));
      var posterInput=document.getElementById('ad_poster_file');
      var posterFile=posterInput&&posterInput.files&&posterInput.files[0];
      var manualPosterUrl=document.getElementById('ad_poster_url').value.trim();
      if(posterFile){
        toast('Uploading poster…');
        await uploadAdPoster(posterFile);
        document.getElementById('ad_poster_url').value=adConfig.my.poster_url;
      }else{
        adConfig.my.poster_url=manualPosterUrl;
      }
      adConfig.my.start_date=document.getElementById('ad_start_date').value;
      adConfig.my.end_date=document.getElementById('ad_end_date').value;
      adConfig.my.check_route_enabled=document.getElementById('ad_check_route_enabled').checked;
      var targetValue=document.getElementById('ad_target_id').value;
      adConfig.my.target_kind=targetValue?targetValue.split(':')[0]:'';
      adConfig.my.target_id=targetValue?targetValue.substring(targetValue.indexOf(':')+1):'';
      adConfig.my.route_id=adConfig.my.target_kind==='route'?adConfig.my.target_id:'';
      adConfig.my.call_enabled=document.getElementById('ad_call_enabled').checked;
      adConfig.my.phone=document.getElementById('ad_phone').value.trim();
      adConfig.my.link_enabled=document.getElementById('ad_link_enabled').checked;
      adConfig.my.url=document.getElementById('ad_url').value.trim();
      adConfig.my.link_label=document.getElementById('ad_link_label').value.trim()||'Learn more';
      var actionKind=targetValue?targetValue.split(':')[0]:(adConfig.my.category==='bus_route'?'route':adConfig.my.category==='bus_operator'?'operator':'');adConfig.my.cta_label=adActionLabel(actionKind);
      if(adConfig.my.enabled&&!adConfig.my.poster_url)throw new Error('Upload or enter a poster URL before enabling the campaign.');
      if(adConfig.my.start_date&&adConfig.my.end_date&&adConfig.my.end_date<adConfig.my.start_date)throw new Error('Campaign end date must be on/after start date.');
      if(adConfig.my.check_route_enabled&&!adConfig.my.target_id)throw new Error('Choose a listed target for the selected campaign category.');
      if(adConfig.my.call_enabled&&!adConfig.my.phone)throw new Error('Enter a phone number for Call.');
      if(adConfig.my.link_enabled&&!/^https?:\/\//i.test(adConfig.my.url))throw new Error('Enter a valid http:// or https:// URL.');
      await saveAdConfig();toast('My Advertisement settings saved.');render();
    }
    else if (act === 'ad-save-startio') {
      adConfig.startio.app_id=document.getElementById('ad_startio_app_id').value.trim();
      adConfig.startio.banner_enabled=document.getElementById('ad_banner_enabled').checked;
      adConfig.startio.main_banner_enabled=document.getElementById('ad_main_banner_enabled').checked;
      adConfig.startio.book_bus_banner_enabled=document.getElementById('ad_book_bus_banner_enabled').checked;
      adConfig.startio.native_enabled=document.getElementById('ad_native_enabled').checked;
      adConfig.startio.results_native_enabled=document.getElementById('ad_results_native_enabled').checked;
      adConfig.startio.fullscreen_enabled=document.getElementById('ad_fullscreen_enabled').checked;
      adConfig.startio.bus_every=Math.max(1,Math.min(20,parseInt(document.getElementById('ad_bus_every').value,10)||4));
      adConfig.startio.fullscreen_every=Math.max(2,Math.min(20,parseInt(document.getElementById('ad_fullscreen_every').value,10)||5));
      await saveAdConfig();toast('Start.io settings saved.');render();
    }
    else if (act === 'ad-upload-poster') { /* file input is handled by change listener */ }
    else if (act === 'ad-delete-poster') {
      if(!confirm('Delete the saved campaign poster and clear its URL?'))return;
      await deleteAdPoster();render();
    }

    // ---- publish ----
    else if (act === 'publish') {
      b.disabled = true; b.textContent = 'Publishing...';
      await publish(); publishOpen = false; toast('Published. Data version ' + baseVersion + (publishSyncWarnings ? ' · Warning: '+publishSyncWarnings+' approval record(s) could not be marked as published; the routes are in the snapshot and will not be duplicated next time.' : '')); render();
    }
  } catch (err) {
    toast('Error: ' + err.message); render();
  }
});


document.addEventListener('change',async function(e){
  if(e.target&&e.target.id==='ad_poster_file'&&e.target.files&&e.target.files[0]){
    try{await uploadAdPoster(e.target.files[0]);render();toast('Poster uploaded. Save My Advertisement to publish it.');}
    catch(err){toast('Error: '+err.message);}
  }
});

// Poll only the Supabase MDM change log; never reload the whole GitHub snapshot.
// Wait until the panel is in a safe state so an open editor or unsaved form is not overwritten.
function canApplyMdmAutoSync() {
  return !!sbToken && !!data && !dirty && !editing && !routeReviewEditor &&
    !communityReviewEditor && !operatorFormOpen && !publishOpen &&
    ['dashboard','bus','places','routes'].indexOf(tab) >= 0;
}
async function pollMdmAutoSync() {
  if (mdmAutoSyncBusy || !canApplyMdmAutoSync()) return;
  mdmAutoSyncBusy = true;
  try {
    var changed = await mergeMdmPublishedChanges(mdmRevisionCursor);
    if (changed && canApplyMdmAutoSync()) {
      sharedBaseData = cloneSharedEntities(data);
      render();
      toast('Synced new MDM data.');
    }
  } catch (err) {
    console.warn('Automatic MDM sync failed:', err);
  } finally {
    mdmAutoSyncBusy = false;
  }
}
function startMdmAutoSync() {
  if (mdmAutoSyncTimer) clearInterval(mdmAutoSyncTimer);
  mdmAutoSyncTimer = setInterval(pollMdmAutoSync, 10000);
}

// ============ Start ============
// Restore the refresh token on reload, rotate it, verify the single owner account,
// then fetch GitHub + Supabase data before opening the workspace.
authRestoring = true;
render();
(async function bootAdmin() {
  try {
    var restored = await restoreAdminSession();
    authRestoring = false;
    if (!restored) { render(); return; }
    dataLoadError = ''; subsError = '';
    render();
    var loads = await Promise.allSettled([loadData(), loadSubs(), loadCommunity(), loadAdConfig()]);
    if (loads[0].status === 'rejected') dataLoadError = loads[0].reason && loads[0].reason.message || 'Could not load GitHub route data.';
    if (loads[1].status === 'rejected') subsError = loads[1].reason && loads[1].reason.message || 'Could not load route submissions.';
    if (loads.some(function(x){return x.status==='rejected';})) toast('Some data failed to load. Check your connection and use Refresh in that section.');
    render();
    startMdmAutoSync();
  } catch (err) {
    console.error('Bustime admin startup failed:', err);
    authRestoring = false;
    dataLoadError = (err && err.name === 'AbortError') ? 'The server took too long to respond. Check your connection and retry.' : ((err && err.message) || 'Admin startup failed. Please reload and sign in again.');
    try { render(); } catch (renderError) { console.error('Admin recovery render failed:', renderError); }
  }
})();
